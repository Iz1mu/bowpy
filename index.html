class _ShFunc:
    """One translated instance of a Python function (one per distinct set of argument types)."""
    def __init__(self, key, name, ptypes):
        self.key = key
        self.name = name              # GLSL name
        self.ptypes = ptypes
        self.ret = None               # return type once known ('void' when nothing is returned)
        self.code = None


class _ShCompiler:
    def __init__(self, api, runtime=None):
        self.api = api                              # BowPy API objects by name (identity decides what is built in)
        self.rt = runtime or {}                     # callbacks: source_of(fn), is_mobile()
        self.funcs = {}                             # key -> _ShFunc
        self.order = []                             # finished functions, callees first
        self.stack = []
        self.helpers = set()
        self.uniforms = []                          # [{key, kind, type, slot, count, g, name}]
        self.uni_index = {}                         # (id(globals), name) -> uniform entry
        self.nslots = 0
        self.uses_scene = False
        self.uses_live = False
        self._mk_builtin_ids()

    # ── what counts as built in ──
    _FUNC_NAMES = ('sin cos tan asin acos atan atan2 sinh cosh tanh sqrt exp exp2 log log2 log10 floor ceil trunc round '
                   'abs fabs min max pow hypot degrees radians fmod copysign int float bool len range '
                   'clamp lerp mix map_range smooth_step smoothstep step fract sign normalize distance dot cross length '
                   'noise noise1 noise2 noise3 get_pixel W H dt delta_time fps get_time mouse_x mouse_y mouse_pos '
                   'mouse_down is_mobile screen_width screen_height').split()

    def _mk_builtin_ids(self):
        ids = {}
        for name in self._FUNC_NAMES:
            for src in (self.api, vars(_sh_math), vars(_sh_builtins)):
                o = src.get(name)
                if o is not None and not isinstance(o, (int, float, str)):
                    ids.setdefault(id(o), name)
        self.bi_ids = ids
        self.vec_cls = {}
        for n, t in (('Vec2', 'vec2'), ('Vec3', 'vec3'), ('Vec4', 'vec4')):
            c = self.api.get(n)
            if c is not None:
                self.vec_cls[id(c)] = t
        self.math_consts = {}
        for n in ('pi', 'tau', 'e', 'inf', 'nan'):
            v = getattr(_sh_math, n, None)
            if v is not None:
                self.math_consts[n] = v

    # ── errors ──
    def fail(self, node, msg):
        ctx = self.fn_ctx
        where = ''
        if node is not None and getattr(node, 'lineno', None):
            where = '%s line %d: ' % (ctx['file'] if ctx else '?', node.lineno)
        elif ctx:
            where = '%s: ' % ctx['file']
        raise _ShaderError('%s%s' % (where, msg))

    fn_ctx = None

    # ═════════════════════ entry ═════════════════════
    def compile_entry(self, fn):
        if not isinstance(fn, _sh_types.FunctionType):
            raise _ShaderError('fragment must be a function defined with def')
        node, info = self.source_of(fn)
        if node is None:
            raise _ShaderError('fragment(): the source code of the function is not available')
        self.fn_ctx = {'file': info}
        a = node.args
        if a.vararg or a.kwarg or a.kwonlyargs or len(a.args) != 1 or a.defaults:
            self.fail(node, 'fragment must take exactly one argument: def fragment(pos)')
        f = self.instance(fn, ['vec2'], node=node, is_entry=True)
        # the shader's colour: a Vec3 (or a plain number, a grey) is opaque, a Vec4 sets its own alpha
        rt = f.ret
        if rt in ('float', 'int', 'bool'):
            conv = 'vec4(vec3(%s), 1.0)' % self.cv('R', rt, 'float')
        elif rt == 'vec3':
            conv = 'vec4(R, 1.0)'
        elif rt == 'vec4':
            conv = 'R'
        else:
            raise _ShaderError('fragment() must return a colour: Vec3(r, g, b), Vec4(r, g, b, a), (r, g, b) or a grey level, '
                               'each from 0 to 1 (it returns %s)' % ('nothing' if rt in (None, 'void') else _sh_tname(rt)))
        return f, conv

    def source_of(self, fn):
        r = self.rt.get('source_of')
        if r is None:
            raise _ShaderError('no source lookup available')
        return r(fn)

    # ═════════════════════ function instances ═════════════════════
    def instance(self, fn, argtypes, node=None, is_entry=False):
        key = (id(fn), tuple(argtypes))
        f = self.funcs.get(key)
        if f is not None:
            if f.code is None:
                self.fail(node, 'recursion is not supported in shaders (%s calls itself)' % fn.__name__)
            return f
        fnode, info = self.source_of(fn)
        if fnode is None:
            self.fail(node, 'the source code of %s() is not available, so it cannot run on the GPU' % fn.__name__)
        sig = ''.join({'bool': 'b', 'int': 'i', 'float': 'f', 'vec2': '2', 'vec3': '3', 'vec4': '4'}.get(t, 'a') for t in argtypes)
        gl_name = 'f%d_%s_%s' % (len(self.funcs), _sh_ident(fn.__name__), sig)
        f = _ShFunc(key, gl_name, list(argtypes))
        self.funcs[key] = f
        saved = (self.fn_ctx, getattr(self, 'out', None), getattr(self, 'ind', 1), getattr(self, 'loop_depth', 0))
        try:
            self.build(f, fn, fnode, info, is_entry)
        finally:
            self.fn_ctx, self.out, self.ind, self.loop_depth = saved
        self.order.append(f)
        return f

    def build(self, f, fn, fnode, info, is_entry=False):
        a = fnode.args
        names = [x.arg for x in a.args]
        if a.vararg or a.kwarg or a.kwonlyargs:
            self.fail(fnode, '%s(): *args / **kwargs are not supported in shaders' % fn.__name__)
        if len(f.ptypes) != len(names):
            self.fail(fnode, '%s() takes %d argument(s)' % (fn.__name__, len(names)))
        ctx = {'fn': fn, 'g': fn.__globals__, 'file': info, 'node': fnode, 'name': fn.__name__,
               'params': names, 'ptypes': dict(zip(names, f.ptypes)), 'vars': dict(zip(names, f.ptypes)),
               'assigned': self.assigned_names(fnode),
               'entry': is_entry, 'ret': None, 'changed': False, 'skipped': False, 'tmp': 0}
        self.fn_ctx = ctx
        self.stack.append(f.key)
        try:
            body = fnode.body
            lines = []
            for attempt in range(10):
                ctx['changed'] = False
                ctx['skipped'] = False
                ctx['tmp'] = 0
                self.out = []
                self.ind = 1
                self.loop_depth = 0
                self.stmts(body)
                lines = self.out
                if not ctx['changed'] and not ctx['skipped']:
                    break
            else:
                self.fail(fnode, 'could not work out the types of the variables in %s()' % fn.__name__)
            if ctx['skipped']:
                self.fail(fnode, 'could not work out the type of a variable in %s()' % fn.__name__)
        finally:
            self.stack.pop()
        f.ret = ctx['ret'] if ctx['ret'] is not None else 'void'
        rtype = f.ret
        params = ', '.join('%s %s' % (t, 'v_' + _sh_ident(n)) for n, t in zip(names, f.ptypes))
        decl = []
        for n, t in ctx['vars'].items():
            if n in names:
                continue
            decl.append('  %s %s = %s;' % (self.glsl_t(t), 'v_' + _sh_ident(n), _sh_zero(t)))
        tail = '' if rtype == 'void' else '  return %s;\\n' % _sh_zero(rtype)
        f.code = '%s %s(%s) {\\n%s\\n%s\\n%s}' % (rtype, f.name, params, '\\n'.join(decl), '\\n'.join(lines), tail)

    def glsl_t(self, t):
        return t

    def assigned_names(self, fnode):
        """Every name the function assigns (Python makes those local for the whole function)."""
        out = set()

        def targets(t):
            if isinstance(t, _sh_ast.Name):
                out.add(t.id)
            elif isinstance(t, (_sh_ast.Tuple, _sh_ast.List)):
                for e in t.elts:
                    targets(e)
        for node in _sh_ast.walk(fnode):
            if isinstance(node, _sh_ast.Assign):
                for t in node.targets:
                    targets(t)
            elif isinstance(node, (_sh_ast.AugAssign, _sh_ast.AnnAssign)):
                targets(node.target)
            elif isinstance(node, (_sh_ast.For, _sh_ast.AsyncFor)):
                targets(node.target)
        return out

    # ═════════════════════ conversions ═════════════════════
    def cv(self, code, frm, to):
        """Convert an expression between types (scalars promote; a scalar fills a vector)."""
        if frm == to:
            return code
        if to == 'float' and frm in ('int', 'bool'):
            return 'float(%s)' % code
        if to == 'int' and frm in ('float', 'bool'):
            return 'int(%s)' % code
        if to == 'bool' and frm in ('int', 'float'):
            return '(%s != %s)' % (code, '0' if frm == 'int' else '0.0')
        if _sh_is_vec(to) and frm in _SH_RANK:
            c = code if frm == 'float' else 'float(%s)' % code
            return '%s(%s)' % (to, c)
        raise _ShaderError('cannot use %s where %s is needed' % (_sh_tname(frm), _sh_tname(to)))

    def conv(self, node, code, frm, to):
        try:
            return self.cv(code, frm, to)
        except _ShaderError as e:
            self.fail(node, str(e))

    def truth(self, node, code, t):
        if t == 'bool':
            return code
        if t == 'int':
            return '(%s != 0)' % code
        if t == 'float':
            return '(%s != 0.0)' % code
        self.fail(node, 'a %s cannot be used as a condition' % _sh_tname(t))

    # ═════════════════════ statements ═════════════════════
    def emit(self, line):
        self.out.append('  ' * self.ind + line)

    def stmts(self, body):
        for s in body:
            try:
                self.stmt(s)
            except _ShUnknown:
                self.fn_ctx['skipped'] = True

    def stmt(self, n):
        t = type(n).__name__
        if t in _SH_UNSUPPORTED:
            self.fail(n, '%s cannot be used in a shader (it runs on the GPU)' % _SH_UNSUPPORTED[t])
        m = getattr(self, 'st_' + t, None)
        if m is None:
            self.fail(n, 'this statement (%s) is not supported in shaders' % t)
        m(n)

    def st_Pass(self, n):
        pass

    def st_Assert(self, n):
        pass

    def st_Expr(self, n):
        v = n.value
        if isinstance(v, _sh_ast.Constant):
            return                                        # docstring
        code, t = self.ex(v, allow_void=True)
        if isinstance(v, _sh_ast.Call):
            self.emit('%s;' % code)

    def st_Return(self, n):
        ctx = self.fn_ctx
        if n.value is None:
            self.emit('return;')
            return
        code, t = self.ex(n.value)
        if _sh_is_arr(t):
            self.fail(n, 'a list cannot be returned from a shader function')
        cur = ctx['ret']
        if cur is None:
            ctx['ret'] = t; ctx['changed'] = True
        elif cur != t:
            u = _sh_unify(cur, t)
            if u is None and ctx.get('entry') and cur in _SH_COLOUR and t in _SH_COLOUR:
                u = 'vec4'                    # the screen shader may return Vec3 in one place and Vec4 in another
            if u is None:
                self.fail(n, 'returns %s here but %s elsewhere' % (_sh_tname(t), _sh_tname(cur)))
            if u != cur:
                ctx['ret'] = u; ctx['changed'] = True
        want = ctx['ret']
        if ctx.get('entry') and want == 'vec4' and t != 'vec4':
            if t == 'vec3':
                self.emit('return vec4(%s, 1.0);' % code)
            elif t in _SH_RANK:
                self.emit('return vec4(vec3(%s), 1.0);' % self.cv(code, t, 'float'))
            else:
                self.fail(n, 'fragment() must return a colour: Vec3, Vec4, (r, g, b) or a grey level from 0 to 1 (this returns %s)' % _sh_tname(t))
            return
        self.emit('return %s;' % self.conv(n, code, t, want))

    def st_If(self, n):
        c, t = self.ex(n.test)
        self.emit('if (%s) {' % self.truth(n.test, c, t))
        self.ind += 1; self.stmts(n.body); self.ind -= 1
        if n.orelse:
            self.emit('} else {')
            self.ind += 1; self.stmts(n.orelse); self.ind -= 1
        self.emit('}')

    def st_Break(self, n):
        if self.loop_depth == 0:
            self.fail(n, "'break' outside a loop")
        self.emit('break;')

    def st_Continue(self, n):
        if self.loop_depth == 0:
            self.fail(n, "'continue' outside a loop")
        self.emit('continue;')

    def tmpname(self, base):
        self.fn_ctx['tmp'] += 1
        return '%s%d' % (base, self.fn_ctx['tmp'])

    def st_While(self, n):
        if n.orelse:
            self.fail(n, "'while ... else' is not supported in shaders")
        k = self.tmpname('w_')
        self.emit('for (int %s = 0; %s < %d; %s++) {' % (k, k, _SH_LOOP_CAP, k))
        self.ind += 1
        c, t = self.ex(n.test)
        self.emit('if (!%s) break;' % self.truth(n.test, c, t))
        self.loop_depth += 1; self.stmts(n.body); self.loop_depth -= 1
        self.ind -= 1
        self.emit('}')

    def st_For(self, n):
        if n.orelse:
            self.fail(n, "'for ... else' is not supported in shaders")
        if not isinstance(n.target, _sh_ast.Name):
            self.fail(n, 'a for loop can only count with a single variable')
        it = n.iter
        var = n.target.id
        if isinstance(it, _sh_ast.Call) and isinstance(it.func, _sh_ast.Name) and self.is_builtin(it.func.id, 'range'):
            if it.keywords or not (1 <= len(it.args) <= 3):
                self.fail(n, 'range() takes 1 to 3 arguments')
            vals = []
            for a in it.args:
                c, t = self.ex(a)
                if t not in _SH_RANK:
                    self.fail(a, 'range() needs numbers')
                vals.append(self.cv(c, t, 'int'))
            if len(vals) == 1:
                start, stop, step = '0', vals[0], '1'
            elif len(vals) == 2:
                start, stop, step = vals[0], vals[1], '1'
            else:
                start, stop, step = vals
            self.declare(n, var, 'int')
            k = self.tmpname('i_')
            lit = None
            if len(it.args) == 3 and isinstance(it.args[2], _sh_ast.Constant) and isinstance(it.args[2].value, int) and not isinstance(it.args[2].value, bool):
                lit = it.args[2].value
            elif len(it.args) == 3 and isinstance(it.args[2], _sh_ast.UnaryOp) and isinstance(it.args[2].op, _sh_ast.USub) and isinstance(it.args[2].operand, _sh_ast.Constant):
                lit = -it.args[2].operand.value
            elif len(it.args) < 3:
                lit = 1
            if lit == 0:
                self.fail(n, 'range() step must not be zero')
            if lit is not None:
                cond = '%s < %s' % (k, stop) if lit > 0 else '%s > %s' % (k, stop)
            else:
                cond = '(%s > 0 ? %s < %s : %s > %s)' % (step, k, stop, k, stop)
            self.emit('for (int %s = %s; %s; %s += %s) {' % (k, start, cond, k, step))
            self.ind += 1
            self.emit('%s = %s;' % ('v_' + _sh_ident(var), k))
            self.loop_depth += 1; self.stmts(n.body); self.loop_depth -= 1
            self.ind -= 1
            self.emit('}')
            return
        # for item in LIST (a list or tuple of numbers / vectors in a global variable)
        code, t = self.ex(it)
        if _sh_is_arr(t):
            k = self.tmpname('i_')
            self.declare(n, var, t[1])
            self.emit('for (int %s = 0; %s < %d; %s++) {' % (k, k, t[2], k))
            self.ind += 1
            self.emit('%s = %s;' % ('v_' + _sh_ident(var), self.arr_get(code, t, k)))
            self.loop_depth += 1; self.stmts(n.body); self.loop_depth -= 1
            self.ind -= 1
            self.emit('}')
            return
        self.fail(n, "a for loop in a shader can only use range(...) or a list stored in a global variable")

    def declare(self, node, name, t):
        """Record the type of a local variable (hoisted to the top of the function)."""
        ctx = self.fn_ctx
        if t is None:
            raise _ShUnknown()
        if t == 'void':
            self.fail(node, "this call does not return a value")
        cur = ctx['vars'].get(name)
        if cur is None:
            ctx['vars'][name] = t; ctx['changed'] = True
            return t
        if cur == t:
            return cur
        u = _sh_unify(cur, t)
        if u is None:
            self.fail(node, "the variable '%s' is %s here but %s elsewhere - a shader variable keeps one type"
                      % (name, _sh_tname(t), _sh_tname(cur)))
        if u != cur:
            if name in ctx['params']:
                self.fail(node, "the parameter '%s' is %s and cannot take %s" % (name, _sh_tname(cur), _sh_tname(t)))
            ctx['vars'][name] = u; ctx['changed'] = True
        return u

    def st_Assign(self, n):
        # a = b = value
        code, t = self.ex(n.value)
        if _sh_is_arr(t):
            self.fail(n, 'lists can only be read from global variables in a shader (they cannot be created or changed here)')
        for tgt in n.targets:
            self.assign_to(n, tgt, code, t, n.value)

    def st_AnnAssign(self, n):
        if n.value is None:
            return
        code, t = self.ex(n.value)
        self.assign_to(n, n.target, code, t, n.value)

    def st_AugAssign(self, n):
        tgt = n.target
        load = _sh_ast.copy_location(self.as_load(tgt), tgt)
        fake = _sh_ast.BinOp(left=load, op=n.op, right=n.value)
        _sh_ast.copy_location(fake, n)
        code, t = self.ex(fake)
        self.assign_to(n, tgt, code, t, n.value)

    def as_load(self, tgt):
        if isinstance(tgt, _sh_ast.Name):
            return _sh_ast.Name(id=tgt.id, ctx=_sh_ast.Load())
        if isinstance(tgt, _sh_ast.Attribute):
            return _sh_ast.Attribute(value=tgt.value, attr=tgt.attr, ctx=_sh_ast.Load())
        if isinstance(tgt, _sh_ast.Subscript):
            return _sh_ast.Subscript(value=tgt.value, slice=tgt.slice, ctx=_sh_ast.Load())
        self.fail(tgt, 'cannot assign to this')

    def assign_to(self, node, tgt, code, t, valnode):
        if isinstance(tgt, _sh_ast.Name):
            name = tgt.id
            self.check_local_name(tgt, name)
            ty = self.declare(node, name, t)
            self.emit('%s = %s;' % ('v_' + _sh_ident(name), self.conv(node, code, t, ty)))
        elif isinstance(tgt, (_sh_ast.Tuple, _sh_ast.List)):
            self.unpack(node, tgt, code, t, valnode)
        elif isinstance(tgt, _sh_ast.Attribute):
            base, bt = self.ex(tgt.value)
            if not isinstance(tgt.value, _sh_ast.Name) or tgt.value.id not in self.fn_ctx['vars']:
                self.fail(tgt, 'only components of a local variable can be assigned (like v.x = 1.0)')
            if not _sh_is_vec(bt):
                self.fail(tgt, 'only vector components can be assigned')
            idx = self.swizzle_idx(tgt, tgt.attr, bt)
            if len(idx) != 1:
                self.fail(tgt, "several components cannot be assigned at once (v.%s = ...): assign them one by one, like v.%s = ..." % (tgt.attr, tgt.attr[0]))
            self.emit('%s.%s = %s;' % (base, tgt.attr, self.conv(node, code, t, 'float')))
        elif isinstance(tgt, _sh_ast.Subscript):
            base, bt = self.ex(tgt.value)
            if not isinstance(tgt.value, _sh_ast.Name) or tgt.value.id not in self.fn_ctx['vars'] or not _sh_is_vec(bt):
                self.fail(tgt, 'only components of a local vector variable can be assigned (like v[0] = 1.0)')
            i = self.const_index(tgt.slice, _SH_DIMS[bt])
            if i is None:
                self.fail(tgt, 'the index of a vector component must be a number written in the code (0, 1, 2 or 3)')
            self.emit('%s[%d] = %s;' % (base, i, self.conv(node, code, t, 'float')))
        else:
            self.fail(tgt, 'cannot assign to this in a shader')

    def check_local_name(self, node, name):
        # assigning to a name that is a global would create a local in Python, shadowing it for the whole function
        pass

    def unpack(self, node, tgt, code, t, valnode):
        names = tgt.elts
        for e in names:
            if not isinstance(e, _sh_ast.Name):
                self.fail(e, 'unpacking can only assign to plain variables')
        if isinstance(valnode, (_sh_ast.Tuple, _sh_ast.List)) and len(valnode.elts) == len(names):
            vals = [self.ex(x) for x in valnode.elts]
            tmps = []
            for (c, ty), e in zip(vals, names):
                if _sh_is_arr(ty) or ty not in _SH_RANK and not _sh_is_vec(ty):
                    self.fail(valnode, 'cannot unpack this value')
                tn = self.tmpname('u_')
                self.emit('%s %s = %s;' % (ty, tn, c))
                tmps.append((tn, ty))
            for (tn, ty), e in zip(tmps, names):
                tt = self.declare(node, e.id, ty)
                self.emit('%s = %s;' % ('v_' + _sh_ident(e.id), self.conv(node, tn, ty, tt)))
            return
        if not _sh_is_vec(t):
            self.fail(node, 'only a vector or a tuple of the same length can be unpacked')
        if _SH_DIMS[t] != len(names):
            self.fail(node, 'cannot unpack a %s into %d variables' % (_sh_tname(t), len(names)))
        tn = self.tmpname('u_')
        self.emit('%s %s = %s;' % (t, tn, code))
        for i, e in enumerate(names):
            tt = self.declare(node, e.id, 'float')
            self.emit('%s = %s;' % ('v_' + _sh_ident(e.id), self.conv(node, '%s[%d]' % (tn, i), 'float', tt)))

    # ═════════════════════ expressions ═════════════════════
    def ex(self, n, allow_void=False):
        t = type(n).__name__
        if t in _SH_UNSUPPORTED:
            self.fail(n, '%s cannot be used in a shader (it runs on the GPU)' % _SH_UNSUPPORTED[t])
        m = getattr(self, 'ex_' + t, None)
        if m is None:
            self.fail(n, 'this kind of expression (%s) is not supported in shaders' % t)
        code, ty = m(n)
        if ty == 'void' and not allow_void:
            self.fail(n, 'this call does not return a value')
        return code, ty

    def ex_Constant(self, n):
        v = n.value
        if isinstance(v, bool):
            return ('true' if v else 'false'), 'bool'
        if isinstance(v, int):
            if abs(v) > 2147483647:
                return _sh_float(v), 'float'
            return str(v), 'int'
        if isinstance(v, float):
            return _sh_float(v), 'float'
        if isinstance(v, str):
            self.fail(n, 'text cannot be used in a shader')
        self.fail(n, '%r cannot be used in a shader' % (v,))

    def ex_Name(self, n):
        name = n.id
        ctx = self.fn_ctx
        if name in ctx['vars']:
            return 'v_' + _sh_ident(name), ctx['vars'][name]
        if name in ctx['assigned']:
            raise _ShUnknown()            # a local that is assigned later in the function: its type is not known yet
        return self.global_value(n, name)

    def ex_Tuple(self, n):
        k = len(n.elts)
        if not (2 <= k <= 4):
            self.fail(n, 'a tuple in a shader is a colour or a vector, so it must have 2, 3 or 4 numbers')
        parts = []
        for e in n.elts:
            c, t = self.ex(e)
            if t not in _SH_RANK:
                self.fail(e, 'a tuple in a shader can only hold numbers')
            parts.append(self.cv(c, t, 'float'))
        return '%s(%s)' % (_SH_VEC_OF[k], ', '.join(parts)), _SH_VEC_OF[k]

    ex_List = ex_Tuple

    def ex_UnaryOp(self, n):
        c, t = self.ex(n.operand)
        op = n.op
        if isinstance(op, _sh_ast.Not):
            return '(!%s)' % self.truth(n.operand, c, t), 'bool'
        if isinstance(op, _sh_ast.USub):
            if t == 'bool':
                return '(-%s)' % self.cv(c, t, 'int'), 'int'
            if t in ('int', 'float') or _sh_is_vec(t):
                return '(-%s)' % c, t
        if isinstance(op, _sh_ast.UAdd):
            if t == 'bool':
                return self.cv(c, t, 'int'), 'int'
            if t in ('int', 'float') or _sh_is_vec(t):
                return c, t
        self.fail(n, 'this operator cannot be used on a %s in a shader' % _sh_tname(t))

    def ex_BoolOp(self, n):
        parts = []
        for v in n.values:
            c, t = self.ex(v)
            parts.append(self.truth(v, c, t))
        op = ' && ' if isinstance(n.op, _sh_ast.And) else ' || '
        return '(%s)' % op.join(parts), 'bool'

    def ex_IfExp(self, n):
        c, t = self.ex(n.test)
        a, ta = self.ex(n.body)
        b, tb = self.ex(n.orelse)
        u = _sh_unify(ta, tb)
        if u is None:
            self.fail(n, 'the two sides of this if-else give %s and %s' % (_sh_tname(ta), _sh_tname(tb)))
        return '(%s ? %s : %s)' % (self.truth(n.test, c, t), self.conv(n, a, ta, u), self.conv(n, b, tb, u)), u

    def ex_Compare(self, n):
        parts = []
        left, lt = self.ex(n.left)
        for op, rnode in zip(n.ops, n.comparators):
            right, rt = self.ex(rnode)
            sym = {_sh_ast.Lt: '<', _sh_ast.LtE: '<=', _sh_ast.Gt: '>', _sh_ast.GtE: '>=', _sh_ast.Eq: '==', _sh_ast.NotEq: '!='}.get(type(op))
            if sym is None:
                self.fail(n, "'is' / 'in' comparisons are not supported in shaders")
            if _sh_is_vec(lt) or _sh_is_vec(rt) or _sh_is_arr(lt) or _sh_is_arr(rt):
                self.fail(n, 'vectors and lists cannot be compared in a shader - compare their components (a.x == b.x)')
            else:
                if lt not in _SH_RANK or rt not in _SH_RANK:
                    self.fail(n, 'cannot compare %s with %s' % (_sh_tname(lt), _sh_tname(rt)))
                u = lt if _SH_RANK[lt] >= _SH_RANK[rt] else rt
                if u == 'bool' and sym not in ('==', '!='):
                    u = 'int'
                parts.append('(%s %s %s)' % (self.cv(left, lt, u), sym, self.cv(right, rt, u)))
            left, lt = right, rt
        return (parts[0] if len(parts) == 1 else '(%s)' % ' && '.join(parts)), 'bool'

    def arith_types(self, n, lt, rt):
        if lt not in _SH_RANK and not _sh_is_vec(lt) or rt not in _SH_RANK and not _sh_is_vec(rt):
            self.fail(n, 'cannot do arithmetic with %s and %s' % (_sh_tname(lt), _sh_tname(rt)))
        if _sh_is_vec(lt) and _sh_is_vec(rt) and lt != rt:
            self.fail(n, 'cannot combine a %s and a %s' % (_sh_tname(lt), _sh_tname(rt)))

    def ex_BinOp(self, n):
        l, lt = self.ex(n.left)
        r, rt = self.ex(n.right)
        op = n.op
        self.arith_types(n, lt, rt)
        sym = {_sh_ast.Add: '+', _sh_ast.Sub: '-', _sh_ast.Mult: '*', _sh_ast.Div: '/'}.get(type(op))
        vec = _sh_is_vec(lt) or _sh_is_vec(rt)
        if sym is not None:
            if vec:
                vt = lt if _sh_is_vec(lt) else rt
                lc = l if _sh_is_vec(lt) else self.cv(l, lt, 'float')
                rc = r if _sh_is_vec(rt) else self.cv(r, rt, 'float')
                return '(%s %s %s)' % (lc, sym, rc), vt
            if sym == '/':
                return '(%s / %s)' % (self.cv(l, lt, 'float'), self.cv(r, rt, 'float')), 'float'
            u = lt if _SH_RANK[lt] >= _SH_RANK[rt] else rt
            if u == 'bool':
                u = 'int'
            return '(%s %s %s)' % (self.cv(l, lt, u), sym, self.cv(r, rt, u)), u
        if isinstance(op, _sh_ast.Mod):
            if vec:
                vt = lt if _sh_is_vec(lt) else rt
                lc = l if _sh_is_vec(lt) else '%s(%s)' % (vt, self.cv(l, lt, 'float'))
                rc = r if _sh_is_vec(rt) else self.cv(r, rt, 'float')
                return 'mod(%s, %s)' % (lc, rc), vt
            if lt != 'float' and rt != 'float':
                self.helpers.add('imod')
                return 'bp_imod(%s, %s)' % (self.cv(l, lt, 'int'), self.cv(r, rt, 'int')), 'int'
            return 'mod(%s, %s)' % (self.cv(l, lt, 'float'), self.cv(r, rt, 'float')), 'float'
        if isinstance(op, _sh_ast.FloorDiv):
            if vec:
                vt = lt if _sh_is_vec(lt) else rt
                lc = l if _sh_is_vec(lt) else '%s(%s)' % (vt, self.cv(l, lt, 'float'))
                rc = r if _sh_is_vec(rt) else '%s(%s)' % (vt, self.cv(r, rt, 'float'))
                return 'floor(%s / %s)' % (lc, rc), vt
            if lt != 'float' and rt != 'float':
                self.helpers.add('idiv')
                return 'bp_idiv(%s, %s)' % (self.cv(l, lt, 'int'), self.cv(r, rt, 'int')), 'int'
            return 'floor(%s / %s)' % (self.cv(l, lt, 'float'), self.cv(r, rt, 'float')), 'float'
        if isinstance(op, _sh_ast.Pow):
            return self.power(n, l, lt, r, rt)
        self.fail(n, 'this operator is not supported in shaders (bit operations and @ are not available)')

    def power(self, n, l, lt, r, rt):
        # literal exponents turn into plain multiplication (fast, and correct for negative bases)
        exp = None
        rn = n.right
        if isinstance(rn, _sh_ast.Constant) and isinstance(rn.value, (int, float)) and not isinstance(rn.value, bool):
            exp = rn.value
        if _sh_is_vec(lt):
            if exp == 2:
                self.helpers.add('sq'); return 'bp_sq(%s)' % l, lt
            if exp == 3:
                self.helpers.add('cube'); return 'bp_cube(%s)' % l, lt
            if exp == 0.5:
                return 'sqrt(%s)' % l, lt
            rc = r if _sh_is_vec(rt) else '%s(%s)' % (lt, self.cv(r, rt, 'float'))
            return 'pow(%s, %s)' % (l, rc), lt
        if _sh_is_vec(rt):
            lc = '%s(%s)' % (rt, self.cv(l, lt, 'float'))
            return 'pow(%s, %s)' % (lc, r), rt
        if lt in ('int', 'bool') and exp is not None and isinstance(exp, int) and 0 <= exp <= 4:
            li = self.cv(l, lt, 'int')
            if exp == 0:
                return '1', 'int'
            if exp == 1:
                return li, 'int'
            return '(%s)' % ' * '.join([li] * exp), 'int'
        lf, rf = self.cv(l, lt, 'float'), self.cv(r, rt, 'float')
        if exp == 2:
            self.helpers.add('sq'); return 'bp_sq(%s)' % lf, 'float'
        if exp == 3:
            self.helpers.add('cube'); return 'bp_cube(%s)' % lf, 'float'
        if exp == 0.5:
            return 'sqrt(%s)' % lf, 'float'
        if exp == 1:
            return lf, 'float'
        self.helpers.add('pow')
        return 'bp_pow(%s, %s)' % (lf, rf), 'float'

    # ── attributes, subscripts ──
    _SWZ = {'xyzw': 'xyzw', 'rgba': 'rgba'}

    def swizzle_idx(self, node, attr, t):
        dim = _SH_DIMS[t]
        for set_ in ('xyzw', 'rgba'):
            if attr and all(ch in set_ for ch in attr):
                idx = [set_.index(ch) for ch in attr]
                if len(idx) > 4:
                    break
                if max(idx) >= dim:
                    self.fail(node, "a %s has no component '%s'" % (_sh_tname(t), attr))
                return idx
        self.fail(node, "a %s has no attribute '%s'" % (_sh_tname(t), attr))

    def ex_Attribute(self, n):
        # module attributes: math.pi, tabname.CONSTANT
        mod = self.module_of(n.value)
        if mod is not None:
            return self.global_value(n, n.attr, g=mod.__dict__, qual=getattr(mod, '__name__', '?'))
        c, t = self.ex(n.value)
        if _sh_is_vec(t):
            idx = self.swizzle_idx(n, n.attr, t)
            return '%s.%s' % (c, n.attr), ('float' if len(idx) == 1 else _SH_VEC_OF[len(idx)])
        self.fail(n, "'.%s' cannot be used on %s in a shader" % (n.attr, _sh_tname(t)))

    def const_index(self, sl, dim):
        v = None
        if isinstance(sl, _sh_ast.Constant) and isinstance(sl.value, int) and not isinstance(sl.value, bool):
            v = sl.value
        elif isinstance(sl, _sh_ast.UnaryOp) and isinstance(sl.op, _sh_ast.USub) and isinstance(sl.operand, _sh_ast.Constant) \\
                and isinstance(sl.operand.value, int):
            v = -sl.operand.value
        if v is None:
            return None
        if v < 0:
            v += dim
        if not (0 <= v < dim):
            return None
        return v

    def ex_Subscript(self, n):
        c, t = self.ex(n.value)
        if _sh_is_vec(t):
            i = self.const_index(n.slice, _SH_DIMS[t])
            if i is None:
                self.fail(n, 'the index of a vector component must be 0 .. %d, written as a number' % (_SH_DIMS[t] - 1))
            return '%s[%d]' % (c, i), 'float'
        if _sh_is_arr(t):
            size = t[2]
            ci = self.const_index(n.slice, size)
            if ci is not None:
                return self.arr_get(c, t, str(ci)), t[1]
            ic, it = self.ex(n.slice)
            if it not in _SH_RANK:
                self.fail(n, 'a list index must be a number')
            return self.arr_get(c, t, 'clamp(%s, 0, %d)' % (self.cv(ic, it, 'int'), size - 1)), t[1]
        self.fail(n, 'a %s cannot be indexed in a shader' % _sh_tname(t))

    def arr_get(self, code, t, idx):
        """code is 'uU:<first slot>' for a uniform array; idx is a GLSL int expression."""
        base = int(code.split(':')[1])
        elem = t[1]
        slot = 'uU[%d + %s]' % (base, idx)
        if elem == 'float':
            return '%s.x' % slot
        if elem == 'bool':
            return '(%s.x > 0.5)' % slot
        return slot if elem == 'vec4' else '%s.%s' % (slot, 'xy' if elem == 'vec2' else 'xyz')

    # ═════════════════════ globals ═════════════════════
    def module_of(self, node):
        """If node names a module (math, a code tab ...) return it."""
        if isinstance(node, _sh_ast.Name):
            if node.id in self.fn_ctx['vars']:
                return None
            obj = self.lookup(node.id)
            if isinstance(obj, _sh_types.ModuleType):
                return obj
        return None

    def lookup(self, name, g=None):
        g = self.fn_ctx['g'] if g is None else g
        if name in g:
            return g[name]
        return getattr(_sh_builtins, name, None)

    def is_builtin(self, name, want):
        if name in self.fn_ctx['vars']:
            return False
        obj = self.lookup(name)
        return self.bi_ids.get(id(obj)) == want

    def global_value(self, node, name, g=None, qual=None):
        """A name that is not a local variable: a constant, a global variable (-> uniform), or an error."""
        g = self.fn_ctx['g'] if g is None else g
        if name not in g:
            hint = ' (it is not available in shaders)' if hasattr(_sh_builtins, name) else ''
            self.fail(node, "the name '%s' is not defined%s" % (qual and '%s.%s' % (qual, name) or name, hint))
        obj = g[name]
        if name in self.math_consts and obj is self.math_consts[name]:
            return _sh_float(obj), 'float'
        # numeric values that BowPy itself defines (pi ...) are baked into the shader
        baked = self.api.get(name) is obj and isinstance(obj, (int, float)) and not isinstance(obj, bool)
        if isinstance(obj, bool):
            return self.scalar_global(node, name, g, obj, 'bool', baked)
        if isinstance(obj, (int, float)):
            return self.scalar_global(node, name, g, obj, 'float', baked, int_lit=isinstance(obj, int))
        vt = self.vec_type_of(obj)
        if vt is not None:
            if baked:
                return '%s(%s)' % (vt, ', '.join(_sh_float(c) for c in self.vec_parts(obj))), vt
            return self.uniform(node, name, g, 'vec', vt, 1)
        if isinstance(obj, (list, tuple)) and len(obj) > 0:
            et = self.elem_type(node, name, obj)
            if et is not None:
                if isinstance(obj, tuple) and 2 <= len(obj) <= 4 and et == 'float':
                    return self.uniform(node, name, g, 'vec', _SH_VEC_OF[len(obj)], 1, tuple_vec=True)
                n_ = len(obj)
                if n_ > _SH_MAX_SLOTS:
                    self.fail(node, "the list '%s' has %d items; at most %d fit in a shader" % (name, n_, _SH_MAX_SLOTS))
                return self.uniform(node, name, g, 'arr', ('arr', et, n_), n_)
        if isinstance(obj, (list, tuple)):
            self.fail(node, "the list '%s' cannot be used in a shader: it must hold only numbers, or only Vec2/Vec3/Vec4 of the same kind" % name)
        if isinstance(obj, str):
            self.fail(node, "the text variable '%s' cannot be used in a shader" % name)
        if isinstance(obj, _sh_types.FunctionType) or callable(obj):
            self.fail(node, "'%s' is a function: call it with () inside the shader" % name)
        self.fail(node, "the global variable '%s' (a %s) cannot be used in a shader; shaders can read numbers, booleans, Vec2/Vec3/Vec4 and lists of those"
                  % (name, type(obj).__name__))

    def vec_type_of(self, obj):
        t = self.vec_cls.get(id(type(obj)))
        return t

    def vec_parts(self, v):
        t = self.vec_type_of(v)
        d = _SH_DIMS[t]
        return [float(getattr(v, c)) for c in 'xyzw'[:d]]

    def elem_type(self, node, name, seq):
        kinds = set()
        for v in seq:
            if isinstance(v, bool):
                kinds.add('bool')
            elif isinstance(v, (int, float)):
                kinds.add('float')
            elif self.vec_type_of(v) is not None:
                kinds.add(self.vec_type_of(v))
            elif isinstance(v, (tuple, list)) and 2 <= len(v) <= 4 and all(isinstance(x, (int, float)) and not isinstance(x, bool) for x in v):
                kinds.add(_SH_VEC_OF[len(v)])
            else:
                return None
        if len(kinds) != 1:
            if kinds <= {'float'}:
                return 'float'
            return None
        return kinds.pop()

    def scalar_global(self, node, name, g, obj, t, baked, int_lit=False):
        if baked:
            if t == 'bool':
                return ('true' if obj else 'false'), 'bool'
            return (str(obj), 'int') if int_lit and abs(obj) <= 2147483647 else (_sh_float(obj), 'float')
        return self.uniform(node, name, g, 'scalar', t, 1)

    def uniform(self, node, name, g, kind, t, count, tuple_vec=False):
        key = (id(g), name)
        u = self.uni_index.get(key)
        if u is None:
            if self.nslots + count > _SH_MAX_SLOTS:
                self.fail(node, 'the shader uses too many global variables / list items (the limit is %d values)' % _SH_MAX_SLOTS)
            u = {'key': key, 'kind': kind, 'type': t, 'slot': self.nslots, 'count': count, 'g': g, 'name': name, 'tuple_vec': tuple_vec}
            self.nslots += count
            self.uniforms.append(u)
            self.uni_index[key] = u
        slot = u['slot']
        if kind == 'scalar':
            if t == 'bool':
                return '(uU[%d].x > 0.5)' % slot, 'bool'
            return 'uU[%d].x' % slot, 'float'
        if kind == 'vec':
            sw = {'vec2': 'xy', 'vec3': 'xyz', 'vec4': 'xyzw'}[t]
            return ('uU[%d]' % slot if t == 'vec4' else 'uU[%d].%s' % (slot, sw)), t
        return 'uU:%d' % slot, t

    # ═════════════════════ calls ═════════════════════
    def ex_Call(self, n):
        f = n.func
        # tab.func(...)  /  math.sin(...)
        if isinstance(f, _sh_ast.Attribute):
            mod = self.module_of(f.value)
            if mod is not None:
                obj = self.lookup(f.attr, mod.__dict__)
                if obj is None:
                    self.fail(n, "'%s' has no function called '%s'" % (getattr(mod, '__name__', 'module'), f.attr))
                return self.call_obj(n, obj, f.attr)
            # Vec2.dot(a, b)  /  Vec3.lerp(a, b, t) ...
            if isinstance(f.value, _sh_ast.Name) and f.value.id not in self.fn_ctx['vars']:
                cls = self.lookup(f.value.id)
                vt = self.vec_cls.get(id(cls))
                if vt is not None:
                    return self.vec_static(n, vt, f.attr)
            # vector methods:  v.length()  v.normalized() ...
            c, t = self.ex(f.value)
            if _sh_is_vec(t):
                return self.vec_method(n, c, t, f.attr)
            self.fail(n, "'.%s()' cannot be called on %s in a shader" % (f.attr, _sh_tname(t)))
        if isinstance(f, _sh_ast.Name):
            if f.id in self.fn_ctx['vars']:
                self.fail(n, "'%s' is a variable, not a function" % f.id)
            obj = self.lookup(f.id)
            if obj is None and f.id not in self.fn_ctx['g']:
                self.fail(n, "the function '%s' is not defined" % f.id)
            return self.call_obj(n, obj, f.id)
        self.fail(n, 'only plain function calls can be used in a shader')

    def call_obj(self, n, obj, name):
        if id(obj) in self.vec_cls:
            return self.vec_ctor(n, self.vec_cls[id(obj)])
        bn = self.bi_ids.get(id(obj))
        if bn is not None:
            return self.builtin(n, bn)
        if isinstance(obj, _sh_types.FunctionType):
            return self.call_user(n, obj)
        if getattr(obj, '__module__', None) == 'random' or name in ('random', 'randint', 'uniform', 'choice', 'shuffle'):
            self.fail(n, "random numbers are not available in shaders - use noise2(x, y) for a pattern that depends on the position")
        self.fail(n, "'%s' cannot be called in a shader%s" % (name, '' if callable(obj) else ' (it is not a function)'))

    def args(self, n, minn=None, maxn=None, kw=()):
        if minn is not None and len(n.args) < minn or maxn is not None and len(n.args) > maxn:
            name = n.func.id if isinstance(n.func, _sh_ast.Name) else n.func.attr
            self.fail(n, '%s() takes %s argument(s)' % (name, minn if minn == maxn else '%s to %s' % (minn, maxn)))
        for k in n.keywords:
            if k.arg not in kw:
                self.fail(n, "unexpected keyword argument '%s'" % k.arg)
        for a in n.args:
            if isinstance(a, _sh_ast.Starred):
                self.fail(n, 'starred (*) arguments are not supported in shaders')
        return [self.ex(a) for a in n.args]

    def fl(self, node, c, t):
        if t not in _SH_RANK:
            self.fail(node, 'a number is needed here, not %s' % _sh_tname(t))
        return self.cv(c, t, 'float')

    def call_user(self, n, fn):
        fnode, info = self.source_of(fn)
        if fnode is None:
            self.fail(n, 'the source of %s() is not available, so it cannot run on the GPU' % fn.__name__)
        a = fnode.args
        names = [x.arg for x in a.args]
        if a.vararg or a.kwarg or a.kwonlyargs:
            self.fail(n, '%s(): *args / **kwargs are not supported in shaders' % fn.__name__)
        for x in n.args:
            if isinstance(x, _sh_ast.Starred):
                self.fail(n, 'starred (*) arguments are not supported in shaders')
        vals = [self.ex(x) for x in n.args]
        if len(vals) > len(names):
            self.fail(n, '%s() takes %d argument(s) but %d were given' % (fn.__name__, len(names), len(vals)))
        by_name = {}
        for k in n.keywords:
            if k.arg is None or k.arg not in names:
                self.fail(n, "%s() has no argument '%s'" % (fn.__name__, k.arg))
            if names.index(k.arg) < len(vals):
                self.fail(n, "%s() got more than one value for '%s'" % (fn.__name__, k.arg))
            by_name[k.arg] = self.ex(k.value)
        defaults = list(fn.__defaults__ or ())
        first_default = len(names) - len(defaults)
        full = list(vals)
        for i in range(len(vals), len(names)):
            nm = names[i]
            if nm in by_name:
                full.append(by_name[nm])
            elif i >= first_default:
                full.append(self.const_value(n, defaults[i - first_default]))
            else:
                self.fail(n, "%s() is missing the argument '%s'" % (fn.__name__, nm))
        types = []
        for (c, t) in full:
            if _sh_is_arr(t):
                self.fail(n, 'lists cannot be passed to shader functions (use the global list directly)')
            types.append(t)
        f = self.instance(fn, types, node=n)
        code = '%s(%s)' % (f.name, ', '.join(c for c, t in full))
        return code, f.ret

    def const_value(self, node, v):
        if isinstance(v, bool):
            return ('true' if v else 'false'), 'bool'
        if isinstance(v, int):
            return str(v), 'int'
        if isinstance(v, float):
            return _sh_float(v), 'float'
        vt = self.vec_type_of(v)
        if vt is not None:
            return '%s(%s)' % (vt, ', '.join(_sh_float(c) for c in self.vec_parts(v))), vt
        self.fail(node, 'a default argument value of this kind cannot be used in a shader')

    # ── vectors ──
    def vec_ctor(self, n, vt):
        dim = _SH_DIMS[vt]
        if n.keywords:
            self.fail(n, '%s() does not take keyword arguments in a shader' % vt.replace('vec', 'Vec'))
        comps = []
        for a in n.args:
            c, t = self.ex(a)
            if t in _SH_RANK:
                comps.append((self.cv(c, t, 'float'), 1))
            elif _sh_is_vec(t):
                comps.append((c, _SH_DIMS[t]))
            else:
                self.fail(a, 'a vector is made from numbers, not from %s' % _sh_tname(t))
        total = sum(k for c, k in comps)
        if total > dim:
            self.fail(n, '%s() was given %d values' % (vt.replace('vec', 'Vec'), total))
        if not comps:
            return '%s(0.0)' % vt, vt
        parts = [c for c, k in comps] + ['0.0'] * (dim - total)
        if len(comps) == 1 and comps[0][1] == dim:
            return comps[0][0], vt
        return '%s(%s)' % (vt, ', '.join(parts)), vt

    def vec_static(self, n, vt, attr):
        nm = vt.replace('vec', 'Vec')
        dim = _SH_DIMS[vt]
        consts = {'zero': 0.0, 'one': 1.0}
        dirs = {'up': (0.0, -1.0, 0.0), 'down': (0.0, 1.0, 0.0), 'left': (-1.0, 0.0, 0.0), 'right': (1.0, 0.0, 0.0),
                'front': (0.0, 0.0, 1.0), 'back': (0.0, 0.0, -1.0)}
        if attr in consts and not n.args:
            return '%s(%s)' % (vt, _sh_float(consts[attr])), vt
        if attr in dirs and not n.args and not (dim == 2 and attr in ('front', 'back')):
            return '%s(%s)' % (vt, ', '.join(_sh_float(x) for x in dirs[attr][:dim])), vt
        if attr == 'dot':
            (a, ta), (b, tb) = self.vecs(n, vt, 2)
            return 'dot(%s, %s)' % (a, b), 'float'
        if attr == 'distance':
            (a, ta), (b, tb) = self.vecs(n, vt, 2)
            return 'distance(%s, %s)' % (a, b), 'float'
        if attr == 'delta':
            (a, ta), (b, tb) = self.vecs(n, vt, 2)
            return '(%s - %s)' % (b, a), vt
        if attr == 'lerp':
            args = self.args(n, 3, 3)
            (a, ta), (b, tb), (t, tt) = args
            if ta != vt or tb != vt or tt not in _SH_RANK:
                self.fail(n, '%s.lerp(a, b, t) needs two %s and a number' % (nm, nm))
            return 'mix(%s, %s, %s)' % (a, b, self.cv(t, tt, 'float')), vt
        if attr == 'cross':
            (a, ta), (b, tb) = self.vecs(n, vt, 2)
            if vt == 'vec2':
                return '(%s.x * %s.y - %s.y * %s.x)' % (a, b, a, b), 'float'
            if vt == 'vec3':
                return 'cross(%s, %s)' % (a, b), 'vec3'
        if attr == 'from_angle' and vt == 'vec2':
            args = self.args(n, 1, 2)
            ang = self.fl(n, *args[0])
            ln = self.fl(n, *args[1]) if len(args) > 1 else '1.0'
            return '(vec2(cos(radians(%s)), sin(radians(%s))) * %s)' % (ang, ang, ln), 'vec2'
        self.fail(n, "%s.%s() is not available in shaders" % (nm, attr))

    def vecs(self, n, vt, count):
        args = self.args(n, count, count)
        for (c, t), a in zip(args, n.args):
            if t != vt:
                self.fail(a, 'a %s is needed here, not %s' % (_sh_tname(vt), _sh_tname(t)))
        return args

    def vec_method(self, n, c, t, attr):
        dim = _SH_DIMS[t]
        if n.args or n.keywords:
            if attr not in ('rotated', 'rotated_x', 'rotated_y', 'rotated_z'):
                self.fail(n, '.%s() takes no arguments' % attr)
        if attr == 'length':
            return 'length(%s)' % c, 'float'
        if attr == 'length_sq':
            return 'dot(%s, %s)' % (c, c), 'float'
        if attr == 'normalized':
            self.helpers.add('norm')
            return 'bp_normalized(%s)' % c, t
        if attr in ('copy', 'to_tuple'):
            return c, t
        if attr in ('floor', 'ceil'):
            return '%s(%s)' % (attr, c), t
        if attr == 'round':
            self.helpers.add('round')
            return 'bp_round(%s)' % c, t
        if attr == 'angle' and t == 'vec2':
            return 'degrees(atan(%s.y, %s.x))' % (c, c), 'float'
        if attr == 'rotated' and t == 'vec2':
            args = self.args(n, 1, 1)
            a = self.fl(n, *args[0])
            return '(mat2(cos(radians(%s)), sin(radians(%s)), -sin(radians(%s)), cos(radians(%s))) * %s)' % (a, a, a, a, c), 'vec2'
        self.fail(n, "'.%s()' is not available on a %s in shaders" % (attr, _sh_tname(t)))

    # ── built-in functions ──
    def builtin(self, n, name):
        m = getattr(self, 'bi_' + name, None)
        if m is not None:
            return m(n)
        fn1 = {'sin': 'sin', 'cos': 'cos', 'tan': 'tan', 'asin': 'asin', 'acos': 'acos', 'atan': 'atan', 'sinh': 'sinh',
               'cosh': 'cosh', 'tanh': 'tanh', 'sqrt': 'sqrt', 'exp': 'exp', 'exp2': 'exp2', 'log2': 'log2',
               'floor': 'floor', 'ceil': 'ceil', 'trunc': 'trunc', 'fract': 'fract', 'degrees': 'degrees', 'radians': 'radians'}
        if name in fn1:
            (c, t), = self.args(n, 1, 1)
            if t in _SH_RANK:
                return '%s(%s)' % (fn1[name], self.cv(c, t, 'float')), 'float'
            if _sh_is_vec(t):
                return '%s(%s)' % (fn1[name], c), t
            self.fail(n, '%s() needs a number' % name)
        self.fail(n, "%s() is not available in shaders" % name)

    def bi_log(self, n):
        args = self.args(n, 1, 2)
        x = self.fl(n, *args[0]) if args[0][1] in _SH_RANK else args[0][0]
        if len(args) == 2:
            return '(log(%s) / log(%s))' % (x, self.fl(n, *args[1])), 'float'
        t = args[0][1]
        return 'log(%s)' % x, ('float' if t in _SH_RANK else t)

    def bi_log10(self, n):
        (c, t), = self.args(n, 1, 1)
        return '(log(%s) * 0.4342944819032518)' % self.fl(n, c, t), 'float'

    def bi_atan2(self, n):
        (a, ta), (b, tb) = self.args(n, 2, 2)
        return 'atan(%s, %s)' % (self.fl(n, a, ta), self.fl(n, b, tb)), 'float'

    def bi_fabs(self, n):
        (c, t), = self.args(n, 1, 1)
        return 'abs(%s)' % self.fl(n, c, t), 'float'

    def bi_abs(self, n):
        (c, t), = self.args(n, 1, 1)
        if t == 'bool':
            return self.cv(c, t, 'int'), 'int'
        if t in ('int', 'float') or _sh_is_vec(t):
            return 'abs(%s)' % c, t
        self.fail(n, 'abs() needs a number or a vector')

    def bi_round(self, n):
        args = self.args(n, 1, 2, kw=('ndigits',))
        c, t = args[0]
        if t not in _SH_RANK and not _sh_is_vec(t):
            self.fail(n, 'round() needs a number or a vector')
        cc = self.cv(c, t, 'float') if t in _SH_RANK else c
        rt = 'float' if t in _SH_RANK else t
        self.helpers.add('round')
        nd = None
        if len(args) == 2:
            nd = n.args[1]
        elif n.keywords:
            nd = n.keywords[0].value
        if nd is None:
            return 'bp_round(%s)' % cc, rt
        if not (isinstance(nd, _sh_ast.Constant) and isinstance(nd.value, int)):
            self.fail(n, 'the number of digits of round() must be written as a number in a shader')
        k = 10.0 ** nd.value
        return '(bp_round(%s * %s) / %s)' % (cc, _sh_float(k), _sh_float(k)), rt

    def bi_hypot(self, n):
        args = self.args(n, 1, 4)
        parts = [self.fl(n, c, t) for c, t in args]
        if len(parts) == 1:
            return 'abs(%s)' % parts[0], 'float'
        return 'length(%s(%s))' % (_SH_VEC_OF[len(parts)], ', '.join(parts)), 'float'

    def bi_pow(self, n):
        (a, ta), (b, tb) = self.args(n, 2, 2)
        fake = _sh_ast.BinOp(left=n.args[0], op=_sh_ast.Pow(), right=n.args[1])
        _sh_ast.copy_location(fake, n)
        return self.power(fake, a, ta, b, tb) if ta in _SH_RANK or _sh_is_vec(ta) else self.fail(n, 'pow() needs numbers')

    def bi_fmod(self, n):
        (a, ta), (b, tb) = self.args(n, 2, 2)
        x, y = self.fl(n, a, ta), self.fl(n, b, tb)
        return '(%s - %s * trunc(%s / %s))' % (x, y, x, y), 'float'

    def bi_copysign(self, n):
        (a, ta), (b, tb) = self.args(n, 2, 2)
        return '(abs(%s) * (%s < 0.0 ? -1.0 : 1.0))' % (self.fl(n, a, ta), self.fl(n, b, tb)), 'float'

    def minmax(self, n, fname):
        args = self.args(n, 2, 8)
        ts = [t for c, t in args]
        for a, t in zip(n.args, ts):
            if t not in _SH_RANK and not _sh_is_vec(t):
                self.fail(a, '%s() needs numbers (or vectors of the same size)' % fname)
        vecs = {t for t in ts if _sh_is_vec(t)}
        if len(vecs) > 1:
            self.fail(n, 'cannot mix vectors of different sizes in %s()' % fname)
        if vecs:
            vt = vecs.pop()
            parts = [c if t == vt else '%s(%s)' % (vt, self.cv(c, t, 'float')) for c, t in args]
            rt = vt
        else:
            rt = 'float' if 'float' in ts else 'int'
            parts = [self.cv(c, t, rt) for c, t in args]
        code = parts[0]
        for p in parts[1:]:
            code = '%s(%s, %s)' % (fname, code, p)
        return code, rt

    def bi_min(self, n):
        return self.minmax(n, 'min')

    def bi_max(self, n):
        return self.minmax(n, 'max')

    def bi_clamp(self, n):
        (v, tv), (lo, tl), (hi, th) = self.args(n, 3, 3)
        for a, t in zip(n.args, (tv, tl, th)):
            if t not in _SH_RANK and not _sh_is_vec(t):
                self.fail(a, 'clamp() needs numbers (or a vector and numbers)')
        if _sh_is_vec(tv):
            lo2 = lo if _sh_is_vec(tl) else self.cv(lo, tl, 'float')
            hi2 = hi if _sh_is_vec(th) else self.cv(hi, th, 'float')
            return 'max(%s, min(%s, %s))' % (lo2, hi2, v), tv
        if _sh_is_vec(tl) or _sh_is_vec(th):
            self.fail(n, 'clamp(): the bounds can only be vectors when the value is a vector')
        rt = 'float' if 'float' in (tv, tl, th) else 'int'
        return 'max(%s, min(%s, %s))' % (self.cv(lo, tl, rt), self.cv(hi, th, rt), self.cv(v, tv, rt)), rt

    def bi_lerp(self, n):
        (a, ta), (b, tb), (t, tt) = self.args(n, 3, 3)
        if _sh_is_vec(ta) or _sh_is_vec(tb):
            vt = ta if _sh_is_vec(ta) else tb
            if (_sh_is_vec(ta) and ta != vt) or (_sh_is_vec(tb) and tb != vt):
                self.fail(n, '%s() cannot mix vectors of different sizes' % (n.func.id if isinstance(n.func, _sh_ast.Name) else 'lerp'))
            a2 = a if ta == vt else self.cv(a, ta, vt)
            b2 = b if tb == vt else self.cv(b, tb, vt)
            if tt == vt:
                return 'mix(%s, %s, %s)' % (a2, b2, t), vt
            return 'mix(%s, %s, %s)' % (a2, b2, self.fl(n, t, tt)), vt
        return 'mix(%s, %s, %s)' % (self.fl(n, a, ta), self.fl(n, b, tb), self.fl(n, t, tt)), 'float'

    def bi_mix(self, n):
        return self.bi_lerp(n)

    def bi_map_range(self, n):
        (v, tv), (a1, t1), (a2, t2), (b1, t3), (b2, t4) = self.args(n, 5, 5)
        V, A1, A2, B1, B2 = (self.fl(n, c, t) for c, t in ((v, tv), (a1, t1), (a2, t2), (b1, t3), (b2, t4)))
        return '(%s != %s ? %s + (%s - %s) / (%s - %s) * (%s - %s) : %s)' % (A1, A2, B1, V, A1, A2, A1, B2, B1, B1), 'float'

    def bi_smooth_step(self, n):
        (c, t), = self.args(n, 1, 1)
        if t in _SH_RANK:
            x = self.cv(c, t, 'float')
            self.helpers.add('sq')
            return '(bp_sq(%s) * (3.0 - 2.0 * %s))' % (x, x), 'float'
        if _sh_is_vec(t):
            self.helpers.add('sq')
            return '(bp_sq(%s) * (3.0 - 2.0 * %s))' % (c, c), t
        self.fail(n, 'smooth_step() needs a number')

    def bi_smoothstep(self, n):
        (e0, t0), (e1, t1), (x, tx) = self.args(n, 3, 3)
        if _sh_is_vec(tx):
            a = e0 if _sh_is_vec(t0) else self.fl(n, e0, t0)
            b = e1 if _sh_is_vec(t1) else self.fl(n, e1, t1)
            return 'smoothstep(%s, %s, %s)' % (a, b, x), tx
        return 'smoothstep(%s, %s, %s)' % (self.fl(n, e0, t0), self.fl(n, e1, t1), self.fl(n, x, tx)), 'float'

    def bi_step(self, n):
        (e, te), (x, tx) = self.args(n, 2, 2)
        if _sh_is_vec(tx):
            return 'step(%s, %s)' % (e if _sh_is_vec(te) else self.fl(n, e, te), x), tx
        return 'step(%s, %s)' % (self.fl(n, e, te), self.fl(n, x, tx)), 'float'

    def bi_sign(self, n):
        (c, t), = self.args(n, 1, 1)
        if t == 'bool':
            c, t = self.cv(c, t, 'int'), 'int'
        if t == 'int':
            return 'sign(%s)' % c, 'int'
        if t == 'float' or _sh_is_vec(t):
            return 'sign(%s)' % c, t
        self.fail(n, 'sign() needs a number')

    def bi_normalize(self, n):
        args = self.args(n, 1, 3)
        v = self.fl(n, *args[0])
        lo = self.fl(n, *args[1]) if len(args) > 1 else '0.0'
        hi = self.fl(n, *args[2]) if len(args) > 2 else '1.0'
        return '(%s != %s ? (%s - %s) / (%s - %s) : 0.0)' % (hi, lo, v, lo, hi, lo), 'float'

    def bi_distance(self, n):
        if len(n.args) != 4:
            self.fail(n, 'distance() takes four numbers: distance(x1, y1, x2, y2). For two Vec2 use Vec2.distance(a, b)')
        args = self.args(n, 4, 4)
        x1, y1, x2, y2 = (self.fl(n, c, t) for c, t in args)
        return 'length(vec2(%s - %s, %s - %s))' % (x2, x1, y2, y1), 'float'

    def bi_dot(self, n):
        (a, ta), (b, tb) = self.args(n, 2, 2)
        if not _sh_is_vec(ta) or ta != tb:
            self.fail(n, 'dot() needs two vectors of the same size')
        return 'dot(%s, %s)' % (a, b), 'float'

    def bi_cross(self, n):
        (a, ta), (b, tb) = self.args(n, 2, 2)
        if ta != tb or ta not in ('vec2', 'vec3'):
            self.fail(n, 'cross() needs two Vec2 or two Vec3')
        if ta == 'vec2':
            return '(%s.x * %s.y - %s.y * %s.x)' % (a, b, a, b), 'float'
        return 'cross(%s, %s)' % (a, b), 'vec3'

    def bi_length(self, n):
        (c, t), = self.args(n, 1, 1)
        if _sh_is_vec(t):
            return 'length(%s)' % c, 'float'
        self.fail(n, 'length() needs a vector')

    # casts
    def bi_float(self, n):
        (c, t), = self.args(n, 1, 1)
        if t in _SH_RANK:
            return self.cv(c, t, 'float'), 'float'
        self.fail(n, 'float() needs a number')

    def bi_int(self, n):
        (c, t), = self.args(n, 1, 1)
        if t in _SH_RANK:
            return self.cv(c, t, 'int'), 'int'
        self.fail(n, 'int() needs a number')

    def bi_bool(self, n):
        (c, t), = self.args(n, 1, 1)
        return self.truth(n, c, t), 'bool'

    def bi_len(self, n):
        (c, t), = self.args(n, 1, 1)
        if _sh_is_arr(t):
            return str(t[2]), 'int'
        if _sh_is_vec(t):
            return str(_SH_DIMS[t]), 'int'
        self.fail(n, 'len() needs a list or a vector')

    def bi_range(self, n):
        self.fail(n, 'range() can only be used in a for loop in a shader')

    # noise (the very same hash and interpolation as noise1/2/3 in BowPy, so the GPU matches the CPU)
    def bi_noise1(self, n):
        args = self.args(n, 1, 2, kw=('smooth',))
        self.helpers.update(('noise1', 'nhash'))
        sm = self.smooth_arg(n, args, 1)
        return 'bp_noise1(%s, %s)' % (self.fl(n, *args[0]), sm), 'float'

    def bi_noise2(self, n):
        args = self.args(n, 1, 3, kw=('smooth',))
        self.helpers.update(('noise2', 'nhash'))
        sm = self.smooth_arg(n, args, 2)
        y = self.fl(n, *args[1]) if len(args) > 1 else '0.0'
        return 'bp_noise2(%s, %s, %s)' % (self.fl(n, *args[0]), y, sm), 'float'

    bi_noise = bi_noise2

    def bi_noise3(self, n):
        args = self.args(n, 1, 4, kw=('smooth',))
        self.helpers.update(('noise3', 'nhash'))
        sm = self.smooth_arg(n, args, 3)
        y = self.fl(n, *args[1]) if len(args) > 1 else '0.0'
        z = self.fl(n, *args[2]) if len(args) > 2 else '0.0'
        return 'bp_noise3(%s, %s, %s, %s)' % (self.fl(n, *args[0]), y, z, sm), 'float'

    def smooth_arg(self, n, args, pos):
        node = None
        if len(n.args) > pos:
            node = n.args[pos]
        for k in n.keywords:
            if k.arg == 'smooth':
                node = k.value
        if node is None:
            return 'true'
        c, t = self.ex(node)
        return self.truth(node, c, t)

    # the screen
    def bi_get_pixel(self, n):
        if len(n.args) != 1 or n.keywords:
            self.fail(n, 'inside fragment(), get_pixel() takes one Vec2 from 0 to 1: get_pixel(pos)')
        (c, t), = self.args(n, 1, 1)
        if t != 'vec2':
            self.fail(n, 'inside fragment(), get_pixel() takes one Vec2 from 0 to 1: get_pixel(pos)')
        self.uses_scene = True
        return 'bp_get_pixel(%s)' % c, 'vec4'

    def live(self, n, nargs=0):
        self.args(n, nargs, nargs)
        self.uses_live = True

    def bi_W(self, n):
        self.live(n); return 'int(uRes.x)', 'int'

    def bi_H(self, n):
        self.live(n); return 'int(uRes.y)', 'int'

    bi_screen_width = bi_W
    bi_screen_height = bi_H

    def bi_dt(self, n):
        self.live(n); return 'uT.y', 'float'

    bi_delta_time = bi_dt

    def bi_fps(self, n):
        self.live(n); return 'uT.z', 'float'

    def bi_get_time(self, n):
        self.live(n); return 'uT.x', 'float'

    def bi_mouse_x(self, n):
        self.live(n); return 'uM.x', 'float'

    def bi_mouse_y(self, n):
        self.live(n); return 'uM.y', 'float'

    def bi_mouse_pos(self, n):
        self.live(n); return 'uM.xy', 'vec2'

    def bi_mouse_down(self, n):
        if len(n.args) > 1 or n.keywords:
            self.fail(n, 'mouse_down() takes one argument')
        b = 0
        if n.args:
            a = n.args[0]
            if not (isinstance(a, _sh_ast.Constant) and a.value in (0, 1, 2) and not isinstance(a.value, bool)):
                self.fail(n, 'in a shader, mouse_down() needs the button written as 0, 1 or 2')
            b = a.value
        self.uses_live = True
        return '(%s > 0.5)' % ('uM.z', 'uM.w', 'uT.w')[b], 'bool'

    def bi_is_mobile(self, n):
        self.args(n, 0, 0)
        f = self.rt.get('is_mobile')
        return ('true' if (f and f()) else 'false'), 'bool'

    # ═════════════════════ whole program ═════════════════════
    def program(self, fn):
        f, conv = self.compile_entry(fn)
        parts = ['#version 300 es', 'precision highp float;', 'precision highp int;']
        parts.append('uniform sampler2D uScene;\\nuniform vec2 uRes;\\nuniform vec4 uT;\\nuniform vec4 uM;\\nuniform vec4 uU[%d];\\nout vec4 outColor;' % max(1, self.nslots))
        parts.append('vec4 bp_get_pixel(vec2 p) { vec4 t = textureLod(uScene, p, 0.0); return t.a > 0.0 ? vec4(t.rgb / t.a, t.a) : vec4(0.0); }')
        need = set(self.helpers)
        for h, deps in _SH_HELPER_DEPS.items():
            if h in need:
                need.update(deps)
        for h in _SH_HELPER_ORDER:
            if h in need:
                parts.append(_SH_HELPERS[h])
        for g in self.order:
            parts.append(g.code)
        body = ('void main() {\\n'
                '  vec2 pos = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uRes;\\n'
                '  %s R = %s(pos);\\n'
                '  vec4 c = clamp(%s, 0.0, 1.0);\\n'
                '  outColor = vec4(c.rgb * c.a, c.a);\\n}') % (
                    f.ret, f.name, conv)
        parts.append(body)
        return '\\n'.join(parts) + '\\n'



# ── Running the shader: where the source comes from, the per-frame uniforms, the CPU fallback ───────────
_BP_MAIN_SRC = ''          # source code of main.bpy (the host sets it before every run)
_BP_SRC_FILES = {}         # file name -> source code of include()d files
_FRAG = {'fn': None, 'mode': 'off', 'pack': None, 'scene': None, 'src': None, 'warned': False}
_SH_TREES = {}


def _sh_source_of(fn):
    """(the ast of a function, the file name to show in messages) - None when the source is not known."""
    code = fn.__code__
    fname = code.co_filename
    src = None
    shown = fname
    if fname == '<exec>':
        src = _BP_MAIN_SRC
        shown = 'main.bpy'
    else:
        for rec in _BP_TAB_SRC.values():
            if rec[0] == fname:
                src = rec[1]
                break
        if src is None:
            src = _BP_SRC_FILES.get(fname)
    if not src:
        return None, shown
    key = (fname, len(src), hash(src))
    idx = _SH_TREES.get(key)
    if idx is None:
        try:
            tree = _sh_ast.parse(src, filename=fname)
        except SyntaxError:
            return None, shown
        idx = {}
        for node in _sh_ast.walk(tree):
            if isinstance(node, _sh_ast.FunctionDef):
                first = min([d.lineno for d in node.decorator_list] + [node.lineno])
                idx[(node.name, first)] = node
        if len(_SH_TREES) > 16:
            _SH_TREES.clear()
        _SH_TREES[key] = idx
    return idx.get((fn.__name__, code.co_firstlineno)), shown


def _sh_comps(v):
    t = type(v)
    if t is Vec2:
        return (v.x, v.y)
    if t is Vec3:
        return (v.x, v.y, v.z)
    if t is Vec4:
        return (v.x, v.y, v.z, v.w)
    return tuple(float(c) for c in v)


def _sh_make_packer(comp):
    """A function that reads the global variables the shader uses and returns them as a flat list of floats."""
    ents = [(u['g'], u['name'], u['kind'], u['type'], u['slot'], u['count']) for u in comp.uniforms]
    n4 = 4 * max(1, comp.nslots)

    def pack():
        out = [0.0] * n4
        for g, name, kind, t, slot, count in ents:
            try:
                v = g[name]
            except KeyError:
                raise NameError("fragment(): the global variable '%s' does not exist any more" % name) from None
            i = slot * 4
            try:
                if kind == 'scalar':
                    out[i] = (1.0 if v else 0.0) if t == 'bool' else float(v)
                elif kind == 'vec':
                    c = _sh_comps(v)
                    if len(c) != _SH_DIMS[t]:
                        raise ValueError('it must stay a %s' % _sh_tname(t))
                    for k in range(len(c)):
                        out[i + k] = c[k]
                else:
                    if len(v) != count:
                        raise ValueError('the list must keep its %d items' % count)
                    et = t[1]
                    if et == 'float' or et == 'bool':
                        for j in range(count):

_SH_K255 = 1.0 / 255.0

def _sh_sample(pos):
    try:

        elif isinstance(pos, (tuple, list)):

        else:
            u = float(pos.x); v = float(pos.y)

    if cpu is not None:
        buf, w, h = cpu
    else:
        buf = None
        w = int(_py.sw()); h = int(_py.sh())

    fy = v * h - 0.5

    y0 = math.floor(fy)
    tx = fx - x0
    ty = fy - y0

    if tx < 0.002:
        tx = 0.0
    elif tx > 0.998:
        x0 += 1
        tx = 0.0
    if ty < 0.002:
        ty = 0.0
    elif ty > 0.998:
        y0 += 1
        ty = 0.0
    xa = x0 if 0 <= x0 < w else (0 if x0 < 0 else w - 1)
    ya = y0 if 0 <= y0 < h else (0 if y0 < 0 else h - 1)
    if tx == 0.0 and ty == 0.0:
        if buf is not None:
            i = (ya * w + xa) * 4
            a = buf[i + 3]
            if a == 255:
                return Vec4(buf[i] * _SH_K255, buf[i + 1] * _SH_K255, buf[i + 2] * _SH_K255, 1.0)
            if a == 0:
                return Vec4(0.0, 0.0, 0.0, 0.0)
            return Vec4(buf[i] * _SH_K255, buf[i + 1] * _SH_K255, buf[i + 2] * _SH_K255, a * _SH_K255)
        p = int(_py.get_pixel_packed(xa, ya))
        return Vec4((p >> 24) * _SH_K255, ((p >> 16) & 255) * _SH_K255, ((p >> 8) & 255) * _SH_K255, (p & 255) * _SH_K255)
    xb = x0 + 1
    xb = xb if xb < w else w - 1
    yb = y0 + 1
    yb = yb if yb < h else h - 1
    if buf is not None:
        def fetch(x, y):
            j = (y * w + x) * 4
            return (buf[j], buf[j + 1], buf[j + 2], buf[j + 3])

    r = g = b = a = 0.0
    for xx, yy, wt in ((xa, ya, (1 - tx) * (1 - ty)), (xb, ya, tx * (1 - ty)), (xa, yb, (1 - tx) * ty), (xb, yb, tx * ty)):

        pr, pg, pb, pa = fetch(xx, yy)
        al = pa * _SH_K255
        k = wt * al * _SH_K255

        g += pg * k
        b += pb * k
        a += wt * al
    if a > 0.0:
        return Vec4(min(1.0, r / a), min(1.0, g / a), min(1.0, b / a), min(1.0, a))

def fragment(pos):
    """The screen shader: define your own fragment(pos) to change how every pixel of the screen looks.

    pos is a Vec2 from 0 to 1 - (0, 0) is the top-left of the screen, (1, 1) the bottom-right. Return the
    colour of that pixel as a Vec3(r, g, b) (opaque) or a Vec4(r, g, b, a), each value from 0 to 1.
    get_pixel(pos) gives the colour that was drawn at a position, as a Vec4.

    The default shader leaves the picture as it is:

        def fragment(pos):
            return get_pixel(pos)

    Your function runs once per pixel, every frame, after update() - on the GPU, so it is very fast. For that,
    BowPy turns it into a GPU program: use numbers, Vec2 / Vec3 / Vec4, math functions, if / for / while,
    your own helper functions and your global variables (they are read again every frame).

    Example (a pulsing vignette):

    let h = '<pre class="ht-sig">' + signatureHtml(info) + '</pre>';

    if (info.params && info.params.length && !(info.doc && /^\s*(Args?|Parameters?)\b/im.test(info.doc))) body += wikiParamsHtml(info.params);
    if (info.kind === 'module' && info.symbols && info.symbols.length) body += '<div class="ht-label">Contains</div><div class="ht-params">' + info.symbols.slice(0, 14).map(s => '<div class="ht-prm"><code>' + esc(s) + '</code></div>').join('') + (info.symbols.length > 14 ? '<div class="ht-prm">…</div>' : '') + '</div>';
    if (info.guess && info.also && info.also.length) body += '<p class="ht-note">Type not known — also on: ' + info.also.map(esc).join(', ') + '</p>';
    else if (info.guess) body += '<p class="ht-note">Type not known — showing the closest match.</p>';
    if (!body && !info.doc) body = '';
    h += (body ? '<div class="ht-doc">' + body + '</div>' : '');
    const where = [];
    if (info.owner) where.push(esc(info.owner));
    const ol = originLabel(info);
    if (ol) where.push(esc(ol));
    let foot = '<span class="ht-where">' + where.join(' · ') + '</span>';
    if (info.wikiId) foot += '<a class="ht-wiki" data-wiki="' + esc(info.wikiId) + '">Wiki' + (info.wikiLabel ? ' › ' + esc(info.wikiLabel) : '') + ' ›</a>';
    h = '<div class="ht-scroll">' + h + '</div>' + (where.length || info.wikiId ? '<div class="ht-foot">' + foot + '</div>' : '');

  }

  // ───────────────────────── pointer → word ─────────────────────────
  let met = null;
  const cvs = document.createElement('canvas').getContext('2d');
  function metrics() {
    const cs = getComputedStyle($ed);
    const font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    if (!met || met.font !== font) {
      cvs.font = font;
      met = { font, cw: cvs.measureText('0'.repeat(40)).width / 40, lh: parseFloat(cs.lineHeight) || 21, pl: parseFloat(cs.paddingLeft) || 0, pt: parseFloat(cs.paddingTop) || 0, tab: parseInt(cs.tabSize, 10) || 4 };

  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { met = null; });
  const visualOf = (L, idx, tab) => { let v = 0; for (let i = 0; i < idx && i < L.length; i++) v += L[i] === '\t' ? tab - (v % tab) : 1; return v; };
  const indexAtVisual = (L, vcol, tab) => { let v = 0; for (let i = 0; i < L.length; i++) { const w = L[i] === '\t' ? tab - (v % tab) : 1; if (vcol < v + w) return i; v += w; } return -1; };

  // identifier under (li, idx) that is not inside a string or a comment
  function wordAtPos(li, idx) {
    const sc = scan($ed.value), L = sc.lines[li];
    if (!L || !/\w/.test(L[idx])) return null;
    let s = idx, e = idx + 1;
    while (s > 0 && /\w/.test(L[s - 1])) s--;
    while (e < L.length && /\w/.test(L[e])) e++;
    if (/^\d/.test(L.slice(s, e)) || markAt(sc, li, s)) return null;
    return { li, s, e, word: L.slice(s, e) };
  }

  // ───────────────────────── the tooltip ─────────────────────────
  let tip = null, showTimer = 0, hideTimer = 0, cur = null, pending = null;
  function ensureTip() {
    if (tip) return tip;
    tip = document.createElement('div');
    tip.id = 'hover-tip';
    tip.addEventListener('mouseenter', () => { clearTimeout(hideTimer); });
    tip.addEventListener('mouseleave', () => scheduleHide());
    tip.addEventListener('mousedown', e => { if (e.target.closest('.ht-wiki')) e.preventDefault(); });
    tip.addEventListener('click', e => {
      const a = e.target.closest('.ht-wiki');
      if (a && a.dataset.wiki) { hide(); switchTab('wiki'); openWikiPage(a.dataset.wiki); }
    });
    document.body.appendChild(tip);
    return tip;
  }
  function hide() {
    clearTimeout(showTimer); clearTimeout(hideTimer);
    pending = null; cur = null;

  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    if (!cur) return;
    hideTimer = setTimeout(hide, GRACE);
  }
  function place(w) {
    const m = metrics(), r = $ed.getBoundingClientRect(), L = scan($ed.value).lines[w.li] || '';
    const left = r.left + m.pl + visualOf(L, w.s, m.tab) * m.cw - $ed.scrollLeft;
    const top = r.top + m.pt + w.li * m.lh - $ed.scrollTop;
    tip.style.left = '0px'; tip.style.top = '0px';
    const tw = tip.offsetWidth, th = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
    let x = Math.max(8, Math.min(left - 8, vw - tw - 8));
    let y = top - th - 4;
    if (y < 8) y = Math.min(top + m.lh + 4, vh - th - 8);
    tip.style.left = Math.round(x) + 'px'; tip.style.top = Math.round(Math.max(8, y)) + 'px';
  }
  function show(w, info) {
    ensureTip();
    tip.innerHTML = render(info);
    tip.classList.add('show');
    cur = w;
    place(w);
    const sc = tip.querySelector('.ht-scroll');
    if (sc) sc.scrollTop = 0;
  }
  const same = (a, b) => a && b && a.li === b.li && a.s === b.s && a.e === b.e;
  function run(w) {
    try {
      if (!$ed.offsetParent) return hide();
      const info = resolve(w.li, w.s, w.e);

    const hit = hitTest(e);

    if (same(pending, w)) return;

    $ed.addEventListener('pointermove', onMove);
    $ed.addEventListener('pointerleave', () => { clearTimeout(showTimer); pending = null; scheduleHide(); });
    $ed.addEventListener('pointerdown', hide);
    $ed.addEventListener('keydown', hide);
    $ed.addEventListener('input', hide);
    $ed.addEventListener('scroll', hide);
    $ed.addEventListener('wheel', hide, { passive: true });

    window.addEventListener('resize', hide);
  }
  init();

  return { setEnabled(v) { enabled = !!v; if (!enabled) hide(); }, setDelay(ms) { DELAY = Math.max(0, +ms || 0); }, resetMetrics() { met = null; },
    py, resolve, scan, parse, hide, show, run, hitTest, wordAtPos, metrics, render, info: (li, col) => { const w = wordAtPos(li, col); return w ? resolve(w.li, w.s, w.e) : null; } };
})();

// ══════════════════════════════════════════════════════════════
//  Game loop
// ══════════════════════════════════════════════════════════════
function frame(ts) {
  if (!running) return;
  const raw = Math.min((ts - lastTs) / 1000, 0.1);
  // Skip both rendering AND Python execution until the target interval has elapsed.
  // This throttles runtime FPS (update() calls), not just drawing.
  if (fpsLimit > 0 && raw < (1.0 / fpsLimit)) {
    rafId = requestAnimationFrame(frame);
    return;
  }
  lastTs = ts; deltaTime = raw;
  fpsSmooth += (1 / (raw || 0.001) - fpsSmooth) * 0.08;
  _applyScreenTransform();
  try {
    pyodide.runPython('_frame()');
  } catch(err) {
    window.appendConsole(err.message, 'err');
    stopCode(); return;
  }
  _bpTickShader();
  BE.present();   // show the finished frame (WebGL: copy the screen target onto the canvas, through the fragment() shader)
  // Clear img_from_screen cache accumulated this frame
  for (const img of _bpScreenCapImages) { img.src = ''; _bpImgDataCache.delete(img); }
  _bpScreenCapImages.length = 0;
  keysPress.clear(); keysRel.clear();
  _btnFrameEnd();
  wheelUp = 0; wheelDown = 0;
  rafId = requestAnimationFrame(frame);
}
