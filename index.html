<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BowPy</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&family=Source+Code+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:    #0b0d11;
  --bg2:   #12151c;
  --bg3:   #1a1e29;
  --bg4:   #222636;
  --bdr:   #252a38;
  --bdr2:  #1e2230;
  --txt:   #c8d0e8;
  --txt2:  #6a738f;
  --txt3:  #3c4255;
  --blue:  #5b9cf6;
  --cyan:  #4ec9b0;
  --green: #3ec97e;
  --red:   #f47067;
  --oran:  #e5b567;
  --purp:  #b48ef4;
  --pink:  #f06baf;
  --font-code: 'IBM Plex Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  --font-ui:   'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;

  /* set by the Settings tab */
  color-scheme: dark;
  --ed-fs: 13px;            /* editor font size */
  --ed-lh: 21px;            /* editor line height */
  --tab-size: 4;
  --con-fs: 12px;           /* console font size */
  --con-bg:  #070910;
  --con-out: #9aafc4;
  --bdr3:    #30374d;
  --scroll-hover: #2e3448;
  --run-bg: #0d2318;  --run-bdr: #1d5c30;  --run-hover: #12342a;  --run-glow: #3ec97e30;
  --stop-bg: #220f0e; --stop-bdr: #5c1e1c; --stop-hover: #3d1a18;
  --sel: #5b9cf640;

  /* syntax colors */
  --sy-kw:   #c586c0;
  --sy-kw2:  #569cd6;
  --sy-fn:   #dcdcaa;
  --sy-cls:  #4ec9b0;
  --sy-num:  #b5cea8;
  --sy-str:  #ce9178;
  --sy-cmt:  #6a737d;
  --sy-dec:  #5b9cf6;
  --sy-self: #9cdcfe;
  --sy-op:   #d4d4d4;
  --sy-bi:   #4ec9b0;
  --sy-pun:  #808080;
}
.sy-kw   { color: var(--sy-kw); }
.sy-kw2  { color: var(--sy-kw2); }
.sy-fn   { color: var(--sy-fn); }
.sy-cls  { color: var(--sy-cls); }
.sy-num  { color: var(--sy-num); }
.sy-str  { color: var(--sy-str); }
.sy-cmt  { color: var(--sy-cmt); }
.sy-dec  { color: var(--sy-dec); }
.sy-self { color: var(--sy-self); }
.sy-op   { color: var(--sy-op); }
.sy-bi   { color: var(--sy-bi); }
.sy-pun  { color: var(--sy-pun); }
[class^="sy-"]{line-height:inherit;vertical-align:baseline;}
.sy-cmt{font-style:italic;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font-ui);}

/* ── HEADER ── */
#hdr{
  display:flex;align-items:center;gap:10px;
  height:42px;padding:0 14px;flex-shrink:0;
  background:var(--bg2);border-bottom:1px solid var(--bdr);
  z-index:20;position:relative;
}
.logo{
  font-family:var(--font-code);font-weight:600;font-size:13px;
  color:var(--blue);letter-spacing:-.2px;user-select:none;
  display:flex;align-items:center;gap:6px;
}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
.sep{width:1px;height:18px;background:var(--bdr);margin:0 2px;}
.tabs{display:flex;gap:2px;}
.tab-btn{
  padding:4px 13px;border-radius:5px;border:1px solid transparent;
  color:var(--txt2);cursor:pointer;font:13px var(--font-ui);
  transition:all .12s;background:transparent;
}
.tab-btn:hover{color:var(--txt);background:var(--bg3);}
.tab-btn.active{color:var(--txt);background:var(--bg);border-color:var(--bdr);}
.ctrl{display:flex;gap:6px;align-items:center;}
.btn{
  display:flex;align-items:center;gap:5px;
  padding:4px 13px;border-radius:5px;border:1px solid;
  cursor:pointer;font:600 12px var(--font-ui);
  transition:all .12s;white-space:nowrap;line-height:1;
}
.btn-run{background:var(--run-bg);border-color:var(--run-bdr);color:var(--green);}
.btn-run:hover:not(:disabled){background:var(--run-hover);border-color:var(--green);box-shadow:0 0 10px var(--run-glow);}
.btn-stop{background:var(--stop-bg);border-color:var(--stop-bdr);color:var(--red);}
.btn-stop:hover:not(:disabled){background:var(--stop-hover);border-color:var(--red);}
.btn:disabled{background:var(--bg3);border-color:var(--bdr);color:var(--txt3);cursor:not-allowed;}
.btn-io{background:var(--bg3);border-color:var(--bdr);color:var(--txt2);}
.btn-io:hover{background:var(--bg4);border-color:var(--txt3);color:var(--txt);}
#new-btn{position:relative;}
#new-btn.confirm-1{border-color:var(--oran);color:var(--oran);}
#new-btn.confirm-2{border-color:var(--red);color:var(--red);}
#fname{
  background:var(--bg);border:1px solid var(--bdr);border-radius:5px;
  color:var(--txt2);font:12px var(--font-code);
  padding:3px 10px;width:130px;outline:none;
  transition:border-color .12s,color .12s;
}
#fname:focus{border-color:var(--blue);color:var(--txt);}
#fname::placeholder{color:var(--txt3);}
#status-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;}
#status{font:11px var(--font-code);display:flex;align-items:center;gap:6px;}
#sdot{width:6px;height:6px;border-radius:50%;background:currentColor;transition:all .3s;}
.s-load{color:var(--oran);}
.s-load #sdot{animation:pulse 1.2s infinite;}
.s-ready{color:var(--txt3);}
.s-run{color:var(--green);}
.s-run #sdot{box-shadow:0 0 8px var(--green);}
.s-err{color:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hint{font:11px var(--font-code);color:var(--txt3);}
kbd{
  display:inline-flex;align-items:center;padding:1px 5px;
  border-radius:3px;border:1px solid var(--bdr);background:var(--bg3);
  font:10px var(--font-code);color:var(--txt2);
}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;}
.tab-view{display:none;flex:1;overflow:hidden;min-height:0;}
.tab-view.active{display:flex;}

/* ── CODE TAB ── */
#code-tab{flex-direction:column;}

/* ── CODE SUBTABS ── */
#subtab-wrap{position:relative;flex-shrink:0;z-index:6;}
#subtabs{
  display:flex;align-items:stretch;height:32px;
  background:var(--bg2);border-bottom:1px solid var(--bdr2);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
#subtabs::-webkit-scrollbar{display:none;}
.subtab{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  padding:0 8px 0 14px;cursor:pointer;user-select:none;white-space:nowrap;
  font:12px var(--font-code);color:var(--txt2);
  border-right:1px solid var(--bdr2);border-bottom:2px solid transparent;
  transition:color .12s,background .12s;
}
.subtab:first-child{padding-right:14px;}
.subtab:hover{color:var(--txt);background:var(--bg3);}
.subtab.active{color:var(--txt);background:var(--bg);border-bottom-color:var(--blue);}
.subtab-x{
  width:16px;height:16px;padding:0;border:none;border-radius:3px;background:transparent;
  color:var(--txt3);font:14px/1 var(--font-code);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.subtab:hover .subtab-x,.subtab.active .subtab-x{color:var(--txt2);}
.subtab-x:hover{background:var(--bg4);color:var(--txt);}
.subtab-x.armed{width:auto;padding:0 5px;background:var(--stop-bg);color:var(--red);font:600 10px var(--font-ui);}
.subtab-edit,.subtab-edit:hover{cursor:text;gap:0;padding:0 12px;background:var(--bg);border-bottom-color:var(--blue);color:var(--txt);}
.subtab-edit.invalid{border-bottom-color:var(--red);}
.subtab-input{min-width:4ch;padding:0;border:none;outline:none;background:transparent;color:var(--txt);font:12px var(--font-code);}
.subtab-input::placeholder{color:var(--txt3);}
.subtab-ext{color:var(--txt3);}
#subtab-add{
  position:sticky;right:0;flex-shrink:0;width:34px;
  border:none;border-left:1px solid var(--bdr2);background:var(--bg2);
  color:var(--txt2);font:400 18px/1 var(--font-code);cursor:pointer;
  transition:color .12s,background .12s;
}
#subtab-add:hover{color:var(--blue);background:var(--bg3);}
#subtab-msg{
  display:none;position:absolute;top:calc(100% + 4px);left:0;
  max-width:min(440px,calc(100vw - 16px));padding:6px 10px;border-radius:5px;
  background:var(--stop-bg);border:1px solid var(--stop-bdr);color:var(--red);
  font:12px/1.4 var(--font-ui);box-shadow:0 6px 18px #0009;pointer-events:none;
}
#subtab-msg.show{display:block;}
@media (pointer:coarse){#subtabs{height:40px;}#subtab-add{width:44px;}}

/* ── EDITOR ── */
#editor-wrap{
  flex:1;display:flex;overflow:hidden;min-height:0;
  position:relative;background:var(--bg);
}

/* line numbers */
#lnums{
  width:calc(var(--ed-fs) * 4);flex-shrink:0;overflow:hidden;
  background:var(--bg2);border-right:1px solid var(--bdr2);
  font:var(--ed-fs) var(--font-code);line-height:var(--ed-lh);color:var(--txt3);
  padding:14px 10px 14px 0;text-align:right;
  user-select:none;white-space:pre;
  pointer-events:none;
}

/* the container that holds highlight layer + textarea, stacked */
#ed-inner{
  flex:1;position:relative;overflow:hidden;
}

/* highlight mirror — exact same font/padding as textarea */
#hl{
  position:absolute;top:0;left:0;
  font:var(--ed-fs) var(--font-code);line-height:var(--ed-lh);
  padding:14px 16px;
  tab-size:var(--tab-size);
  white-space:pre;
  overflow:visible;         /* parent #ed-inner clips; no scroll state */
  pointer-events:none;
  z-index:1;
  color:var(--txt);         /* fallback for un-tokenized text */
}

/* textarea sits on top, transparent text so highlight shows through */
#editor{
  position:absolute;inset:0;
  resize:none;border:none;outline:none;
  background:transparent;
  color:transparent;
  caret-color:var(--txt);
  font:var(--ed-fs) var(--font-code);line-height:var(--ed-lh);
  padding:14px 16px;
  tab-size:var(--tab-size);
  white-space:pre;
  overflow:auto;
  z-index:2;
  scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;
}
#editor::selection{background:var(--sel);}

/* ── HOVER TOOLTIP (functions / methods / classes) ── */
#hover-tip{
  position:fixed;left:0;top:0;z-index:3000;display:none;flex-direction:column;
  max-width:min(600px,calc(100vw - 16px));min-width:140px;
  background:var(--bg3);border:1px solid var(--bdr3);border-radius:6px;
  box-shadow:0 10px 30px #000c,0 2px 6px #0008;
  font:12.5px/1.5 var(--font-ui);color:var(--txt);overflow:hidden;
}
#hover-tip.show{display:flex;}
#hover-tip .ht-scroll{overflow:auto;max-height:min(340px,56vh);scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}
#hover-tip .ht-sig{
  margin:0;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bdr);
  font:12.5px/1.55 var(--font-code);white-space:pre-wrap;word-break:break-word;color:var(--txt);
}
#hover-tip .ht-sig:last-child{border-bottom:none;}
#hover-tip .ht-kind{color:var(--txt2);}
#hover-tip .ht-param{color:var(--sy-self);}
#hover-tip .ht-doc{padding:8px 12px 10px;}
#hover-tip .ht-doc p{margin:0 0 7px;}
#hover-tip .ht-doc p:last-child{margin-bottom:0;}
#hover-tip .ht-doc code{font:11.5px var(--font-code);background:var(--bg);padding:1px 5px;border-radius:3px;color:var(--txt);}
#hover-tip .ht-doc em{color:var(--sy-self);font-style:normal;}
#hover-tip .ht-code{
  margin:2px 0 8px;padding:6px 10px;background:var(--bg);border:1px solid var(--bdr);border-radius:4px;
  font:11.5px/1.5 var(--font-code);white-space:pre;overflow-x:auto;scrollbar-width:thin;color:var(--txt);
}
#hover-tip .ht-label{font:600 10px var(--font-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--txt2);margin:8px 0 3px;}
#hover-tip .ht-doc > .ht-label:first-child{margin-top:0;}
#hover-tip .ht-params{margin:0 0 6px;}
#hover-tip .ht-prm{margin:2px 0;color:var(--txt);}
#hover-tip .ht-prm code{color:var(--sy-self);}
#hover-tip .ht-type{color:var(--sy-cls);font:11px var(--font-code);}
#hover-tip .ht-li{margin:0 0 3px;}
#hover-tip .ht-note{color:var(--txt2);font-style:italic;}
#hover-tip .ht-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:4px 12px;border-top:1px solid var(--bdr);background:var(--bg2);
  font:11px var(--font-ui);color:var(--txt2);
}
#hover-tip .ht-wiki{color:var(--blue);cursor:pointer;white-space:nowrap;text-decoration:none;}
#hover-tip .ht-wiki:hover{text-decoration:underline;}

/* ── CONSOLE ── */
#con-resize{
  height:5px;flex-shrink:0;cursor:ns-resize;
  border-top:1px solid var(--bdr2);background:transparent;
  transition:background .15s;
}
#con-resize:hover,#con-resize.drag{background:var(--blue);}
#console{
  height:190px;min-height:72px;flex-shrink:0;
  display:flex;flex-direction:column;
}
#con-bar{
  display:flex;align-items:center;padding:3px 12px;
  background:var(--bg2);border-bottom:1px solid var(--bdr2);
  flex-shrink:0;gap:8px;
}
#con-title{font:600 10px var(--font-ui);color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;}
#con-clr{
  margin-left:auto;background:none;border:none;
  color:var(--txt3);cursor:pointer;font:11px var(--font-ui);
  padding:2px 7px;border-radius:4px;transition:all .12s;
}
#con-clr:hover{color:var(--txt);background:var(--bg4);}
#con-out{
  flex:1;overflow-y:auto;padding:8px 14px;
  font:var(--con-fs)/1.55 var(--font-code);background:var(--con-bg);
  scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;
}
.cl{white-space:pre-wrap;word-break:break-all;padding:0 0 1px;}
.cout{color:var(--con-out);}.cerr{color:var(--red);}.cwarn{color:var(--oran);}
.cok{color:var(--cyan);}.csys{color:var(--txt3);font-style:italic;}
#con-in-row{
  display:flex;align-items:center;padding:5px 14px;
  background:var(--con-bg);border-top:1px solid var(--bdr2);
  flex-shrink:0;gap:8px;
}
#con-prompt{color:var(--green);font:var(--con-fs) var(--font-code);user-select:none;}
#con-in{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--txt);font:var(--con-fs) var(--font-code);
}
#con-in::placeholder{color:var(--txt3);}

/* ── SCREEN TAB ── */
#screen-tab{background:#000;position:relative;overflow:hidden;}
#screen{display:block;position:absolute;top:0;left:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}

/* ── ASSETS TAB ── */
#assets-tab{flex-direction:column;background:var(--bg2);}
#asset-bar{
  display:flex;align-items:center;padding:5px 12px;
  background:var(--bg2);border-bottom:1px solid var(--bdr2);
  flex-shrink:0;gap:8px;
}
#asset-bar-title{font:600 10px var(--font-ui);color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;}
#asset-bar-hint{font:10px var(--font-ui);color:var(--txt3);margin-left:auto;}
#asset-grid{
  flex:1;overflow-y:auto;padding:12px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:8px;align-content:start;
  scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;
}
#asset-empty{grid-column:1/-1;padding:48px 24px;text-align:center;color:var(--txt3);font:12px var(--font-ui);line-height:1.9;}
#asset-empty code{font:11px var(--font-code);color:var(--cyan);}
.asset-card{
  background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;
  overflow:hidden;cursor:pointer;transition:border-color .12s;
  position:relative;user-select:none;
}
.asset-card:hover{border-color:var(--blue);}
.asset-preview{width:100%;height:68px;display:flex;align-items:center;justify-content:center;background:var(--bg4);overflow:hidden;}
.asset-preview img{max-width:100%;max-height:100%;object-fit:contain;}
.asset-audio-icon{font-size:22px;color:var(--purp);}
.asset-text-icon{font-size:32px;color:var(--cyan);}
.asset-json-icon{font-size:22px;color:var(--oran);}
.asset-lib-icon{font:22px var(--font-code);color:var(--pink);}
.asset-name{padding:4px 8px;font:10px var(--font-code);color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-del{
  position:absolute;top:3px;right:3px;background:rgba(244,112,103,.75);
  border:none;color:#fff;font:10px/1 var(--font-ui);
  padding:2px 5px;border-radius:3px;cursor:pointer;opacity:0;transition:opacity .12s;
}
.asset-card:hover .asset-del{opacity:1;}
#drop-overlay{
  position:fixed;inset:0;z-index:9999;
  border:3px dashed var(--blue);border-radius:10px;margin:8px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  display:none;align-items:center;justify-content:center;
  color:var(--blue);font:700 18px var(--font-ui);pointer-events:none;
}
body.dropping #drop-overlay{display:flex;}

/* scrollbars */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);}

/* ── WIKI TAB ── */
#wiki-tab{flex-direction:row;background:var(--bg);}
#wiki-layout{display:flex;flex:1;overflow:hidden;min-height:0;}
#wiki-sidebar{
  width:230px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--bg2);border-right:1px solid var(--bdr);overflow:hidden;
}
#wiki-search-wrap{padding:10px;position:relative;flex-shrink:0;}
#wiki-search{
  width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;
  color:var(--txt);font:12px var(--font-code);padding:6px 10px;outline:none;
  transition:border-color .12s;
}
#wiki-search:focus{border-color:var(--blue);}
#wiki-search-results{
  position:absolute;top:calc(100% - 4px);left:10px;right:10px;
  background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;
  max-height:260px;overflow-y:auto;z-index:50;box-shadow:0 8px 24px #0006;
}
.wiki-sr-item{
  padding:7px 12px;font:12px var(--font-ui);color:var(--txt2);cursor:pointer;
  border-bottom:1px solid var(--bdr2);
}
.wiki-sr-item:last-child{border-bottom:none;}
.wiki-sr-item:hover{background:var(--bg4);color:var(--txt);}
.wiki-sr-item strong{color:var(--blue);font-weight:600;}
.wiki-sr-cat{font-size:10px;color:var(--txt3);display:block;margin-top:2px;}
#wiki-nav{flex:1;overflow-y:auto;padding:0 6px 14px;}
.wiki-nav-group{margin-bottom:4px;}
.wiki-nav-group-title{
  font:600 10px var(--font-ui);text-transform:uppercase;letter-spacing:.06em;
  color:var(--txt3);padding:8px 8px 4px;
}
.wiki-nav-item{
  display:flex;align-items:center;gap:7px;
  padding:5px 8px;border-radius:5px;cursor:pointer;outline:0px solid var(--bdr);
  font:12px var(--font-ui);color:var(--txt2);transition:all .1s;
}
.wiki-nav-item:hover{background:var(--bg3);color:var(--txt);outline:0px solid var(--bdr);}
.wiki-nav-item.active{background:var(--bg);color:var(--blue);outline:1px solid var(--bdr);}
.wiki-nav-item .wni-icon{font-size:13px;opacity:.6;}
#wiki-content{
  flex:1;overflow-y:auto;padding:32px 48px;min-width:0;
}
#wiki-breadcrumb{
  font:11px var(--font-ui);color:var(--txt3);margin-bottom:20px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.wiki-bc-seg{cursor:pointer;color:var(--txt3);transition:color .1s;}
.wiki-bc-seg:hover{color:var(--blue);}
.wiki-bc-sep{color:var(--txt3);}
#wiki-body{max-width:860px;}

.set-cgroup{font:600 10px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin:14px 0 8px;}

<script>
'use strict';

// ══════════════════════════════════════════════════════════════
//  BowGL – WebGL2 renderer. It speaks the Canvas 2D API, so every drawing function in the bridge below is
//  unchanged; the pixels are produced on the GPU. Falls back to a plain Canvas 2D backend when WebGL2 is
//  unavailable (add ?renderer=2d to the address to force the fallback). This function is also embedded in exported games.
// ══════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════════════════
//  BowGL — a WebGL2 renderer that speaks the Canvas 2D context API.
//
//  BowPy's drawing functions call a small, fixed set of CanvasRenderingContext2D
//  members. This file implements exactly those members on top of WebGL2, so every
//  drawing function keeps working unchanged while the pixels are produced on the GPU.
//
//  Layout of this factory:   utils/colors → shaders → render targets → renderer
//                            → 2D-context facade → Canvas 2D fallback backend
//  The whole function is embedded as-is into exported (built) games.
// ════════════════════════════════════════════════════════════════════════════
function _bowglFactory() {
'use strict';

const TAU = Math.PI * 2;
const STRIDE = 6;                    // floats per vertex: x, y, u, v, q, packed colour
const MAX_VERTS = 98304;             // vertices per batch (a multiple of 3 and 6)
const RAMP_W = 512;                  // gradient ramp texture width

const VALID_OPS = new Set([
  'source-over', 'source-in', 'source-out', 'source-atop',
  'destination-over', 'destination-in', 'destination-out', 'destination-atop',
  'lighter', 'copy', 'xor',
  'multiply', 'screen', 'overlay', 'darken', 'lighten', 'color-dodge', 'color-burn',
  'hard-light', 'soft-light', 'difference', 'exclusion', 'hue', 'saturation', 'color', 'luminosity'
]);
const ADV_IDS = {
  'multiply': 1, 'screen': 2, 'overlay': 3, 'darken': 4, 'lighten': 5, 'color-dodge': 6, 'color-burn': 7,
  'hard-light': 8, 'soft-light': 9, 'difference': 10, 'exclusion': 11, 'hue': 12, 'saturation': 13,
  'color': 14, 'luminosity': 15
};
// Porter-Duff operators that leave pixels outside the shape alone: plain fixed-function blending.
const FIXED_OPS = new Set(['source-over', 'destination-over', 'lighter', 'xor', 'source-atop', 'destination-out']);
// Operators that also change pixels OUTSIDE the shape (the whole canvas is composited).
const GLOBAL_OPS = new Set(['source-in', 'source-out', 'destination-in', 'destination-atop', 'copy']);

// ───────────────────────── colours ─────────────────────────
let _colorProbe = null;
const _colorCache = new Map();

function _probeCtx() {
  if (!_colorProbe) {
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    _colorProbe = c.getContext('2d', { willReadFrequently: true });
  }
  return _colorProbe;
}

function _parseFast(s) {
  s = s.trim();
  const c0 = s.charCodeAt(0);
  if (c0 === 35) {                                       // '#'
    const h = s.slice(1);
    if (!/^[0-9a-fA-F]+$/.test(h)) return null;
    if (h.length === 3 || h.length === 4) {
      const r = parseInt(h[0] + h[0], 16), g = parseInt(h[1] + h[1], 16), b = parseInt(h[2] + h[2], 16);
      const a = h.length === 4 ? parseInt(h[3] + h[3], 16) / 255 : 1;
      return [r, g, b, a];
    }
    if (h.length === 6 || h.length === 8) {
      const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
      const a = h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1;
      return [r, g, b, a];
    }
    return null;
  }
  const m = /^rgba?\(\s*([^)]*)\)$/i.exec(s);
  if (m) {
    const parts = m[1].split(/[\s,\/]+/).filter(Boolean);
    if (parts.length < 3 || parts.length > 4) return null;
    const ch = (v) => {
      if (v.endsWith('%')) return Math.max(0, Math.min(255, parseFloat(v) * 2.55));
      const n = parseFloat(v); return Number.isFinite(n) ? Math.max(0, Math.min(255, n)) : NaN;
    };
    const r = ch(parts[0]), g = ch(parts[1]), b = ch(parts[2]);
    let a = 1;
    if (parts.length === 4) {
      a = parts[3].endsWith('%') ? parseFloat(parts[3]) / 100 : parseFloat(parts[3]);
      a = Math.max(0, Math.min(1, a));
    }
    if (Number.isNaN(r) || Number.isNaN(g) || Number.isNaN(b) || Number.isNaN(a)) return null;
    return [r, g, b, a];
  }
  return null;
}

// Parse any CSS colour string into [r, g, b, a] (r/g/b 0..255, a 0..1). Returns null if it is not a colour.
function parseColor(css) {
  if (typeof css !== 'string') return null;
  let hit = _colorCache.get(css);
  if (hit !== undefined) return hit;
  let v = _parseFast(css);
  if (v === null) {
    // names, hsl(), color-mix() … → let the browser's own CSS parser normalise it
    const g = _probeCtx();
    g.fillStyle = '#000001';
    g.fillStyle = css;
    let norm = g.fillStyle;
    if (norm === '#000001') {
      g.fillStyle = '#000002';
      g.fillStyle = css;
      norm = g.fillStyle;
      if (norm === '#000002') norm = null;
    }
    v = norm === null ? null : _parseFast(norm);
    if (v === null && norm !== null) {
      // a colour the browser accepts but whose serialisation we cannot read (color(), color-mix() …): rasterise it
      g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'copy';
      g.fillStyle = css; g.fillRect(0, 0, 1, 1);
      g.globalCompositeOperation = 'source-over';
      const d = g.getImageData(0, 0, 1, 1).data;
      v = [d[0], d[1], d[2], d[3] / 255];
    }
  }
  if (_colorCache.size > 4096) _colorCache.clear();
  _colorCache.set(css, v);
  return v;
}

// Premultiplied colour packed for a normalised-ubyte vertex attribute (little-endian RGBA).
function packPremul(r, g, b, a) {
  const R = Math.round(r * a), G = Math.round(g * a), B = Math.round(b * a), A = Math.round(a * 255);
  return ((A << 24) | (B << 16) | (G << 8) | R) >>> 0;
}
// Plain (non-premultiplied) packing, used where the shader treats rgb as a multiplier.
function packRaw(r, g, b, a) {
  return ((Math.round(a * 255) << 24) | (Math.round(b) << 16) | (Math.round(g) << 8) | Math.round(r)) >>> 0;
}

// ───────────────────────── gradients ─────────────────────────
class Gradient {
  constructor(kind, p) {
    this.kind = kind;            // 'linear' | 'radial'

const K_COLOR = 0, K_TEX = 1, K_TINT = 2, K_QUAD = 3, K_LIN = 4, K_RAD = 5, K_COPY = 6, K_LOAD = 7;

const VERT_SRC = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;

#elif BLEND_ID == 2

#elif BLEND_ID == 3

#elif BLEND_ID == 5

// Unbounded Porter-Duff operators: `s` is the shape layer, `b` the existing target (both premultiplied).
const GLOBAL_IDS = { 'source-in': 1, 'source-out': 2, 'destination-in': 3, 'destination-atop': 4, 'copy': 5 };

precision highp float;
precision highp sampler2D;
in vec3 vUV;

// ───────────────────────── render targets ─────────────────────────
// A Target is an RGBA8 texture (premultiplied alpha, row 0 = top of the picture) plus a resolve framebuffer.
// All drawing goes through ONE shared multisampled framebuffer; the target being drawn on is "active" and its

    this.res = { tex: null, fbo: null, epoch: -1 };

    this.presentedGen = -1;

// ───────────────────────── the renderer ─────────────────────────

  } catch {}

  let type;
  if (rawStr.startsWith('data:image/')) type = 'image';
  else if (rawStr.startsWith('data:audio/')) type = 'audio';
  else if (rawStr.startsWith('data:text/')) type = 'text';
  else if (lowerName.endsWith('.json')) type = 'json';
  else if (lowerName.endsWith('.txt')) type = 'text';
  else if (lowerName.endsWith('.bpy')) type = 'lib';
  else if (lowerName.endsWith('.py')) type = 'lib';
  else type = 'audio';

  return (type === 'text' || type === 'json')
    ? { url: rawStr, type, text: rawStr }
    : { url: rawStr, type };
}

(function _loadStoredAssets() {
  try {
    _bpAssets.clear();

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith('bpa:')) continue;

      const name = key.slice(4);
      const raw = localStorage.getItem(key);

      // Keep empty strings too — localStorage can store them
      if (raw === null) continue;

      let rec = null;

      try {
        // Current format: { url, type, text? }
        const parsed = JSON.parse(raw);

        if (parsed && typeof parsed === 'object' && typeof parsed.url === 'string') {
          const type =
            typeof parsed.type === 'string'
              ? parsed.type
              : parsed.url.startsWith('data:image/')
                ? 'image'
                : parsed.url.startsWith('data:audio/')
                  ? 'audio'
                  : parsed.url.startsWith('data:text/')
                    ? 'text'
                    : 'audio';

          rec = {
            url: parsed.url,
            type,
            ...(typeof parsed.text === 'string' ? { text: parsed.text } : {})
          };
        }
      } catch {
        // Old format: only the raw value was stored
        const lowerName = name.toLowerCase();

        const type =
          raw.startsWith('data:image/') ? 'image' :
          raw.startsWith('data:audio/') ? 'audio' :
          raw.startsWith('data:text/') ? 'text' :
          lowerName.endsWith('.json') ? 'json' :
          lowerName.endsWith('.txt') ? 'text' :
          lowerName.endsWith('.bpy') ? 'lib' :
          lowerName.endsWith('.py') ? 'lib' :
          'audio';

        rec = (type === 'text' || type === 'json')
          ? { url: raw, type, text: raw }
          : { url: raw, type };
      }

      if (rec && typeof rec.url === 'string') {
        _bpAssets.set(name, rec);
      }
    }

    if (typeof _renderAssets === 'function') {
      _renderAssets();
    }
  } catch (e) {
    console.error('Failed to load stored assets:', e);
  }
})();

function _addAsset(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    const lowerName = String(file.name || '').toLowerCase();
    const isLib = lowerName.endsWith('.bpy') || lowerName.endsWith('.py');
    const isText = isLib || (file.type || '').startsWith('text/') || file.type === 'application/json' || lowerName.endsWith('.txt') || lowerName.endsWith('.json');
    reader.onload = ev => {
      const raw = ev.target.result;
      const type = isLib ? 'lib' : (lowerName.endsWith('.json') || file.type === 'application/json' ? 'json' : isText ? 'text' : (file.type || '').startsWith('image/') ? 'image' : 'audio');
      const rec = (type === 'text' || type === 'json' || type === 'lib') ? { url: String(raw), type, text: String(raw) } : { url: String(raw), type };
      _bpAssets.set(file.name, rec);
      try { localStorage.setItem('bpa:' + file.name, JSON.stringify(rec)); } catch(e) {}
      _renderAssets();
      resolve();
    };
    if (isText) reader.readAsText(file);
    else reader.readAsDataURL(file);
  });
}

// remove every asset (the Assets tab and the copy kept in the browser)
function _bpClearAssets() {
  _bpAssets.clear();
  try {
    const dead = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('bpa:')) dead.push(k); }
    dead.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  _renderAssets();
}

function removeAsset(name) {
  _bpAssets.delete(name);
  try { localStorage.removeItem('bpa:' + name); } catch(e) {}
  _renderAssets();
}

function _renderAssets() {
  const grid = document.getElementById('asset-grid');
  if (!grid) return;
  if (_bpAssets.size === 0) {
    grid.innerHTML = '<div id="asset-empty">No assets yet.<br><br>Drag &amp; drop image, audio, text or JSON files<br>anywhere on the page to add them.<br><br>Then use <code>Image("name.png")</code>, <code>Sound("name.mp3")</code>, <code>read_txt("name.txt")</code>, or <code>read_json("name.json")</code> in your code.<br><br>You can also import .py or .bpy files, just drag &amp; drop them on the page and use <code>include("name.bpy")</code><br>to run whatever code is in the file. All variables and functions are kept.</div>';
    return;
  }
  grid.innerHTML = '';
  for (const [name, rec] of _bpAssets) {
    const { url, type } = rec;
    const card = document.createElement('div');
    card.className = 'asset-card';
    const pyUsage = type === 'image' ? 'Image("' + name + '")' : type === 'audio' ? 'Sound("' + name + '")' : type === 'json' ? 'read_json("' + name + '")' : type === 'text' ? 'read_txt("' + name + '")' : 'include("' + name + '")';
    card.title = 'Click to copy: ' + pyUsage;
    card.onclick = () => {
      navigator.clipboard.writeText(pyUsage).catch(() => {});
      window.appendConsole('Copied: ' + pyUsage, 'ok');
    };
    const preview = document.createElement('div');
    preview.className = 'asset-preview';
    if (type === 'image') {
      const img = document.createElement('img');
      img.src = url; img.alt = name;
      preview.appendChild(img);
    } else if (type === 'audio') {
      preview.innerHTML = '<span class="asset-audio-icon">♪</span>';
    } else if (type === 'json') {
      preview.innerHTML = '<span class="asset-json-icon">{}</span>';
    } else if (type === 'text') {
      preview.innerHTML = '<span class="asset-text-icon">🗎</span>';
    } else {
      preview.innerHTML = '<span class="asset-lib-icon">lib</span>';
    }
    const label = document.createElement('div');
    label.className = 'asset-name'; label.title = name; label.textContent = name;
    const del = document.createElement('button');
    del.className = 'asset-del'; del.textContent = '✕';
    del.onclick = e => { e.stopPropagation(); removeAsset(name); };
    card.appendChild(preview); card.appendChild(label); card.appendChild(del);
    grid.appendChild(card);
  }
}

document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dropping'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget || !document.body.contains(e.relatedTarget)) document.body.classList.remove('dropping'); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  document.body.classList.remove('dropping');
  const files = Array.from(e.dataTransfer.files).filter(f => { const t = (f.type || '').toLowerCase(); const n = (f.name || '').toLowerCase(); return t.startsWith('image/') || t.startsWith('audio/') || t.startsWith('text/') || t === 'application/json' || n.endsWith('.txt') || n.endsWith('.json') || n.endsWith('.bpy') || n.endsWith('.py'); });
  for (const f of files) await _addAsset(f);
  if (files.length > 0) { switchTab('assets'); window.appendConsole('Added ' + files.length + ' asset(s).', 'ok'); }
});

// ══════════════════════════════════════════════════════════════
//  Syntax Highlighter
// ══════════════════════════════════════════════════════════════
const KEYWORDS_CTRL = new Set([
  'False','None','True','and','as','assert','async','await',
  'break','case','class','continue','def','del','elif','else','except',
  'finally','for','from','global','if','import','in','is',
  'lambda','match','nonlocal','not','or','pass','raise','return',
  'try','while','with','yield'
]);
const KEYWORDS_TYPE = new Set([
  'int','float','str','bool','list','dict','tuple','set','frozenset',
  'bytes','bytearray','complex','type','object','super','property',
  'classmethod','staticmethod','Exception','BaseException','ValueError',
  'TypeError','KeyError','IndexError','AttributeError','RuntimeError',
  'StopIteration','NameError','NotImplementedError','OverflowError',
  'ZeroDivisionError','FileNotFoundError','OSError','IOError'
]);
const BUILTINS = new Set([
  'abs','all','any','bin','callable','chr','compile','delattr',
  'dir','divmod','enumerate','eval','exec','filter','format',
  'getattr','globals','hasattr','hash','help','hex','id',
  'input','isinstance','issubclass','iter','len','locals',
  'map','max','min','next','oct','open','ord','pow','print',
  'range','repr','reversed','round','setattr','slice','sorted',
  'sum','vars','zip','__import__','__name__','__doc__'
]);

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function span(cls, s) { return `<span class="${cls}">${s}</span>`; }

function highlightLine(line) {
  // empty → preserve space
  if (!line) return '\n';

  let out = '';
  let i = 0;
  const n = line.length;

  // helper: consume while predicate
  function eat(pred) {
    const s = i;
    while (i < n && pred(line[i])) i++;
    return line.slice(s, i);
  }

  while (i < n) {
    const ch = line[i];

    // ── comment
    if (ch === '#') {
      out += span('sy-cmt', esc(line.slice(i)));
      break;
    }

    // ── triple-quoted string (single line span — full multi-line handled outside)
    if ((ch === '"' || ch === "'") && line[i+1] === ch && line[i+2] === ch) {
      const q = ch.repeat(3);
      let j = i + 3;
      while (j <= n - 3 && line.slice(j, j+3) !== q) j++;
      j = j <= n - 3 ? j + 3 : n;
      out += span('sy-str', esc(line.slice(i, j)));
      i = j;
      continue;
    }

    // ── string
    if (ch === '"' || ch === "'") {
      let j = i + 1;
      while (j < n && line[j] !== ch) {
        if (line[j] === '\\') j++;
        j++;
      }
      if (j < n) j++;
      out += span('sy-str', esc(line.slice(i, j)));
      i = j;
      continue;
    }

    // ── decorator
    if (ch === '@') {
      let j = i + 1;
      while (j < n && /[\w.]/.test(line[j])) j++;
      out += span('sy-dec', esc(line.slice(i, j)));
      i = j;
      continue;
    }

    // ── number (int, float, hex, bin, oct, complex)
    if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(line[i+1]||''))) {
      const s = i;
      if (ch === '0' && /[xXbBoO]/.test(line[i+1]||'')) {
        i += 2;
        while (i < n && /[\w]/.test(line[i])) i++;
      } else {
        while (i < n && /[\d._eEjJ]/.test(line[i])) i++;
      }
      out += span('sy-num', esc(line.slice(s, i)));
      continue;
    }

    // ── identifier or keyword
    if (/[a-zA-Z_]/.test(ch)) {
      const s = i;
      while (i < n && /[\w]/.test(line[i])) i++;
      const word = line.slice(s, i);

      // look-ahead for function call or definition
      let j = i;
      while (j < n && line[j] === ' ') j++;
      const isCall = line[j] === '(';
      const prevWord = out.match(/class="sy-kw">(\w+)<\/span>\s*$|>(class|def)\s*$/);

      if (word === 'self' || word === 'cls') {
        out += span('sy-self', esc(word));
      } else if (KEYWORDS_CTRL.has(word)) {
        out += span('sy-kw', esc(word));
      } else if (KEYWORDS_TYPE.has(word)) {
        out += span('sy-bi', esc(word));
      } else if (BUILTINS.has(word)) {
        out += span('sy-bi', esc(word));
      } else if (isCall) {
        out += span('sy-fn', esc(word));
      } else if (/^[A-Z]/.test(word)) {
        out += span('sy-cls', esc(word));
      } else {
        out += esc(word);
      }
      continue;
    }

    // ── operators
    if (/[+\-*/%=<>!&|^~]/.test(ch)) {
      const s = i;
      while (i < n && /[+\-*/%=<>!&|^~]/.test(line[i])) i++;
      out += span('sy-op', esc(line.slice(s, i)));
      continue;
    }

    // ── punctuation
    if (/[()[\]{},.:;]/.test(ch)) {
      out += span('sy-pun', esc(ch));
      i++;
      continue;
    }

    // ── anything else
    out += esc(ch);
    i++;
  }

  return out + '\n';
}

// multi-line highlight with triple-string state
function highlight(code) {
  const lines = code.split('\n');
  let html = '';
  let inTriple = false;
  let tripleChar = '';

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];

    if (inTriple) {
      const endIdx = line.indexOf(tripleChar.repeat(3));
      if (endIdx !== -1) {
        html += span('sy-str', esc(line.slice(0, endIdx + 3))) + esc(line.slice(endIdx + 3));
        inTriple = false;
      } else {
        html += span('sy-str', esc(line));
      }
      html += '\n';
      continue;
    }

    // check if this line starts a multi-line triple string
    // (simplified: just detect opening triple that has no matching close on same line)
    let openTriple = -1, tCh = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      // skip comments
      if (c === '#') break;
      // skip single-line strings
      if ((c === '"' || c === "'") && line[i+1] !== c) {
        const q = c;
        i++;
        while (i < line.length && line[i] !== q) { if (line[i]==='\\') i++; i++; }
        continue;
      }
      if ((c === '"' || c === "'") && line[i+1] === c && line[i+2] === c) {
        const q3 = c.repeat(3);
        const rest = line.indexOf(q3, i+3);
        if (rest === -1) { openTriple = i; tCh = c; break; }
        else { i = rest + 2; }
      }
    }

    if (openTriple !== -1) {
      html += highlightLine(line.slice(0, openTriple)).slice(0,-1);
      html += span('sy-str', esc(line.slice(openTriple)));
      html += '\n';
      inTriple = true;
      tripleChar = tCh;
    } else {
      html += highlightLine(line);
    }
  }

  return html;
}

// ══════════════════════════════════════════════════════════════
//  Editor: sync highlight + line numbers
// ══════════════════════════════════════════════════════════════
function syncEditor() {
  const code = $ed.value;

  // line numbers
  const n = code.split('\n').length;
  let ln = '';
  for (let i = 1; i <= n; i++) ln += i + '\n';
  $lnums.textContent = ln;

  // highlight — add trailing space so last empty line has height
  $hl.innerHTML = (_bpSet.syntax ? highlight(code + ' ') : esc(code + ' ')).replace(/\n$/, '');

  // sync scroll
  syncHLScroll();
}

function syncHLScroll() {
  // Shift #hl as a block — no scroll state → no geometry mismatch
  $hl.style.top  = -$ed.scrollTop  + 'px';
  $hl.style.left = -$ed.scrollLeft + 'px';
  $lnums.scrollTop = $ed.scrollTop;
}

const _LS = 'bowpy_code';              // main.bpy
const _LS_NAME = 'bowpy_fname';
const _LS_TABS = 'bowpy_tabs';         // every other tab: [{name, code}, ...]
const _LS_ACTIVE = 'bowpy_active_tab';
let _saveTimer = null;
function _schedSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(_saveNow, 4000);
}

// ══════════════════════════════════════════════════════════════
//  Code subtabs
//  main.bpy is the program (setup / update). Every other tab acts like a module:
//  a tab called  utils.bpy  is reachable from all tabs as  utils.<function_or_variable>
// ══════════════════════════════════════════════════════════════
const MAIN_TAB = 'main.bpy';
const _PY_HARD_KEYWORDS = new Set([
  'False','None','True','and','as','assert','async','await','break','class','continue',
  'def','del','elif','else','except','finally','for','from','global','if','import','in',
  'is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield'
]);
const $subtabs   = document.getElementById('subtabs');
const $subtabMsg = document.getElementById('subtab-msg');

let _tabs = [{ name: MAIN_TAB, code: '' }];   // _tabs[0] is always main.bpy
let _activeTab = MAIN_TAB;
let _pending = null;          // { mode: 'new' | 'rename', old } while a tab name is being typed
let _armedDelete = null;      // tab whose close button is waiting for a second click
let _armedTimer = null;
let _bpReservedNames = null;  // names Python/BowPy already use — filled in once Python has loaded

const _tabBase = name => String(name).replace(/\.bpy$/i, '');
const _getTab  = name => _tabs.find(t => t.name === name);

// Structural rules every tab name must follow (no UI state involved).
function _tabNameProblem(base) {
  if (!base) return 'Type a name for the tab.';
  if (base.toLowerCase() === 'main') return '"main.bpy" is reserved for your program. Pick another name.';
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(base))
    return 'Use only letters, digits and _ (not starting with a digit), so the tab can be used as ' + (base.replace(/[^A-Za-z0-9_]/g, '') || 'name') + '.function';
  if (_PY_HARD_KEYWORDS.has(base)) return '"' + base + '" is a Python keyword. Pick another name.';
  return null;
}

// Full check used when the user names or renames a tab.
function validateTabName(input, ignoreName) {
  const base = String(input || '').trim().replace(/\.bpy$/i, '').trim();
  const problem = _tabNameProblem(base);
  if (problem) return { ok: false, error: problem };
  const lower = base.toLowerCase();
  if (_tabs.some(t => t.name !== ignoreName && _tabBase(t.name).toLowerCase() === lower))
    return { ok: false, error: 'A tab named "' + base + '.bpy" already exists.' };
  if (_bpReservedNames && _bpReservedNames.has(base))
    return { ok: false, error: '"' + base + '" is already used by Python or BowPy. Pick another name.' };
  return { ok: true, name: base + '.bpy' };
}

// ── Editor <-> tab model ──────────────────────────────────────
function _commitActiveCode() {
  const t = _getTab(_activeTab);
  if (!t) return;
  t.code = $ed.value;
  t.ss = $ed.selectionStart; t.se = $ed.selectionEnd;
  t.st = $ed.scrollTop;      t.sl = $ed.scrollLeft;
}

function _loadActiveIntoEditor() {
  const t = _getTab(_activeTab) || _tabs[0];
  $ed.value = t.code;
  syncEditor();
  try { $ed.selectionStart = t.ss || 0; $ed.selectionEnd = t.se || 0; } catch(e) {}
  $ed.scrollTop = t.st || 0; $ed.scrollLeft = t.sl || 0;
  syncHLScroll();
}

function _saveNow() {
  clearTimeout(_saveTimer);
  _commitActiveCode();
  try {
    localStorage.setItem(_LS, _tabs[0].code);
    localStorage.setItem(_LS_TABS, JSON.stringify(_tabs.slice(1).map(t => ({ name: t.name, code: t.code }))));
    localStorage.setItem(_LS_ACTIVE, _activeTab);
  } catch(e) {}
}

// The whole program as the runtime needs it: main code + one entry per extra tab (tab-bar order).
function _bpGetProgram() {
  _commitActiveCode();
  return { main: _tabs[0].code, tabs: _tabs.slice(1).map(t => ({ name: t.name, code: t.code })) };
}

// Replace every tab at once (startup, New, Import). Entries with bad or duplicate names are skipped.
function _setProject(mainCode, extraTabs, activeName) {
  _pending = null; _armedDelete = null;
  _tabs = [{ name: MAIN_TAB, code: String(mainCode) }];
  const skipped = [];
  for (const t of (Array.isArray(extraTabs) ? extraTabs : [])) {
    const nm   = t && typeof t.name === 'string' ? t.name : '';
    const base = nm.trim().replace(/\.bpy$/i, '');
    const dup  = _tabs.some(x => _tabBase(x.name).toLowerCase() === base.toLowerCase());
    if (!t || typeof t.code !== 'string' || _tabNameProblem(base) || dup) { skipped.push(nm || '(unnamed)'); continue; }
    _tabs.push({ name: base + '.bpy', code: t.code });
  }
  _activeTab = _tabs.some(x => x.name === activeName) ? activeName : MAIN_TAB;
  _loadActiveIntoEditor();
  _renderSubtabs();
  if (skipped.length) window.appendConsole('Skipped tab(s) with an invalid or duplicate name: ' + skipped.join(', '), 'warn');
}

function _loadSavedProject() {
  let main = null, extra = [], active = null;
  try { main = localStorage.getItem(_LS); } catch(e) {}
  try { extra = JSON.parse(localStorage.getItem(_LS_TABS) || '[]'); } catch(e) { extra = []; }
  try { active = localStorage.getItem(_LS_ACTIVE); } catch(e) {}
  _setProject(main !== null ? main : DEFAULT_CODE, extra, active);
}

// ── Tab actions ───────────────────────────────────────────────
function _selectTab(name) {
  if (_pending) _pending.finish('blur');       // keep a valid name / drop an invalid one, then carry on with the click
  if (name === _activeTab || !_getTab(name)) return;
  _commitActiveCode();
  _activeTab = name;
  _loadActiveIntoEditor();
  _renderSubtabs();
  _saveNow();
}

function _beginNewTab() {
  if (_pending) {                       // already naming a tab: just put the cursor back
    const inp = $subtabs.querySelector('.subtab-input'); if (inp) inp.focus();
    return;
  }
  _armedDelete = null;
  _pending = { mode: 'new', old: null };
  _renderSubtabs();
}

function _beginRename(name) {
  if (_pending || name === MAIN_TAB || !_getTab(name)) return;
  _pending = { mode: 'rename', old: name };
  _renderSubtabs();
}

function _deleteTab(name) {
  if (_pending) _pending.finish('blur');
  const t = _getTab(name);
  if (!t || name === MAIN_TAB) return;
  if (name === _activeTab) _commitActiveCode();
  if (t.code.trim() && _armedDelete !== name) {      // non-empty tab: ask for a second click
    _armedDelete = name;
    clearTimeout(_armedTimer);
    _armedTimer = setTimeout(() => { _armedDelete = null; if (!_pending) _renderSubtabs(); }, 2500);
    _renderSubtabs();
    return;
  }
  clearTimeout(_armedTimer); _armedDelete = null;
  const idx = _tabs.indexOf(t);
  _tabs.splice(idx, 1);
  if (_activeTab === name) { _activeTab = (_tabs[idx - 1] || _tabs[0]).name; _loadActiveIntoEditor(); }
  _renderSubtabs();
  _saveNow();
  window.appendConsole('Deleted ' + name, 'sys');
}

// ── Naming (new tab / rename) ─────────────────────────────────
function _showTabError(msg, anchor) {
  $subtabMsg.textContent = msg;
  $subtabMsg.classList.add('show');
  const wrap = $subtabMsg.parentElement;
  const left = anchor.getBoundingClientRect().left - wrap.getBoundingClientRect().left;
  $subtabMsg.style.left = Math.max(0, Math.min(left, wrap.clientWidth - $subtabMsg.offsetWidth)) + 'px';
}

// how: 'enter' | 'blur' | 'cancel'
function _finishNameEdit(p, inp, box, how) {
  if (_pending !== p) return;
  const cancel = () => { _pending = null; _hideTabError(); _renderSubtabs(); };
  if (how === 'cancel') return cancel();

  const raw = inp.value;
  if (p.mode === 'rename' && raw.trim().replace(/\.bpy$/i, '').trim() === _tabBase(p.old)) return cancel();  // unchanged

  const v = validateTabName(raw, p.old);
  if (!v.ok) {
    if (how === 'enter') { box.classList.add('invalid'); _showTabError(v.error, box); return; }   // stay and fix it
    if (raw.trim()) window.appendConsole((p.mode === 'new' ? 'Tab not created: ' : 'Tab not renamed: ') + v.error, 'warn');
    return cancel();
  }

  _pending = null; _hideTabError();
  if (p.mode === 'new') {
    _commitActiveCode();
    _tabs.push({ name: v.name, code: '' });
    _activeTab = v.name;
    _loadActiveIntoEditor();
    window.appendConsole('Created ' + v.name + ' — use it from any tab as ' + _tabBase(v.name) + '.<function_or_variable>', 'sys');
  } else {
    const t = _getTab(p.old);
    t.name = v.name;
    if (_activeTab === p.old) _activeTab = v.name;
    window.appendConsole('Renamed ' + p.old + ' → ' + v.name + '. Update any ' + _tabBase(p.old) + '.… references in your code.', 'sys');
  }
  _renderSubtabs();
  _saveNow();
  if (how === 'enter') $ed.focus();
}

function _nameEditor(p) {
  const box = document.createElement('div');
  box.className = 'subtab subtab-edit';
  const inp = document.createElement('input');
  inp.className = 'subtab-input'; inp.type = 'text'; inp.maxLength = 40; inp.placeholder = 'name';
  inp.spellcheck = false; inp.autocomplete = 'off'; inp.autocapitalize = 'off';
  inp.setAttribute('autocorrect', 'off'); inp.setAttribute('aria-label', 'Tab name');
  inp.value = p.old ? _tabBase(p.old) : '';
  const fit = () => { inp.style.width = Math.max(4, inp.value.length + 1) + 'ch'; };
  fit();
  const ext = document.createElement('span');
  ext.className = 'subtab-ext'; ext.textContent = '.bpy';
  box.onclick = () => inp.focus();
  inp.addEventListener('input', () => {

}

// ── Rendering ─────────────────────────────────────────────────
function _renderSubtabs() {
  $subtabs.innerHTML = '';
  const p = _pending;
  for (const t of _tabs) {
    if (p && p.mode === 'rename' && p.old === t.name) { $subtabs.appendChild(_nameEditor(p)); continue; }
    const el = document.createElement('div');
    const active = t.name === _activeTab;
    el.className = 'subtab' + (active ? ' active' : '');
    el.setAttribute('role', 'tab');
    el.setAttribute('aria-selected', String(active));
    el.dataset.tab = t.name;
    el.title = t.name === MAIN_TAB
      ? 'main.bpy — your program (setup / update)'
      : t.name + ' — use it as ' + _tabBase(t.name) + '.name  (double-click to rename)';
    const label = document.createElement('span');
    label.textContent = t.name;
    el.appendChild(label);
    el.onclick = () => _selectTab(t.name);
    el.onmousedown = e => { if (_pending) e.preventDefault(); };   // no focus loss -> the click below is not lost
    if (t.name !== MAIN_TAB) {
      el.ondblclick = e => { e.preventDefault(); _beginRename(t.name); };
      const x = document.createElement('button');
      const armed = _armedDelete === t.name;
      x.type = 'button';
      x.className = 'subtab-x' + (armed ? ' armed' : '');
      x.textContent = armed ? 'delete?' : '×';
      x.title = armed ? 'Click again to delete this tab' : 'Delete tab';
      x.setAttribute('aria-label', 'Delete ' + t.name);
      x.onmousedown = e => { if (_pending) e.preventDefault(); };
      x.onclick = e => { e.stopPropagation(); _deleteTab(t.name); };
      el.appendChild(x);
    }
    $subtabs.appendChild(el);
  }
  if (p && p.mode === 'new') $subtabs.appendChild(_nameEditor(p));

  const add = document.createElement('button');
  add.id = 'subtab-add'; add.type = 'button'; add.textContent = '+';
  add.title = 'New tab'; add.setAttribute('aria-label', 'New tab');
  add.onmousedown = e => e.preventDefault();      // keep the cursor in the name box

  const inp = $subtabs.querySelector('.subtab-input');
  if (inp) { inp.focus(); inp.select(); } else _hideTabError();
  const cur = $subtabs.querySelector('.subtab-edit') || $subtabs.querySelector('.subtab.active');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// Split a .bpy file into its optional header lines and the main code.
function _bpSplitHeaders(text) {
  const AP = '# BOWPY_ASSETS: ', TP = '# BOWPY_TABS: ';
  const out = { assets: null, tabs: null, code: text, errors: [] };
  for (;;) {
    const isA = out.code.startsWith(AP), isT = out.code.startsWith(TP);
    if (!isA && !isT) break;
    let nl = out.code.indexOf('\n');
    if (nl === -1) nl = out.code.length;
    const payload = out.code.slice((isA ? AP : TP).length, nl);
    out.code = out.code.slice(nl + 1);
    try {
      const v = JSON.parse(payload);
      if (isA) out.assets = v; else out.tabs = v;
    } catch (e) { out.errors.push((isA ? 'Asset' : 'Tab') + ' parse error: ' + e.message); }
  }

}

// ══════════════════════════════════════════════════════════════
//  Smart keyboard handling in editor
// ══════════════════════════════════════════════════════════════
$ed.addEventListener('keydown', e => {
  const val = $ed.value;
  const ss  = $ed.selectionStart;
  const se  = $ed.selectionEnd;
  const sel = ss !== se;

  // ── Ctrl+Enter → run
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault(); if (!$runBtn.disabled) runCode(); return;
  }
  // ── Ctrl+. → stop
  if ((e.ctrlKey || e.metaKey) && e.key === '.') {
    e.preventDefault(); stopCode(); return;
  }

  // ── Tab key: indent by the tab size
  const TAB = ' '.repeat(_bpSet.tabSize);
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!sel) {
      insert(TAB, ss, se);
    } else {
      // extend start back to beginning of the first selected line
      const lineStart = val.lastIndexOf('\n', ss - 1) + 1;
      const before    = val.slice(0, lineStart);
      const after     = val.slice(se);
      const mid       = val.slice(lineStart, se);
      const indented  = e.shiftKey
        ? mid.replace(new RegExp('^ {1,' + _bpSet.tabSize + '}', 'gm'), '')
        : mid.replace(/^/gm, TAB);
      $ed.value = before + indented + after;
      $ed.selectionStart = lineStart;
      $ed.selectionEnd   = lineStart + indented.length;
      syncEditor();
    }
    return;
  }

  // ── Enter: smart auto-indent
  if (e.key === 'Enter' && !e.ctrlKey && _bpSet.autoIndent) {
    e.preventDefault();

    // find current line
    const lineStart = val.lastIndexOf('\n', ss - 1) + 1;
    const currentLine = val.slice(lineStart, ss);

    // base indent = leading whitespace of current line
    const baseIndent = currentLine.match(/^(\s*)/)[1];

    // increase indent if line ends with :
    const stripped = currentLine.trimEnd();
    const extraIndent = stripped.endsWith(':') ? TAB : '';

    // if cursor is inside brackets/parens/braces, add extra indent
    // (simple heuristic: count unmatched opens)
    const prevText = val.slice(0, ss);
    let brackets = 0;
    for (const c of prevText) {
      if ('([{'.includes(c)) brackets++;
      else if (')]}'.includes(c)) brackets--;
    }
    const bracketIndent = brackets > 0 && !extraIndent ? TAB : '';

    const newIndent = baseIndent + extraIndent + bracketIndent;
    insert('\n' + newIndent, ss, se);
    return;
  }

  // ── Backspace: delete 4 spaces as one if only spaces before cursor on line
  if (e.key === 'Backspace' && !sel && _bpSet.autoIndent) {
    const lineStart = val.lastIndexOf('\n', ss - 1) + 1;
    const beforeCursor = val.slice(lineStart, ss);
    const tsz = _bpSet.tabSize;
    if (beforeCursor.length > 0 && beforeCursor.trimEnd() === '' && beforeCursor.length % tsz === 0) {
      e.preventDefault();
      insert('', ss - tsz, ss);
      return;
    }
  }

  // ── Auto-close pairs: () [] {} "" ''
  const pairs = {};
  if (_bpSet.autoBrackets) Object.assign(pairs, { '(':')', '[':']', '{':'}' });
  if (_bpSet.autoQuotes) Object.assign(pairs, { '"':'"', "'":"'" });
  if (pairs[e.key]) {
    if (sel) {
      // surround selection with the pair — works for brackets AND quotes
      e.preventDefault();
      const selected = val.slice(ss, se);
      const wrapped  = e.key + selected + pairs[e.key];
      $ed.value = val.slice(0, ss) + wrapped + val.slice(se);
      $ed.selectionStart = ss + 1;
      $ed.selectionEnd   = ss + 1 + selected.length;
      syncEditor();
      return;
    }
    // no selection: auto-close
    e.preventDefault();
    insert(e.key + pairs[e.key], ss, se);
    $ed.selectionStart = $ed.selectionEnd = ss + 1;
    syncEditor();
    return;
  }

  // ── Skip closing char if already there
  const closers = new Set(_bpSet.autoBrackets ? [')', ']', '}'] : []);
  if ((closers.has(e.key) || (_bpSet.autoQuotes && (e.key === '"' || e.key === "'"))) && !sel) {
    if (val[ss] === e.key) {
      e.preventDefault();
      $ed.selectionStart = $ed.selectionEnd = ss + 1;
      return;
    }
  }
});

  $ed.selectionStart = $ed.selectionEnd = start + text.length;

}

// ── Pointer input shared by the editor and exported games ─────────────────────────────────────────────
// One finger (or pen) acts as the left mouse button (button 0); the mouse works as usual. The state machine
// is deliberately small and idempotent so a browser quirk can never leave a button stuck or invent a press:
//   * fingers use Pointer Events (touch events only where those do not exist). A held finger is never turned
//     into a long-press: contextmenu / selection / drag are cancelled and the page never scrolls or zooms.
//   * the mouse events a browser emulates after a touch are ignored, so a finger is never counted twice.
//   * a button released by the browser (window loses focus, tab hidden, release outside the window) is
//     released here too.
// `io` = { pos(clientX, clientY), down(button), up(button), releaseAll() }. Self-contained: it is also
// serialised into exported games with Function.prototype.toString().
function _bpInputFactory() {
  function install(canvas, io) {
    const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
    let touchId = null;                 // pointer / touch identifier of the finger acting as the mouse
    let touchAt = -1e9;                 // last time a finger did anything
    // Chromium says whether a mouse event came from a touch (sourceCapabilities); elsewhere a mouse event that
    // arrives right after a finger did something is taken to be the emulated one.
    const fromTouch = e => touchId !== null ||
      (e.sourceCapabilities ? !!e.sourceCapabilities.firesTouchEvents : now() - touchAt < 700);
    const stop = e => { if (e.cancelable) e.preventDefault(); };

    // never let a long press become a context menu, a text selection or a drag
    canvas.draggable = false;
    for (const t of ['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange'])
      canvas.addEventListener(t, stop);

    // ── mouse ──
    canvas.addEventListener('mousemove', e => { if (!fromTouch(e)) io.pos(e.clientX, e.clientY); });
    canvas.addEventListener('mousedown', e => { if (!fromTouch(e)) { io.pos(e.clientX, e.clientY); io.down(e.button); } });
    window.addEventListener('mouseup', e => { if (!fromTouch(e)) io.up(e.button); }, true);   // also outside the canvas

    // ── fingers ──
    const begin = (id, primary, x, y) => {
      touchAt = now();
      if (touchId !== null && !primary) return false;        // a finger already acts as the mouse
      touchId = id; io.pos(x, y); io.down(0);
      return true;
    };
    const move = (id, x, y) => { if (id === touchId) { touchAt = now(); io.pos(x, y); } };
    const end = (id, x, y) => {
      if (id !== touchId) return;
      touchAt = now();
      if (x != null) io.pos(x, y);
      touchId = null; io.up(0);
    };

    if (typeof window.PointerEvent === 'function') {
      canvas.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse') return;
        if (begin(e.pointerId, e.isPrimary, e.clientX, e.clientY)) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
        stop(e);
      });
      canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') move(e.pointerId, e.clientX, e.clientY); });
      canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') end(e.pointerId, e.clientX, e.clientY); });
      canvas.addEventListener('pointercancel', e => { if (e.pointerType !== 'mouse') end(e.pointerId); });
      canvas.addEventListener('lostpointercapture', e => { if (e.pointerType !== 'mouse') end(e.pointerId); });
      // touch events only switch off scrolling / zooming / the iOS callout; the state comes from the pointer events
      for (const t of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) canvas.addEventListener(t, stop, { passive: false });
    } else {
      const find = list => { for (const t of list) if (t.identifier === touchId) return t; return null; };
      canvas.addEventListener('touchstart', e => {
        stop(e);
        if (e.touches.length === e.changedTouches.length) touchId = null;      // first finger down: forget a stale touch
        const t = e.changedTouches[0];
        begin(t.identifier, true, t.clientX, t.clientY);
      }, { passive: false });
      canvas.addEventListener('touchmove', e => { stop(e); const t = find(e.changedTouches); if (t) move(t.identifier, t.clientX, t.clientY); }, { passive: false });
      canvas.addEventListener('touchend', e => { stop(e); const t = find(e.changedTouches); if (t) end(t.identifier, t.clientX, t.clientY); }, { passive: false });
      canvas.addEventListener('touchcancel', e => { stop(e); const t = find(e.changedTouches); if (t) end(t.identifier); }, { passive: false });
    }

    // ── the browser took the input away (switched app / tab, lost focus): nothing stays pressed ──
    const releaseAll = () => { touchId = null; io.releaseAll(); };
    window.addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
    window.addEventListener('pagehide', releaseAll);
  }
  return { install };
}

  const A = []; const B = [];

    A.push([dx, dy, 1, 0, 0, 0, -sx * dx, -sx * dy]); B.push(sx);
    A.push([0, 0, 0, dx, dy, 1, -sy * dx, -sy * dy]); B.push(sy);

    if (Math.abs(A[piv][i]) < 1e-12) return null;
    if (piv !== i) { [A[i], A[piv]] = [A[piv], A[i]]; [B[i], B[piv]] = [B[piv], B[i]]; }

    for (let j = i; j < 8; j++) A[i][j] /= div;
    B[i] /= div;
    for (let r = 0; r < 8; r++) {
      if (r === i) continue;
      const f = A[r][i];

      for (let j = i; j < 8; j++) A[r][j] -= f * A[i][j];

    return float(p[0]), float(p[1])

_MIX_CACHE = {}
def _mix_rgba(c):
    """A colour (name, (r, g, b) or (r, g, b, a)) as a list of 3 or 4 numbers from 0 to 255."""
    if isinstance(c, str):
        v = _MIX_CACHE.get(c)
        if v is None:
            r = _py.color_rgba(c)
            if r is None:
                raise ValueError(f'mix(): {c!r} is not a colour')
            r = [int(x) for x in r]
            v = tuple(r) if r[3] != 255 else tuple(r[:3])
            if len(_MIX_CACHE) > 512: _MIX_CACHE.clear()
            _MIX_CACHE[c] = v
        return list(v)
    return list(c)

def mix(a, b, t):
    """Blend a and b by t (0 gives a, 1 gives b), like GLSL mix().

    Numbers, Vec2, Vec3 and Vec4 are blended component by component; t is not clamped.
    Colours (names such as "red", (r, g, b) or (r, g, b, a) tuples) are blended with t clamped to 0..1 and
    come back as a tuple of whole numbers from 0 to 255 (with an alpha if either colour has one).

    Example:
        mix(0, 10, 0.25)             # 2.5
        mix("blue", "red", 0.5)      # (127, 0, 127)
    """
    ta = type(a)
    if (ta is tuple or ta is list or ta is str) and type(b) in (tuple, list, str):
        t = clamp(t, 0, 1)
        la = _mix_rgba(a); lb = _mix_rgba(b)
        n = 4 if (len(la) == 4 or len(lb) == 4) else 3
        while len(la) < 4: la.append(255)
        while len(lb) < 4: lb.append(255)
        return tuple(int(la[i] + (lb[i] - la[i]) * t) for i in range(n))
    return a + (b - a) * t

def _pts(points):
    """Convert an iterable of points (tuple/list/Vec2) to a list of [x,y] lists."""
    out = []
    for p in points:
        if hasattr(p, 'x') and hasattr(p, 'y'):
            out.append([float(p.x), float(p.y)])
        else:
            out.append([float(p[0]), float(p[1])])
    return out

def regular_poly(cx, cy, radius, sides, angle_offset=0):
    """Return a tuple of (x,y) tuples for a regular polygon.
    cx,cy = center;  radius = circumradius;  sides = number of sides;
    angle_offset = rotation in radians (0 = first vertex pointing right)."""
    step = tau / int(sides)
    ao = _deg(angle_offset)
    return tuple(
        (cx + radius * cos(ao + i * step),
         cy + radius * sin(ao + i * step))
        for i in range(int(sides))
    )

def _to_pts(polygon):
    """Normalize a sequence of Vec2 / tuple / list points → list of (float, float)."""
    out = []
    for p in polygon:
        if hasattr(p, 'x') and hasattr(p, 'y'):
            out.append((float(p.x), float(p.y)))
        else:
            out.append((float(p[0]), float(p[1])))
    return out

def _pos2(p, fname, what):
    try:
        return _pt2(p)
    except (TypeError, IndexError, ValueError, AttributeError):
        raise TypeError(f'{fname}(): {what} must be a Vec2 or an (x, y) tuple, got {p!r}') from None

def offset_poly(pts, pos):
    """Shift every point of a polygon by *pos* and return the new polygon as a tuple of (x, y) tuples.

    *pts* is a sequence of (x, y) tuples or Vec2 values; *pos* is a Vec2 or an (dx, dy) tuple.
    The original polygon is not changed.

    Example:
        hexagon = regular_poly(0, 0, 50, 6)
        draw_poly(offset_poly(hexagon, mouse_pos()), CYAN)
    """
    dx, dy = _pos2(pos, 'offset_poly', 'pos')
    return tuple((x + dx, y + dy) for x, y in _to_pts(pts))

def rotate_poly(pts, angle, origin=(0, 0)):
    """Rotate every point of a polygon by *angle* degrees around *origin* and return the new polygon as a tuple of (x, y) tuples.

    Positive angles turn clockwise on the screen (the y axis points down), like Vec2.rotated().
    *origin* is a Vec2 or an (x, y) tuple, (0, 0) by default. The original polygon is not changed.

    Example:
        square = [(300, 200), (400, 200), (400, 300), (300, 300)]
        draw_poly(rotate_poly(square, 45, (350, 250)), ORANGE)
    """
    ox, oy = _pos2(origin, 'rotate_poly', 'origin')
    k = float(angle) % 360.0
    if k == 0.0:      c, sn = 1.0, 0.0
    elif k == 90.0:   c, sn = 0.0, 1.0
    elif k == 180.0:  c, sn = -1.0, 0.0
    elif k == 270.0:  c, sn = 0.0, -1.0
    else:
        r = math.radians(k)
        c, sn = math.cos(r), math.sin(r)
    out = []
    for x, y in _to_pts(pts):
        x -= ox; y -= oy
        out.append((ox + x * c - y * sn, oy + x * sn + y * c))
    return tuple(out)

def point_in_poly(point, polygon):
    """Return True if *point* (Vec2 or (x,y)) lies inside *polygon*.

    *polygon* is a sequence of Vec2 / (x,y) tuples describing the vertices
    in order (clockwise or counter-clockwise).  Concave polygons are fully
    supported.  Points exactly on an edge are considered inside.

    Uses the ray-casting (even-odd rule) algorithm.

    Example:
        pts = regular_poly(200, 200, 80, 6)
        if point_in_poly(mouse_pos(), pts):
            draw_poly(pts, GREEN)
    """
    if hasattr(point, 'x') and hasattr(point, 'y'):
        px, py = float(point.x), float(point.y)
    else:
        px, py = float(point[0]), float(point[1])

    verts = _to_pts(polygon)
    n = len(verts)
    if n < 3:
        return False

    inside = False
    j = n - 1
    for i in range(n):
        xi, yi = verts[i]
        xj, yj = verts[j]
        # Check if the point is exactly on the edge
        # (handles degenerate on-edge case)
        if abs(yi - yj) < 1e-12:
            # Horizontal edge: check if point is on it
            if abs(py - yi) < 1e-12 and min(xi, xj) <= px <= max(xi, xj):
                return True
        else:
            # Ray crosses the edge if py is strictly between yi and yj
            if ((yi > py) != (yj > py)):
                x_intersect = (xj - xi) * (py - yi) / (yj - yi) + xi
                if px == x_intersect:
                    return True  # on edge
                if px < x_intersect:
                    inside = not inside
        j = i

    return inside


def _segs_intersect(ax, ay, bx, by, cx, cy, dx, dy):
    """Return True if segment AB intersects segment CD (shared endpoints count)."""
    def _cross(ox, oy, ax, ay, bx, by):
        return (ax - ox) * (by - oy) - (ay - oy) * (bx - ox)

    d1 = _cross(cx, cy, dx, dy, ax, ay)
    d2 = _cross(cx, cy, dx, dy, bx, by)
    d3 = _cross(ax, ay, bx, by, cx, cy)
    d4 = _cross(ax, ay, bx, by, dx, dy)

    if ((d1 > 0 > d2) or (d1 < 0 < d2)) and \
       ((d3 > 0 > d4) or (d3 < 0 < d4)):
        return True

    def _on_seg(px, py, ax, ay, bx, by):
        return (min(ax, bx) <= px <= max(ax, bx) and
                min(ay, by) <= py <= max(ay, by))

    if d1 == 0 and _on_seg(ax, ay, cx, cy, dx, dy): return True
    if d2 == 0 and _on_seg(bx, by, cx, cy, dx, dy): return True
    if d3 == 0 and _on_seg(cx, cy, ax, ay, bx, by): return True
    if d4 == 0 and _on_seg(dx, dy, ax, ay, bx, by): return True
    return False


def poly_in_poly(poly, *polys):
    """Return True if *poly* overlaps any of the other polygons in *polys*.

    Works for both convex and concave polygons.  Two polygons are considered
    colliding when:
      • any edge of one polygon intersects any edge of the other, OR
      • one polygon is entirely contained inside the other.

    Each polygon is a sequence of Vec2 / (x,y) vertices.

    Example:
        player = regular_poly(px, py, 20, 4)
        walls  = [regular_poly(wx, wy, 30, 6) for wx, wy in wall_pos]
        if poly_in_poly(player, *walls):
            draw_poly(player, RED)

    You can also test against a single other polygon:
        if poly_in_poly(poly_a, poly_b):
            ...
    """
    a = _to_pts(poly)
    na = len(a)
    if na < 3:
        return False

    for other in polys:
        b = _to_pts(other)
        nb = len(b)
        if nb < 3:
            continue

        # 1. Edge-vs-edge intersection test
        colliding = False
        for i in range(na):
            ax, ay = a[i]
            bx, by = a[(i + 1) % na]
            for j in range(nb):
                cx, cy = b[j]
                dx, dy = b[(j + 1) % nb]
                if _segs_intersect(ax, ay, bx, by, cx, cy, dx, dy):
                    colliding = True
                    break
            if colliding:
                break

        if colliding:
            return True

        # 2. Containment: a single vertex of A inside B (A ⊂ B)
        if point_in_poly(a[0], b):
            return True

        # 3. Containment: a single vertex of B inside A (B ⊂ A)
        if point_in_poly(b[0], a):
            return True

    return False


def _rect_bounds(rx, ry, rw, rh):
    """Return (left, top, right, bottom) of a rectangle; a negative width/height is allowed."""
    x1, x2 = sorted((float(rx), float(rx) + float(rw)))
    y1, y2 = sorted((float(ry), float(ry) + float(rh)))
    return x1, y1, x2, y2

def point_in_rect(px, py, rx, ry, rw, rh):
    """Return True if the point (px, py) lies inside the rectangle.

    (rx, ry) is the top-left corner, rw / rh the width and height.
    A point exactly on an edge counts as inside.

    Example:
        if point_in_rect(mouse_x(), mouse_y(), 100, 100, 200, 120):
            draw_rect(100, 100, 200, 120, GREEN)
    """
    x1, y1, x2, y2 = _rect_bounds(rx, ry, rw, rh)
    return x1 <= float(px) <= x2 and y1 <= float(py) <= y2

def rect_in_rect(x1, y1, w1, h1, x2, y2, w2, h2):
    """Return True if the first rectangle intersects the second one.

    Each rectangle is (x, y, width, height) with (x, y) as its top-left corner.
    Rectangles that only touch along an edge, and rectangles where one is
    completely inside the other, both count as intersecting.

    Example:
        if rect_in_rect(px, py, 32, 32, wall_x, wall_y, 64, 64):
            print("hit a wall")
    """
    al, at, ar, ab = _rect_bounds(x1, y1, w1, h1)
    bl, bt, br, bb = _rect_bounds(x2, y2, w2, h2)
    return al <= br and bl <= ar and at <= bb and bt <= ab

def poly_in_rect(points, rx, ry, rw, rh):
    """Return True if the polygon intersects the rectangle.

    *points* is a sequence of Vec2 / (x, y) vertices (convex or concave).
    Touching, crossing, and one shape being completely inside the other all
    count as intersecting.

    Example:
        tri = regular_poly(mouse_x(), mouse_y(), 40, 3)
        if poly_in_rect(tri, 150, 100, 200, 120):
            draw_poly(tri, RED)
    """
    x1, y1, x2, y2 = _rect_bounds(rx, ry, rw, rh)
    return poly_in_poly(points, [(x1, y1), (x2, y1), (x2, y2), (x1, y2)])

def point_in_circle(px, py, cx, cy, r):
    """Return True if the point (px, py) lies inside the circle centred at (cx, cy) with radius r.

    A point exactly on the edge counts as inside.

    Example:
        if point_in_circle(mouse_x(), mouse_y(), 200, 150, 60):
            draw_circle(200, 150, 60, GREEN)
    """
    dx = float(px) - float(cx)
    dy = float(py) - float(cy)
    r = abs(float(r))
    return dx * dx + dy * dy <= r * r

def circle_in_circle(x1, y1, r1, x2, y2, r2):
    """Return True if the first circle overlaps the second circle.

    Circles that only touch, and a circle completely inside the other one,
    both count as overlapping.

    Example:
        if circle_in_circle(player_x, player_y, 16, coin_x, coin_y, 8):
            score += 1
    """
    dx = float(x1) - float(x2)
    dy = float(y1) - float(y2)
    rr = abs(float(r1)) + abs(float(r2))
    return dx * dx + dy * dy <= rr * rr

def rect_in_circle(rx, ry, rw, rh, cx, cy, r):
    """Return True if the rectangle overlaps the circle.

    Touching, crossing, and one shape being completely inside the other all
    count as overlapping.

    Example:
        if rect_in_circle(box_x, box_y, 40, 40, 200, 150, 60):
            draw_rect(box_x, box_y, 40, 40, RED)
    """
    x1, y1, x2, y2 = _rect_bounds(rx, ry, rw, rh)
    cx = float(cx)
    cy = float(cy)
    r = abs(float(r))
    nx = min(max(cx, x1), x2)       # the point of the rectangle closest to the circle's centre
    ny = min(max(cy, y1), y2)
    return (cx - nx) ** 2 + (cy - ny) ** 2 <= r * r

def poly_in_circle(points, cx, cy, r):
    """Return True if the polygon overlaps the circle.

    *points* is a sequence of Vec2 / (x, y) vertices (convex or concave).
    Touching, crossing, and one shape being completely inside the other all
    count as overlapping.

    Example:
        tri = regular_poly(px, py, 30, 3)
        if poly_in_circle(tri, 200, 150, 60):
            draw_poly(tri, RED)
    """
    pts = _to_pts(points)
    n = len(pts)
    if n < 3:
        return False
    cx = float(cx)
    cy = float(cy)
    r = abs(float(r))
    if point_in_poly((cx, cy), pts):        # the circle's centre is inside the polygon
        return True
    r2 = r * r
    for i in range(n):                      # otherwise: does any edge come within r of the centre?
        ax, ay = pts[i]
        bx, by = pts[(i + 1) % n]
        dx = bx - ax
        dy = by - ay
        seg2 = dx * dx + dy * dy
        t = 0.0 if seg2 == 0 else max(0.0, min(1.0, ((cx - ax) * dx + (cy - ay) * dy) / seg2))
        qx = ax + t * dx
        qy = ay + t * dy
        if (cx - qx) ** 2 + (cy - qy) ** 2 <= r2:
            return True
    return False

def draw_text(x,y,text,color=WHITE,size=16,font='monospace',*,align='left',baseline='top',stroke=None,stroke_width=2,angle=0,italic=False,line_spacing=1.2):
    _font=str(font)
    lines=str(text).split('\\n'); n=len(lines); line_h=float(size)*float(line_spacing)
    # compute per-line (lx,ly) and internal baseline
    if n==1:
        pts=[(float(x),float(y))]; per_base=str(baseline)
    else:
        if baseline=='middle': sy=float(y)-((n-1)*line_h+float(size))/2
        elif baseline=='bottom': sy=float(y)-(n-1)*line_h-float(size)
        else: sy=float(y)
        pts=[(float(x),sy+i*line_h) for i in range(n)]; per_base='top'
    needs_rot=float(angle)!=0; needs_skew=bool(italic)
    needs_transform=needs_rot or needs_skew
    if needs_transform:
        _py.save(); _py.trans(float(x),float(y))
        if needs_rot: _py.rot(_deg(angle))
        if needs_skew: _py.skew(-0.25,0)   # horizontal shear ≈ 14° italic slant
        draw_pts=[(lx-float(x),ly-float(y)) for lx,ly in pts]
    else:
        draw_pts=pts
    if stroke is not None:
        fc,fa=_css(color); sc,sa=_css(stroke)
        prev=float(_py.galpha()) if fa<0.9999 else None
        if prev is not None: _py.alpha(prev*fa)
        for i,(lx,ly) in enumerate(draw_pts):
            _py.txt2(float(lx),float(ly),lines[i],fc,sc,float(size),_font,str(align),per_base,float(stroke_width))
        if prev is not None: _py.alpha(prev)
    else:
        def _dtxt(c):
            for i,(lx,ly) in enumerate(draw_pts):
                _py.txt(float(lx),float(ly),lines[i],c,float(size),_font,str(align),per_base)
        _do(color,_dtxt)
    if needs_transform: _py.restore()

def _grad_stops(stops):
    if len(stops) == 1 and isinstance(stops[0], (list, tuple)) and stops[0] and isinstance(stops[0][0], (list, tuple)):
        stops = stops[0]
    out = []
    for stop in stops:
        if hasattr(stop, 'toJs'):
            stop = stop.toJs()
        pos, color = stop[0], stop[1]
        out.append((float(pos), _css_clear(color)))
    return out

def get_pixel(x, y=None):
    """get_pixel(x, y) -> (r, g, b, a)   the colour of the screen pixel at x, y, each value from 0 to 255.
    get_pixel(pos) -> Vec4(r, g, b, a)   the colour at pos, a Vec2 from 0 to 1 ((0, 0) is the top-left corner, (1, 1) the
                                         bottom-right), each value from 0 to 1. Between two pixels it blends them, like a
                                         GPU texture read.

    Inside fragment(pos) only the Vec2 form is used: get_pixel(pos) is the colour that was drawn at pos.
    """
    if y is None:
        return _sh_sample(x)
    v = int(_py.get_pixel_packed(int(x), int(y)))
    return (v >> 24, (v >> 16) & 255, (v >> 8) & 255, v & 255)

    """Round *num* to *dec* decimal places.
