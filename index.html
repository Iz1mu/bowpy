def _vflat(args, dim, name):
    """Numbers, vectors and tuples, flattened in order and padded with 0.0 up to dim values."""
    out = []
    for a in args:
        if isinstance(a, (Vec2, Vec3, Vec4)):
            out.extend(a.to_tuple())
        elif isinstance(a, (tuple, list)):
            out.extend(float(c) for c in a)
        else:
            out.append(float(a))
    if len(out) > dim:
        if any(out[dim:]):                       # (the unused default arguments are zeros and are simply dropped)
            raise ValueError(f'{name}() takes at most {dim} values, got {len(out)}')
        del out[dim:]
    out.extend([0.0] * (dim - len(out)))
    return out

_SWZ_XYZW = {'x': 0, 'y': 1, 'z': 2, 'w': 3}
_SWZ_RGBA = {'r': 0, 'g': 1, 'b': 2, 'a': 3}
def _swizzle(v, name):
    """v.xy, v.zyx, v.rgb ... (read only): a number for one letter, otherwise a Vec2 / Vec3 / Vec4."""
    if not (1 <= len(name) <= 4):
        return None
    for table in (_SWZ_XYZW, _SWZ_RGBA):
        if all(c in table for c in name):
            t = v.to_tuple()
            idx = [table[c] for c in name]
            if max(idx) >= len(t):
                return None
            vals = [t[i] for i in idx]
            return vals[0] if len(vals) == 1 else (Vec2, Vec3, Vec4)[len(vals) - 2](*vals)
    return None

def _vop(s, v, f, rev=False):
    """Component-wise f(self, other) where other is a vector of the same size or a number."""
    a = s.to_tuple()
    if isinstance(v, (Vec2, Vec3, Vec4)):
        b = v.to_tuple()
        if len(b) != len(a):
            raise TypeError(f'cannot combine a {type(s).__name__} with a {type(v).__name__}')
    else:
        b = (float(v),) * len(a)
    return type(s)(*[(f(q, p) if rev else f(p, q)) for p, q in zip(a, b)])

def dot(a,b):
    """Dot product of two vectors (Vec2, Vec3 or Vec4), or the product of two numbers."""
    if isinstance(a,(int,float)): return a*b
    return sum(p*q for p,q in zip(a.to_tuple(),b.to_tuple()))

def cross(a,b):
    """Cross product: a number for two Vec2, a Vec3 for two Vec3."""
    if isinstance(a,Vec2): return a.x*b.y-a.y*b.x
    return Vec3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x)

def length(v):
    """Length of a vector (or the absolute value of a number)."""
    if isinstance(v,(int,float)): return abs(v)
    return math.sqrt(sum(c*c for c in v.to_tuple()))

def step(edge,x):
    """0.0 where x < edge, otherwise 1.0 (works on numbers and on vectors)."""
    if isinstance(x,(Vec2,Vec3,Vec4)): return type(x)(*[step(edge,c) for c in x.to_tuple()])
    return 0.0 if x<edge else 1.0

def smoothstep(edge0,edge1,x):
    """Smooth 0 -> 1 transition between edge0 and edge1 (clamped, S-shaped). Works on numbers and on vectors."""
    if isinstance(x,(Vec2,Vec3,Vec4)): return type(x)(*[smoothstep(edge0,edge1,c) for c in x.to_tuple()])
    if edge1==edge0: return step(edge0,x)
    t=max(0.0,min(1.0,(x-edge0)/(edge1-edge0)))
    return t*t*(3.0-2.0*t)

class Matrix:
    def __init__(s,w,h,d=None):
        s._w=int(w); s._h=int(h)
        s._g=[d() if callable(d) else copy.deepcopy(d) for _ in range(s._w*s._h)]
    width=property(lambda s:s._w); height=property(lambda s:s._h); size=property(lambda s:s._w*s._h)
    def __getitem__(s,p):
        x,y=(int(p.x),int(p.y)) if hasattr(p,'x') else (int(p[0]),int(p[1])); return s._g[y*s._w+x]
    def __setitem__(s,p,v):
        x,y=(int(p.x),int(p.y)) if hasattr(p,'x') else (int(p[0]),int(p[1])); s._g[y*s._w+x]=v
    def __contains__(s,v): return v in s._g
    def __iter__(s): return iter(s._g)
    def __len__(s): return s.size
    def fill(s,v): s._g[:]=[v]*s.size
    def copy(s): r=Matrix(s._w,s._h); r._g=[copy.deepcopy(v) for v in s._g]; return r
    def items(s): w=s._w; return ((i%w,i//w,s._g[i]) for i in range(s.size))
    def positions(s): w=s._w; return ((i%w,i//w) for i in range(s.size))
    def neighbors(s,x,y):
        w,h=s._w,s._h
        return ((x+dx,y+dy) for dy in (-1,0,1) for dx in (-1,0,1) if (dx or dy) and 0<=x+dx<w and 0<=y+dy<h)
    def cardinal(s,x,y):
        w,h=s._w,s._h
        return ((x+dx,y+dy) for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)) if 0<=x+dx<w and 0<=y+dy<h)
    def map(s,f): r=Matrix(s._w,s._h); r._g=[f(v) for v in s._g]; return r
    def apply(s,f): s._g=[f(v) for v in s._g]
    def in_bounds(s,x,y): return 0<=x<s._w and 0<=y<s._h
    def transposted(s):
        r=Matrix(s._h,s._w)
        for y in range(s._h):
            for x in range(s._w):
                r[x,y] = s[x,y]
        return r
    def transpose(s): return s.transposted()
    def flip(s):
        """Return a copy flipped along the y-axis (left ↔ right / horizontal mirror)."""
        r=Matrix(s._w,s._h)
        for y in range(s._h):
            for x in range(s._w):
                r[x,y]=s[s._w-1-x,y]
        return r
    def mirror_horizontal(s): return s.flip()
    def flip_horizontal(s):   return s.flip()
    def mirror(s):
        """Return a copy mirrored along the x-axis (top ↔ bottom / vertical flip)."""
        r=Matrix(s._w,s._h)
        for y in range(s._h):
            for x in range(s._w):
                r[x,y]=s[x,s._h-1-y]
        return r
    def flip_vertical(s):   return s.mirror()
    def mirror_vertical(s): return s.mirror()
    def __mul__(s,o):
        """a * b multiplies two Matrix objects as matrices; a * 2 multiplies every cell by the number."""
        if isinstance(o,(int,float)) and not isinstance(o,bool):
            r=Matrix(s._w,s._h)
            r._g=[v*o for v in s._g]
            return r
        if not isinstance(o, Matrix): return NotImplemented
        if s._w != o._h: raise ValueError('matrix dimensions do not align for multiplication')
        r=Matrix(o._w, s._h, 0)
        for y in range(s._h):
            for x in range(o._w):
                total = 0
                for k in range(s._w):
                    total += s[k,y] * o[x,k]
                r[x,y] = total
        return r
    def __rmul__(s,o):
        if isinstance(o,(int,float)) and not isinstance(o,bool): return s.__mul__(o)
        return NotImplemented
    def __matmul__(s,o):
        raise TypeError('Matrix multiplication uses *, not @: write a * b')
    __rmatmul__ = __matmul__
    def __repr__(s): return f'Matrix({s._w}, {s._h})'

def _nhash(ix, iy=0, iz=0):
    h=(ix*1619+iy*31337+iz*6791)&0xFFFFFFFF; h^=h>>13; h=(h*1274126177)&0xFFFFFFFF; h^=h>>16
    return h/0xFFFFFFFF

def noise1(x, smooth=True):
    """1D value noise in [0, 1].

    smooth=True  – smooth S-curve interpolation (default, C1-continuous).
    smooth=False – simple linear interpolation between corner values.

    Example:
        y = noise1(get_time()) * H()
    """
    ix=int(floor(x)); fx=fract(x)
    u=smooth_step(fx) if smooth else fx
    return lerp(_nhash(ix), _nhash(ix+1), u)

def noise2(x, y=0, smooth=True):
    """2D value noise in [0, 1].

    smooth=True  – smooth S-curve interpolation (default, C1-continuous).
    smooth=False – simple bilinear interpolation between corner values.

    Example:
        v = noise2(x * 0.01, get_time() * 0.3)
    """
    ix,iy=int(floor(x)),int(floor(y)); fx,fy=fract(x),fract(y)
    u,v=(smooth_step(fx),smooth_step(fy)) if smooth else (fx,fy)
    a=_nhash(ix,iy);b=_nhash(ix+1,iy);c=_nhash(ix,iy+1);d=_nhash(ix+1,iy+1)
    return lerp(lerp(a,b,u),lerp(c,d,u),v)

def noise3(x, y=0, z=0, smooth=True):
    """3D value noise in [0, 1].

    smooth=True  – smooth S-curve interpolation (default, C1-continuous).
    smooth=False – simple trilinear interpolation between corner values.

    Example:
        v = noise3(x * 0.01, y * 0.01, get_time() * 0.2)
    """
    ix,iy,iz=int(floor(x)),int(floor(y)),int(floor(z)); fx,fy,fz=fract(x),fract(y),fract(z)
    u,v,w=(smooth_step(fx),smooth_step(fy),smooth_step(fz)) if smooth else (fx,fy,fz)
    a000=_nhash(ix,iy,iz);   a100=_nhash(ix+1,iy,iz)
    a010=_nhash(ix,iy+1,iz); a110=_nhash(ix+1,iy+1,iz)
    a001=_nhash(ix,iy,iz+1); a101=_nhash(ix+1,iy,iz+1)
    a011=_nhash(ix,iy+1,iz+1); a111=_nhash(ix+1,iy+1,iz+1)
    return lerp(lerp(lerp(a000,a100,u),lerp(a010,a110,u),v),
                lerp(lerp(a001,a101,u),lerp(a011,a111,u),v),w)

def noise(x, y=0, smooth=True):
    """Alias for noise2(). 2D value noise in [0, 1]."""
    return noise2(x, y, smooth)

class Image:
    """Load an image from a URL or capture one from the screen.
    img = Image("https://example.com/sprite.png")
    img = Image.from_screen((x1, y1), (x2, y2))
    draw_image(img, x, y)
    draw_image_quad(img, p1, p2, p3, p4)
    img.ready / img.width / img.height / img.size()
    """
    def __init__(s, url):
        s._h = _py.img_create(str(url))
        _asset_registry.append(s)
    @classmethod
    def from_screen(cls, p1, p2, keep=False):
        """Capture a rectangle of the canvas as an Image.

        p1, p2  – corner points (Vec2 or (x, y)).
        keep    – if True the underlying <img> element is NOT cleared at the end
                  of the frame, so the Image can be reused across multiple frames.
                  Defaults to False (single-frame cache, freed automatically).
        """
        x1,y1 = _pt2(p1)
        x2,y2 = _pt2(p2)
        h = _py.img_from_screen(float(x1), float(y1), float(x2), float(y2), bool(keep))
        obj = cls.__new__(cls)
        obj._h = h
        _asset_registry.append(obj)
        return obj
    @property
    def ready(s):  return bool(_py.img_ready(s._h))
    @property
    def width(s):  return int(_py.img_size(s._h).to_py()[0])
    @property
    def height(s): return int(_py.img_size(s._h).to_py()[1])
    def size(s):
        v=_py.img_size(s._h).to_py(); return (int(v[0]),int(v[1]))

def draw_image(img, x, y, width=None, height=None, angle=0, origin=(0,0), tint=None):
    """Draw an Image. x,y is the anchor; origin=(ox,oy) defines which point
    within the image is the anchor: (0,0)=top-left, (0.5,0.5)=center, (1,1)=bottom-right.
    angle is in degrees, rotating around the anchor point.
    width/height default to the image's natural size.
    Pass a negative width or height to flip/mirror the image along that axis.
    tint multiplies every pixel of the image by the given color.
    """
    w = float(width)  if width  is not None else 0.0   # 0 = natural size
    h = float(height) if height is not None else 0.0
    ox, oy = _get_origin(origin)
    _py.img_draw(img._h, float(x), float(y), w, h, _deg(angle), ox, oy, _css_clear(tint) if tint is not None else None)


def _asset_info(name):
    info = _py.asset_get(str(name))
    if info is None:
        return None
    return info.to_py() if hasattr(info, 'to_py') else info

def read_txt(name):
    """Read a text or JSON asset and return its full content as a string.

    Accepts both .txt and .json files — the raw text is returned as-is
    regardless of extension.  Raises FileNotFoundError if the asset is
    missing or is not a text-like type.

    Example:
        content = read_txt("story.txt")
        raw_json = read_txt("config.json")  # returns the JSON as a plain string
    """
    info = _asset_info(name)
    if not info or info.get('type') not in ('text', 'json'):
        raise FileNotFoundError(f'Asset not found or not text-like: {name}')
    return str(info.get('text', info.get('url', '')))

def read_txt_lines(name):
    return tuple(read_txt(name).splitlines())

def read_json(name):
    """Parse a JSON or text asset and return a Python dict, list, or scalar.

    Accepts both .json and .txt files — the file content just needs to
    contain valid JSON.  Raises FileNotFoundError if the asset is missing,
    and json.JSONDecodeError if the content cannot be parsed.

    Example:
        data   = read_json("levels.json")
        config = read_json("config.txt")   # .txt file holding JSON content
    """
    return json.loads(read_txt(name))

def to_json(data, *, indent=None):
    """Convert a dict, list, or scalar to a JSON-formatted string.

    indent  – optional int; when given, the output is pretty-printed
              with that many spaces of indentation per nesting level.

    Returns a str containing the JSON representation of *data*.

    Example:
        s = to_json({"x": 10, "y": 20})
        write("pos.json", s)

        pretty = to_json([1, 2, 3], indent=2)
        # "[\\n  1,\\n  2,\\n  3\\n]"
    """
    return json.dumps(data, indent=indent)

def write(name, content):
    """Write (or append) content to a .txt or .json file.

    If the file already exists its current text is preserved and the new
    content is concatenated to the end.  The file is persisted in the browser
    so it survives program restarts and page reloads.

    name must end in .txt or .json.

    Example:
        write("log.txt", "round 1 complete\\n")
        write("log.txt", "round 2 complete\\n")
        print(read_txt("log.txt"))   # "round 1 complete\\nround 2 complete\\n"
    """
    _nm = str(name)
    if not (_nm.endswith('.txt') or _nm.endswith('.json')):
        raise ValueError(f"write(): filename must end in .txt or .json, got {_nm!r}")
    _py.file_write(_nm, str(content))

def erase(name):
    """Erase all contents of a .txt or .json file, leaving it empty.

    The file still exists after erase() and can be written to again with write().
    Use burn() to remove the file entirely.

    name must end in .txt or .json.

    Example:
        erase("log.txt")
        print(read_txt("log.txt"))   # ""
    """
    _nm = str(name)
    if not (_nm.endswith('.txt') or _nm.endswith('.json')):
        raise ValueError(f"erase(): filename must end in .txt or .json, got {_nm!r}")
    _py.file_erase(_nm)

def burn(name):
    """Permanently delete a .txt or .json file.

    In the IDE the asset is removed from the Assets panel and localStorage.
    In an exported HTML the file is removed from the browser cache.

    name must end in .txt or .json.

    Example:
        burn("log.txt")
        # log.txt no longer exists; read_txt("log.txt") would raise FileNotFoundError
    """
    _nm = str(name)
    if not (_nm.endswith('.txt') or _nm.endswith('.json')):
        raise ValueError(f"burn(): filename must end in .txt or .json, got {_nm!r}")
    _py.file_burn(_nm)

def draw_image_quad(img, p1, p2, p3, p4, tint=None):

class SoundNode:

    speed also controls pitch (2.0 = double speed + one octave up)."""
    h = _py.snd_play(sound._h, float(volume), float(speed), bool(loop))
    return SoundNode(h) if h is not None else None

    """Stop a playing SoundNode."""
    if node is not None: node.stop()

def set_sound_volume(node, volume):

    if node is not None: node.set_volume(volume)

def set_sound_speed(node, speed):

    if node is not None: node.set_speed(speed)

def screen_pos(x=None, y=None):
    """Get or set the screen position. screen_pos() -> (x, y)."""
    if x is None and y is None:
        v = _py.screen_pos()
        r = v.toJs() if hasattr(v, 'toJs') else list(v)
        return (float(r[0]), float(r[1]))
    if y is None and hasattr(x, 'x'):
        x, y = x.x, x.y
    elif y is None and isinstance(x, (tuple, list)):
        x, y = x[0], x[1]
    return tuple(float(v) for v in _py.screen_pos(float(x), float(y)).toJs())

def screen_rot(angle=None, origin=(0,0)):
    """Get or set the screen rotation in degrees."""
    if angle is None:

        r = v.toJs() if hasattr(v, 'toJs') else list(v)
        return (float(r[0]), float(r[1]), float(r[2]))
    ox, oy = _get_origin(origin)
    v = _py.screen_rot(_deg(angle), float(ox), float(oy))
    r = v.toJs() if hasattr(v, 'toJs') else list(v)
    return (float(r[0]), float(r[1]), float(r[2]))

def reset(keep=()):
    """Restart the current game while preserving named globals."""
    keep = tuple(keep or ())

    saved = {name: g[name] for name in keep if name in g}
    js._bp_reset()

def include(name):
    """Execute a .bpy or .py file from the asset registry in the current global namespace.

    - Any assets embedded inside that file (images, sounds, other libs ...) are
      registered automatically, so nested include() calls inside the file work too.
    - Top-level setup(), update() and fragment() definitions inside the included file are
      silently ignored — only the host file's lifecycle hooks are used.
    - All other variables, classes, and functions become available globally.

    Usage:
        include("mylib.bpy")
        include("utils.py")

    The file must be in the Assets tab first (drag & drop or the Import button).
    """
    import ast as _ast
    info = _asset_info(str(name))
    if info is None:
        raise FileNotFoundError(
            f'Asset not found: {name!r} — make sure the file is in the Assets tab.')
    t = info.get('type', '')
    if t not in ('lib', 'text'):
        raise TypeError(
            f'Asset {name!r} is not a .bpy/.py file (type={t!r})')
    code = str(info.get('text', info.get('url', '')))

    # ── 1. Register anything embedded in the file's header ───────
    # A file exported from BowPy may start with:
    #   # BOWPY_ASSETS: {"name.png": {...}, ...}
    #   # BOWPY_TABS: [{"name": "utils.bpy", "code": "..."}, ...]
    # Loading those makes nested include() and Image()/Sound() calls work, and
    # gives the file's own code tabs back as modules (utils.something).
    _hdr_assets = '# BOWPY_ASSETS: '
    _hdr_tabs   = '# BOWPY_TABS: '
    while code.startswith(_hdr_assets) or code.startswith(_hdr_tabs):
        nl = code.find('\\n')
        if nl == -1:
            nl = len(code)
        if code.startswith(_hdr_assets):
            _py.asset_register_bulk(code[len(_hdr_assets):nl])
        else:
            _bp_install_tabs(code[len(_hdr_tabs):nl], True)
        code = code[nl + 1:]

    # ── 2. Strip top-level setup() / update() definitions ────────
    # We parse with ast so that only genuine top-level function defs
    # named 'setup' or 'update' are removed; anything else is kept.
    _BP_SRC_FILES[str(name)] = code
    try:
        tree = _ast.parse(code, filename=str(name))
        tree.body = [
            node for node in tree.body
            if not (isinstance(node, _ast.FunctionDef)
                    and node.name in ('setup', 'update', 'fragment'))
        ]
        _ast.fix_missing_locations(tree)
        code_obj = compile(tree, str(name), 'exec')
    except SyntaxError:
        # Fall back to raw compile — syntax errors will surface on exec
        code_obj = compile(code, str(name), 'exec')

    exec(code_obj, globals())

def write_clipboard(val):
    """Set the player's clipboard to *val* (anything that is not text is converted with str()).

    A browser only lets a page copy while the player is interacting with it. If a call from update() is refused,
    the text is copied on the player's next click, tap or key press.

    Example:
        if key_pressed("c"):
            write_clipboard("Score: " + str(score))
    """
    _py.clip_write(str(val))

def read_clipboard():
    """Return the text on the player's clipboard as a string ('' when it is empty or the browser has not allowed reading it yet).

    The browser may ask the player for permission the first time. This function never waits: it returns the latest text it
    knows (what was pasted into the game, what write_clipboard() set, or what the clipboard held when the game last looked),
    and refreshes it in the background.

    Example:
        if key_down("control") and key_pressed("v"):
            text = read_clipboard()
    """
    return str(_py.clip_read())

_BP_TIMERS = []   # all live Timer instances — ticked automatically each frame

class Timer:
    """A frame-accurate timer that counts in milliseconds.

    Timers register themselves automatically and are ticked every frame
    alongside update(), so no manual update calls are needed in your code.

    Quick-start:
        t = Timer()           # create, stopped at 0 ms
        t.start()             # count up from 0
        t.start(5000)         # count up from 5 000 ms
        t.countdown(10000)    # count down from 10 s; stops at 0
        t.stop()              # freeze at current value
        t.reset()             # stop and return to 0
        print(t)              # '0:00:10.0000'
        print(t.seconds)      # 10.0

    Format  H:MM:SS.ssss
        The sub-second field is 4 decimal digits where each unit = 0.1 ms,
        so .5000 means 500 ms (= 5000 / 10).

    Parsing:
        t = Timer.from_string('0:00:75.5000')   # 75 500 ms
        t = Timer.from_string('1:02:10.0500')   # 3 730 050 ms

    Arithmetic (returns a new stopped Timer):
        t + 1000              # add 1 000 ms  (int/float/str/Timer)
        t - Timer(500)        # subtract
        t * Timer(2)          # multiply ms values  (Timer × Timer only)
        t / Timer(2)          # divide   ms values  (Timer ÷ Timer only)

    Comparisons (Timer, int/float ms, or formatted string):
        t == 5000
        t > Timer(3000)
        t <= '0:00:05.0000'
    """

    # ── construction ─────────────────────────────────────────────

    def __init__(s, ms: float = 0.0):
        s._ms        = float(ms)
        s._running   = False
        s._countdown = False
        _BP_TIMERS.append(s)

    # ── internal tick ─────────────────────────────────────────────
    # Called every frame by _frame() with delta-time in milliseconds.
    # The increment is  fps * 0.001  ≡  (1/dt_s) * 0.001  ≡  dt_s * 1000  ms.

    def _tick(s, dt_ms: float):
        if not s._running:
            return
        if s._countdown:
            s._ms = max(0.0, s._ms - dt_ms)
            if s._ms <= 0.0:
                s._running = False
        else:
            s._ms += dt_ms

    # ── control ───────────────────────────────────────────────────

    def start(s, ms: float = None):
        """Start (or restart) counting up. Optionally set a starting value in ms."""
        if ms is not None:
            s._ms = float(ms)
        s._countdown = False
        s._running   = True
        return s

    def countdown(s, ms: float = None):
        """Start counting down to 0. Optionally set the starting value in ms."""
        if ms is not None:
            s._ms = float(ms)
        s._countdown = True
        s._running   = True
        return s

    def stop(s):
        """Freeze the timer at its current value."""
        s._running = False
        return s

    def reset(s, ms: float = 0.0):
        """Stop and set the value to *ms* (default 0)."""
        s._running = False
        s._ms      = float(ms)
        return s

    # ── properties ────────────────────────────────────────────────

    @property
    def milliseconds(s) -> float:
        """Stored value in milliseconds (float)."""
        return s._ms

    @property
    def seconds(s) -> float:
        """Stored value in seconds (float)."""
        return s._ms / 1_000.0

    @property
    def minutes(s) -> float:
        """Stored value in minutes (float)."""
        return s._ms / 60_000.0

    @property
    def hours(s) -> float:
        """Stored value in hours (float)."""
        return s._ms / 3_600_000.0

    @property
    def running(s) -> bool:
        """True while the timer is actively counting."""
        return s._running

    @property
    def finished(s) -> bool:
        """True when a countdown has reached 0 and stopped."""
        return s._countdown and not s._running and s._ms <= 0.0

    # ── formatting ────────────────────────────────────────────────

    def __str__(s) -> str:
        """Format as  H:MM:SS.ssss  (4-digit sub-second, each unit = 0.1 ms).

        Examples:
            Timer(75500)     →  '0:01:15.5000'
            Timer(3730050)   →  '1:02:10.0500'
        """
        sign     = '-' if s._ms < 0 else ''
        total_ms = abs(s._ms)
        # Split into whole-second part and fractional ms
        whole_s  = int(total_ms // 1000)
        frac_ms  = total_ms - whole_s * 1000.0         # 0 – 999.999...
        h, rem   = divmod(whole_s, 3600)
        m,  sec  = divmod(rem, 60)
        # The ssss field: each unit = 0.1 ms → multiply frac_ms by 10, round
        ssss     = int(round(frac_ms * 10.0))
        # Guard against rounding to 10000 (e.g. 999.95 ms → carry)
        if ssss >= 10000:
            ssss  = 0
            sec  += 1
            if sec >= 60:
                sec = 0; m += 1
            if m >= 60:
                m = 0; h += 1
        return f'{sign}{h}:{m:02d}:{sec:02d}.{ssss:04d}'

    def __repr__(s) -> str:
        state = 'counting-down' if (s._running and s._countdown) else \
                'running' if s._running else 'stopped'
        return f'Timer({s._ms}ms, {state})'

    # ── parsing ───────────────────────────────────────────────────

    @staticmethod
    def _parse_ms(other) -> float:
        """Coerce Timer / int / float / str to a float millisecond value."""
        if isinstance(other, Timer):
            return other._ms
        if isinstance(other, str):
            return Timer.from_string(other)._ms
        return float(other)

    @staticmethod
    def from_string(s_str: str) -> 'Timer':
        """Parse a time string into a new stopped Timer.

        Format:  H:MM:SS.ssss   (minutes and seconds may exceed 59)
        The ssss field is 1-4 digits where each unit = 0.1 ms:
            '0:00:75.5000'  →  75 * 1000 + 5000/10  =  75 500 ms
            '1:02:10.0500'  →  3 600 000+120 000+10 000+50/10 = 3 730 005 ms

        The ssss digits are always left-justified (0-padded on right):
            '.5'  means .5000  →  5000 / 10  =  500 ms
            '.05' means .0500  →   500 / 10  =   50 ms
        """
        import re as _re
        s = str(s_str).strip()
        neg = s.startswith('-')
        if neg:
            s = s[1:]
        m = _re.fullmatch(
            r'(\d+):(\d+):(\d+)(?:\.(\d{1,4}))?', s
        )
        if m is None:
            raise ValueError(
                f"Cannot parse Timer string {s_str!r}. "
                f"Expected  H:MM:SS  or  H:MM:SS.ssss")
        h_s, mn_s, sec_s, frac_s = m.groups()
        # Right-pad the fractional field to 4 digits (left-justified)
        frac4 = (frac_s or '0000').ljust(4, '0')
        total_ms = (
            int(h_s)   * 3_600_000
          + int(mn_s)  *    60_000
          + int(sec_s) *     1_000
          + int(frac4) / 10.0         # 4 digits, each = 0.1 ms
        )
        if neg:
            total_ms = -total_ms
        return Timer(total_ms)

    # ── arithmetic ────────────────────────────────────────────────
    # +/-: Timer ± (Timer | int | float | str)
    # */÷: Timer × Timer only  (dimensionally consistent)

    def __add__(s, other):
        return Timer(s._ms + Timer._parse_ms(other))
    def __radd__(s, other):
        return Timer(Timer._parse_ms(other) + s._ms)
    def __sub__(s, other):
        return Timer(s._ms - Timer._parse_ms(other))
    def __rsub__(s, other):
        return Timer(Timer._parse_ms(other) - s._ms)
    def __mul__(s, other):
        if not isinstance(other, Timer):
            raise TypeError(
                f"Timer * requires another Timer; got {type(other).__name__}. "
                f"To scale by a number, use timer + (timer.milliseconds * factor).")
        return Timer(s._ms * other._ms)
    def __rmul__(s, other):
        return s.__mul__(other)
    def __truediv__(s, other):
        if not isinstance(other, Timer):
            raise TypeError(
                f"Timer / requires another Timer; got {type(other).__name__}.")
        if other._ms == 0.0:
            raise ZeroDivisionError("Timer division by zero (0 ms).")
        return Timer(s._ms / other._ms)

    # ── comparisons ───────────────────────────────────────────────

    def __eq__(s, other):
        try:    return s._ms == Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __lt__(s, other):
        try:    return s._ms <  Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __le__(s, other):
        try:    return s._ms <= Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __gt__(s, other):
        try:    return s._ms >  Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __ge__(s, other):
        try:    return s._ms >= Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __hash__(s):
        return hash(s._ms)


# ── Key Recorder ──────────────────────────────────────────────

_BP_KEY_RECORDERS = []   # all live KeyRecorder instances — ticked automatically each frame

class KeyRecorder:
    """Records typed characters into an internal string cache every frame.

    Recorders register themselves automatically and are ticked every frame
    alongside update(), so no manual update calls are needed in your code.

    Quick-start:
        rec = KeyRecorder()          # create (not yet recording)
        rec.record()                 # start capturing typed keys
        rec.stop()                   # stop capturing
        print(rec.text)              # the captured text
        rec.clear()                  # wipe the cache

    Parameters:
        focus          (bool, default False)
            When True, key_down(), key_pressed() and key_released() always
            return False while this recorder is active, so held keys do not
            trigger other game actions at the same time.

        event          (str, default "pressed")
            Controls when a key is detected:
            "pressed"  – recorded on the first frame the key is pressed.
            "released" – recorded on the frame the key is released.
            "frame"    – recorded every frame the key is held (repeating);
                         if "a" is held for 3 frames it is appended 3 times.

        case_sensitive (bool, default True)
            If True, letters respect the current shift / CapsLock state.
            If False, every letter is stored in uppercase regardless.

        allow          (str or None, default None)
            When set, only characters that appear in this string are recorded.
            None means all printable characters are accepted.
            Example: allow="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ "

        max_length     (int, default -1)
            Once the cache reaches this length no further characters are
            appended.  Any negative value means unlimited.

        multiline      (bool, default False)
            When True, pressing Enter appends a newline ("\\n") to the cache.
    """

    def __init__(s, focus=False, event="pressed", case_sensitive=True,
                 allow=None, max_length=-1, multiline=False):
        s._cache      = ""
        s._recording  = False
        s.focus         = bool(focus)
        s.event         = str(event)
        s.case_sensitive = bool(case_sensitive)
        s.allow         = str(allow) if allow is not None else None
        s.max_length    = int(max_length)
        s.multiline     = bool(multiline)
        _BP_KEY_RECORDERS.append(s)

    # ── internal tick ─────────────────────────────────────────────
    # Called every frame by _frame().

    def _tick(s):
        if not s._recording:
            return

        if s.event == "frame":
            raw = _py.keys_held()
        elif s.event == "pressed":
            raw = _py.keys_pressed()
        elif s.event == "released":
            raw = _py.keys_released()
        else:
            return

        keys = list(raw.to_py() if hasattr(raw, "to_py") else raw)

        # Determine case: shift XOR capslock → uppercase letters
        held_raw = _py.keys_held()
        held     = set(held_raw.to_py() if hasattr(held_raw, "to_py") else held_raw)
        shift    = "shift" in held
        caps     = bool(_py.capslock())
        upper    = shift != caps   # XOR: exactly one active → uppercase

        for k in sorted(keys):
            # ── Newline (multiline mode) ───────────────────────────
            if k == "enter":
                if s.multiline:
                    s._append("\\n")
                continue

            # ── Only single printable characters ──────────────────
            if len(k) != 1 or not k.isprintable():
                continue

            # ── Resolve case ──────────────────────────────────────
            if k.isalpha():
                ch = k.upper() if upper else k
            else:
                ch = k

            if not s.case_sensitive:
                ch = ch.upper()

            # ── Apply allow-list filter ────────────────────────────
            if s.allow is not None and ch not in s.allow:
                continue

            s._append(ch)

    def _append(s, ch):
        """Append ch to the cache if max_length allows it."""
        if s.max_length < 0 or len(s._cache) < s.max_length:
            s._cache += ch

    # ── control ───────────────────────────────────────────────────

    def record(s):
        """Start recording key input into the cache."""
        s._recording = True
        return s

    def stop(s):
        """Stop recording; the cache is preserved until clear() is called."""
        s._recording = False
        return s

    def clear(s):
        """Erase all text from the internal cache string."""
        s._cache = ""
        return s

    # ── properties ────────────────────────────────────────────────

    @property
    def text(s) -> str:
        """The current cached text string."""
        return s._cache

    @property
    def recording(s) -> bool:
        """True while the recorder is actively capturing input."""
        return s._recording

    # ── Python protocol ───────────────────────────────────────────

    def __str__(s)  -> str: return s._cache
    def __repr__(s) -> str:
        return f'KeyRecorder(recording={s._recording}, text={s._cache!r})'
    def __len__(s)  -> int: return len(s._cache)


def _any_focused_recorder():
    """True if any focused KeyRecorder is currently recording."""
    return any(r.focus and r._recording for r in _BP_KEY_RECORDERS)


# ── Surface ────────────────────────────────────────────────────

_BP_SURFACES = []   # all live Surface instances — cleared at each run start/stop

class Surface:
    """An off-screen canvas you can draw onto and later composite.

    Usage:
        s = Surface(320, 240)          # blank black surface
        set_target(s)                  # redirect draw calls to s
        draw_circle(160, 120, 50, RED)
        reset_target()                 # back to the screen
        draw_surface(s, 0, 0)          # blit s at screen origin

    Constructor:
        Surface(width=<screen_w>, height=<screen_h>, fill=(0,0,0,255))

    Methods:
        s.clear(color)  – fill every pixel with color
        s.to_image()    – snapshot as an Image
        Surface.screen()– copy of the current screen as a Surface

    Properties:
        s.width, s.height, s.size()
    """
    def __init__(s, width=None, height=None, fill=(0, 0, 0, 255)):
        w = int(width)  if width  is not None else int(_py.sw())
        h = int(height) if height is not None else int(_py.sh())
        s._h = _py.surface_create(w, h)
        # Apply initial fill only if it differs from the default black
        fc = _css_clear(fill)
        _py.surface_fill(s._h, fc)
        _BP_SURFACES.append(s)

    def clear(s, color=(0, 0, 0, 255)):
        """Fill all pixels of this surface with *color*."""
        _py.surface_fill(s._h, _css_clear(color))

    @staticmethod
    def screen():
        """Return a new Surface that is a pixel-perfect copy of the current screen."""
        obj = Surface.__new__(Surface)
        obj._h = _py.surface_screen()
        _BP_SURFACES.append(obj)
        return obj

    def to_image(s):
        """Return a snapshot of this surface as an Image object."""
        img_h = _py.surface_to_image(s._h)
        obj = Image.__new__(Image)
        obj._h = img_h
        _asset_registry.append(obj)
        return obj

    @property
    def width(s):  return int(_py.surface_w(s._h))
    @property
    def height(s): return int(_py.surface_h(s._h))
    def size(s):   return (int(_py.surface_w(s._h)), int(_py.surface_h(s._h)))
    def __repr__(s): return f'Surface({s.width}x{s.height})'


def set_target(surface):
    """Redirect all draw functions to *surface* instead of the screen."""
    _py.surface_set_target(surface._h)

def reset_target():
    """Reset the draw target back to the main screen canvas."""
    _py.surface_reset_target()

def draw_surface(surface, x, y):
    """Draw *surface* at (x, y) on the current draw target."""
    _py.surface_draw(surface._h, float(x), float(y))

# ── Code tabs: every extra tab (e.g. utils.bpy) becomes a module (utils) ─────────
import types as _types, keyword as _keyword

_BP_API      = {}   # the untouched BowPy API; copied into every tab module (filled in below)
_BP_TAB_MODS = {}   # tab name without .bpy -> module object
_BP_TAB_SRC  = {}   # tab name without .bpy -> [file name, source code, state]

class _BPTab(_types.ModuleType):
    """Module object that backs one code tab."""
    def __getattr__(self, attr):
        # Only reached when the normal lookup fails.  If this tab has not been run yet
        # (another tab used it first) run it now, so the order of the tabs never matters.
        if not attr.startswith('__'):
            src = _BP_TAB_SRC.get(self.__name__)
            if src is not None and src[2] == 'pending':
                _bp_exec_tab(self.__name__)
                if attr in self.__dict__:
                    return self.__dict__[attr]
        raise AttributeError("module '%s' has no attribute '%s'" % (self.__name__, attr))

def _bp_exec_tab(name):
    src = _BP_TAB_SRC.get(name)
    if src is None or src[2] != 'pending':
        return
    src[2] = 'running'
    try:
        exec(compile(src[1], src[0], 'exec'), _BP_TAB_MODS[name].__dict__)
    except BaseException:
        src[2] = 'failed'
        raise
    src[2] = 'done'

def _bp_clear_tabs():
    g = globals()
    for n, m in list(_BP_TAB_MODS.items()):
        if sys.modules.get(n) is m:
            del sys.modules[n]
        if g.get(n) is m:
            del g[n]
    _BP_TAB_MODS.clear()
    _BP_TAB_SRC.clear()

def _bp_tab_blocked():
    """Names a tab may not use, because they would shadow Python itself or the BowPy API."""
    import builtins as _bi
    names = {k for k in _BP_RESERVED if not k.startswith('__')}
    names.update(dir(_bi))
    names.update(_keyword.kwlist)
    names.update(getattr(sys, 'stdlib_module_names', ()))
    names.update(k for k in sys.modules if '.' not in k and k not in _BP_TAB_MODS)
    names.add('main')
    return names

def _bp_reserved_names():
    return sorted(_bp_tab_blocked())

def _bp_install_tabs(tabs_json, merge=False):
    """Create one module per extra code tab and run it.

    tabs_json is a JSON list of {"name": "utils.bpy", "code": "..."}.
    merge=False replaces every installed tab (a normal run);
    merge=True adds to the installed tabs (used by include()).
    """
    import json as _json
    tabs = _json.loads(tabs_json)
    if not merge:
        _bp_clear_tabs()
    blocked = _bp_tab_blocked()
    g = globals()
    fresh = []
    for t in tabs:
        fname = str(t.get('name', ''))
        base = fname[:-4] if fname.lower().endswith('.bpy') else fname
        why = None
        if not base.isidentifier() or _keyword.iskeyword(base):
            why = 'is not a valid name (use letters, digits and _)'
        elif base in _BP_TAB_MODS:
            why = 'is used by more than one tab'
        elif base in blocked:
            why = 'is already used by Python or BowPy'
        if why:
            msg = 'Tab "%s": the name "%s" %s - rename the tab.' % (fname, base, why)
            if merge:
                print('include(): skipped. ' + msg)
                continue
            raise ValueError(msg)
        mod = _BPTab(base)
        mod.__file__ = fname
        mod.__dict__.update(_BP_API)
        _BP_TAB_MODS[base] = mod
        _BP_TAB_SRC[base] = [fname, str(t.get('code', '')), 'pending']
        fresh.append(base)
    for base in fresh:                      # reachable from main.bpy and by  import <name>
        sys.modules[base] = g[base] = _BP_TAB_MODS[base]
    for m in _BP_TAB_MODS.values():         # every tab can reach every other tab by name
        for other, om in _BP_TAB_MODS.items():
            if om is not m:
                m.__dict__[other] = om
    for base in fresh:                      # run them (a tab used earlier by another tab has already run)
        _bp_exec_tab(base)

# ── GPU shaders ───────────────────────────────────────────────────────────────────────────────────────
# fragment(pos) is translated from Python to GLSL ES 3.00 and runs for every pixel on the GPU.
# The translator understands a practical subset of Python (see the wiki page of fragment()). It infers the
# type of every value (bool / int / float / Vec2 / Vec3 / Vec4 / arrays of them), turns your global
# variables into uniforms that are re-read every frame, and compiles the helper functions you call.
import ast as _sh_ast, math as _sh_math, builtins as _sh_builtins, types as _sh_types, re as _sh_re

_SH_MAX_SLOTS = 192        # vec4 uniform slots available to the program's variables
_SH_LOOP_CAP = 1024        # iterations after which a shader 'while' loop is cut off (it must never hang the GPU)
_SH_DIMS = {'vec2': 2, 'vec3': 3, 'vec4': 4}
_SH_RANK = {'bool': 0, 'int': 1, 'float': 2}
_SH_VEC_OF = {2: 'vec2', 3: 'vec3', 4: 'vec4'}
_SH_COLOUR = ('bool', 'int', 'float', 'vec3', 'vec4')


class _ShaderError(Exception):
    """The shader uses something that cannot run on the GPU (the message says what and where)."""


class _ShUnknown(Exception):
    """Internal: a value whose type is not known yet in this pass."""


def _sh_is_vec(t):
    return isinstance(t, str) and t in _SH_DIMS


def _sh_is_arr(t):
    return isinstance(t, tuple)


def _sh_is_scalar(t):
    return t in _SH_RANK


def _sh_unify(a, b):
    if a == b:
        return a
    if a in _SH_RANK and b in _SH_RANK:
        return a if _SH_RANK[a] >= _SH_RANK[b] else b
    return None


def _sh_tname(t):
    if _sh_is_arr(t):
        return 'list of %s' % _sh_tname(t[1])
    return {'bool': 'bool', 'int': 'int', 'float': 'float', 'vec2': 'Vec2', 'vec3': 'Vec3', 'vec4': 'Vec4',
            'void': 'nothing'}.get(t, str(t))


def _sh_ident(name):
    s = _sh_re.sub(r'[^A-Za-z0-9_]', lambda m: '_x%X_' % ord(m.group(0)), name)
    while '__' in s:
        s = s.replace('__', '_u_')
    return s


def _sh_float(v):
    v = float(v)
    if v != v or v in (float('inf'), float('-inf')):
        raise _ShaderError('a number that is infinite or not-a-number cannot be used in a shader')
    r = repr(v)
    if 'e' not in r and '.' not in r:
        r += '.0'
    return r


def _sh_zero(t):
    if t == 'float':
        return '0.0'
    if t == 'int':
        return '0'
    if t == 'bool':
        return 'false'
    if _sh_is_vec(t):
        return '%s(0.0)' % t
    return '0'
