<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BowPy</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:    #0b0d11;
  --bg2:   #12151c;
  --bg3:   #1a1e29;
  --bg4:   #222636;
  --bdr:   #252a38;
  --bdr2:  #1e2230;
  --txt:   #c8d0e8;
  --txt2:  #6a738f;
  --txt3:  #3c4255;
  --blue:  #5b9cf6;
  --cyan:  #4ec9b0;
  --green: #3ec97e;
  --red:   #f47067;
  --oran:  #e5b567;
  --purp:  #b48ef4;
  --pink:  #f06baf;
  --font-code: 'IBM Plex Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  --font-ui:   'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;

  /* syntax colors */
  --sy-kw:   #c586c0;
  --sy-kw2:  #569cd6;
  --sy-fn:   #dcdcaa;
  --sy-cls:  #4ec9b0;
  --sy-num:  #b5cea8;
  --sy-str:  #ce9178;
  --sy-cmt:  #6a737d;
  --sy-dec:  #5b9cf6;
  --sy-self: #9cdcfe;
  --sy-op:   #d4d4d4;
  --sy-bi:   #4ec9b0;
  --sy-pun:  #808080;
}
.sy-kw   { color: var(--sy-kw); }
.sy-kw2  { color: var(--sy-kw2); }
.sy-fn   { color: var(--sy-fn); }
.sy-cls  { color: var(--sy-cls); }
.sy-num  { color: var(--sy-num); }
.sy-str  { color: var(--sy-str); }
.sy-cmt  { color: var(--sy-cmt); }
.sy-dec  { color: var(--sy-dec); }
.sy-self { color: var(--sy-self); }
.sy-op   { color: var(--sy-op); }
.sy-bi   { color: var(--sy-bi); }
.sy-pun  { color: var(--sy-pun); }
[class^="sy-"]{line-height:inherit;vertical-align:baseline;}
.sy-cmt{font-style:italic;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font-ui);}

/* ── HEADER ── */
#hdr{
  display:flex;align-items:center;gap:10px;
  height:42px;padding:0 14px;flex-shrink:0;
  background:var(--bg2);border-bottom:1px solid var(--bdr);
  z-index:20;position:relative;
}
.logo{
  font-family:var(--font-code);font-weight:600;font-size:13px;
  color:var(--blue);letter-spacing:-.2px;user-select:none;
  display:flex;align-items:center;gap:6px;
}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
.sep{width:1px;height:18px;background:var(--bdr);margin:0 2px;}
.tabs{display:flex;gap:2px;}
.tab-btn{
  padding:4px 13px;border-radius:5px;border:1px solid transparent;
  color:var(--txt2);cursor:pointer;font:13px var(--font-ui);
  transition:all .12s;background:transparent;
}
.tab-btn:hover{color:var(--txt);background:var(--bg3);}
.tab-btn.active{color:var(--txt);background:var(--bg);border-color:var(--bdr);}
.ctrl{display:flex;gap:6px;align-items:center;}
.btn{
  display:flex;align-items:center;gap:5px;
  padding:4px 13px;border-radius:5px;border:1px solid;
  cursor:pointer;font:600 12px var(--font-ui);
  transition:all .12s;white-space:nowrap;line-height:1;
}
.btn-run{background:#0d2318;border-color:#1d5c30;color:var(--green);}
.btn-run:hover:not(:disabled){background:#12342a;border-color:var(--green);box-shadow:0 0 10px #3ec97e30;}
.btn-stop{background:#220f0e;border-color:#5c1e1c;color:var(--red);}
.btn-stop:hover:not(:disabled){background:#3d1a18;border-color:var(--red);}
.btn:disabled{background:var(--bg3);border-color:var(--bdr);color:var(--txt3);cursor:not-allowed;}
.btn-io{background:var(--bg3);border-color:var(--bdr);color:var(--txt2);}
.btn-io:hover{background:var(--bg4);border-color:var(--txt3);color:var(--txt);}
#new-btn{position:relative;}
#new-btn.confirm-1{border-color:var(--oran);color:var(--oran);}
#new-btn.confirm-2{border-color:var(--red);color:var(--red);}
#fname{
  background:var(--bg);border:1px solid var(--bdr);border-radius:5px;
  color:var(--txt2);font:12px var(--font-code);
  padding:3px 10px;width:130px;outline:none;
  transition:border-color .12s,color .12s;
}
#fname:focus{border-color:var(--blue);color:var(--txt);}
#fname::placeholder{color:var(--txt3);}
#status-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;}
#status{font:11px var(--font-code);display:flex;align-items:center;gap:6px;}
#sdot{width:6px;height:6px;border-radius:50%;background:currentColor;transition:all .3s;}
.s-load{color:var(--oran);}
.s-load #sdot{animation:pulse 1.2s infinite;}
.s-ready{color:var(--txt3);}
.s-run{color:var(--green);}
.s-run #sdot{box-shadow:0 0 8px var(--green);}
.s-err{color:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hint{font:11px var(--font-code);color:var(--txt3);}
kbd{
  display:inline-flex;align-items:center;padding:1px 5px;
  border-radius:3px;border:1px solid var(--bdr);background:var(--bg3);
  font:10px var(--font-code);color:var(--txt2);
}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;}
.tab-view{display:none;flex:1;overflow:hidden;min-height:0;}
.tab-view.active{display:flex;}

/* ── CODE TAB ── */
#code-tab{flex-direction:column;}

/* ── EDITOR ── */
#editor-wrap{
  flex:1;display:flex;overflow:hidden;min-height:0;
  position:relative;background:var(--bg);
}

/* line numbers */
#lnums{
  width:52px;flex-shrink:0;overflow:hidden;
  background:var(--bg2);border-right:1px solid var(--bdr2);
  font:13px var(--font-code);line-height:21px;color:var(--txt3);
  padding:14px 10px 14px 0;text-align:right;
  user-select:none;white-space:pre;
  pointer-events:none;
}

/* the container that holds highlight layer + textarea, stacked */
#ed-inner{
  flex:1;position:relative;overflow:hidden;
}

/* highlight mirror — exact same font/padding as textarea */
#hl{
  position:absolute;top:0;left:0;
  font:13px var(--font-code);line-height:21px;
  padding:14px 16px;
  tab-size:4;
  white-space:pre;
  overflow:visible;         /* parent #ed-inner clips; no scroll state */
  pointer-events:none;
  z-index:1;
  color:var(--txt);         /* fallback for un-tokenized text */
}

/* textarea sits on top, transparent text so highlight shows through */
#editor{
  position:absolute;inset:0;
  resize:none;border:none;outline:none;
  background:transparent;
  color:transparent;
  caret-color:var(--txt);
  font:13px var(--font-code);line-height:21px;
  padding:14px 16px;
  tab-size:4;
  white-space:pre;
  overflow:auto;
  z-index:2;
  scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;
}
#editor::selection{background:#5b9cf640;}

/* ── CONSOLE ── */
#con-resize{
  height:5px;flex-shrink:0;cursor:ns-resize;
  border-top:1px solid var(--bdr2);background:transparent;
  transition:background .15s;
}
#con-resize:hover,#con-resize.drag{background:var(--blue);}
#console{
  height:190px;min-height:72px;flex-shrink:0;
  display:flex;flex-direction:column;
}
#con-bar{
  display:flex;align-items:center;padding:3px 12px;
  background:var(--bg2);border-bottom:1px solid var(--bdr2);
  flex-shrink:0;gap:8px;
}
#con-title{font:600 10px var(--font-ui);color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;}
#con-clr{
  margin-left:auto;background:none;border:none;
  color:var(--txt3);cursor:pointer;font:11px var(--font-ui);
  padding:2px 7px;border-radius:4px;transition:all .12s;
}
#con-clr:hover{color:var(--txt);background:var(--bg4);}
#con-out{
  flex:1;overflow-y:auto;padding:8px 14px;
  font:12px/1.55 var(--font-code);background:#070910;
  scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;
}
.cl{white-space:pre-wrap;word-break:break-all;padding:0 0 1px;}
.cout{color:#9aafc4;}.cerr{color:var(--red);}.cwarn{color:var(--oran);}
.cok{color:var(--cyan);}.csys{color:var(--txt3);font-style:italic;}
#con-in-row{
  display:flex;align-items:center;padding:5px 14px;
  background:#070910;border-top:1px solid var(--bdr2);
  flex-shrink:0;gap:8px;
}
#con-prompt{color:var(--green);font:12px var(--font-code);user-select:none;}
#con-in{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--txt);font:12px var(--font-code);
}
#con-in::placeholder{color:var(--txt3);}

/* ── SCREEN TAB ── */
#screen-tab{background:#000;position:relative;overflow:hidden;}
#screen{display:block;position:absolute;top:0;left:0;touch-action:none;}

/* ── ASSETS TAB ── */
#assets-tab{flex-direction:column;background:var(--bg2);}
#asset-bar{
  display:flex;align-items:center;padding:5px 12px;
  background:var(--bg2);border-bottom:1px solid var(--bdr2);
  flex-shrink:0;gap:8px;
}
#asset-bar-title{font:600 10px var(--font-ui);color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;}
#asset-bar-hint{font:10px var(--font-ui);color:var(--txt3);margin-left:auto;}
#asset-grid{
  flex:1;overflow-y:auto;padding:12px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:8px;align-content:start;
  scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;
}
#asset-empty{grid-column:1/-1;padding:48px 24px;text-align:center;color:var(--txt3);font:12px var(--font-ui);line-height:1.9;}
#asset-empty code{font:11px var(--font-code);color:var(--cyan);}
.asset-card{
  background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;
  overflow:hidden;cursor:pointer;transition:border-color .12s;
  position:relative;user-select:none;
}
.asset-card:hover{border-color:var(--blue);}
.asset-preview{width:100%;height:68px;display:flex;align-items:center;justify-content:center;background:var(--bg4);overflow:hidden;}
.asset-preview img{max-width:100%;max-height:100%;object-fit:contain;}
.asset-audio-icon{font-size:22px;color:var(--purp);}
.asset-text-icon{font-size:32px;color:var(--cyan);}
.asset-json-icon{font-size:22px;color:var(--oran);}
.asset-lib-icon{font:22px var(--font-code);color:var(--pink);}
.asset-name{padding:4px 8px;font:10px var(--font-code);color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-del{
  position:absolute;top:3px;right:3px;background:rgba(244,112,103,.75);
  border:none;color:#fff;font:10px/1 var(--font-ui);
  padding:2px 5px;border-radius:3px;cursor:pointer;opacity:0;transition:opacity .12s;
}
.asset-card:hover .asset-del{opacity:1;}
#drop-overlay{
  position:fixed;inset:0;z-index:9999;
  border:3px dashed var(--blue);border-radius:10px;margin:8px;
  background:rgba(11,13,17,.88);
  display:none;align-items:center;justify-content:center;
  color:var(--blue);font:700 18px var(--font-ui);pointer-events:none;
}
body.dropping #drop-overlay{display:flex;}

/* scrollbars */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#2e3448;}

/* ── WIKI TAB ── */
#wiki-tab{flex-direction:row;background:var(--bg);}
#wiki-layout{display:flex;flex:1;overflow:hidden;min-height:0;}
#wiki-sidebar{
  width:230px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--bg2);border-right:1px solid var(--bdr);overflow:hidden;
}
#wiki-search-wrap{padding:10px;position:relative;flex-shrink:0;}
#wiki-search{
  width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;
  color:var(--txt);font:12px var(--font-code);padding:6px 10px;outline:none;
  transition:border-color .12s;
}
#wiki-search:focus{border-color:var(--blue);}
#wiki-search-results{
  position:absolute;top:calc(100% - 4px);left:10px;right:10px;
  background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;
  max-height:260px;overflow-y:auto;z-index:50;box-shadow:0 8px 24px #0006;
}
.wiki-sr-item{
  padding:7px 12px;font:12px var(--font-ui);color:var(--txt2);cursor:pointer;
  border-bottom:1px solid var(--bdr2);
}
.wiki-sr-item:last-child{border-bottom:none;}
.wiki-sr-item:hover{background:var(--bg4);color:var(--txt);}
.wiki-sr-item strong{color:var(--blue);font-weight:600;}
.wiki-sr-cat{font-size:10px;color:var(--txt3);display:block;margin-top:2px;}
#wiki-nav{flex:1;overflow-y:auto;padding:0 6px 14px;}
.wiki-nav-group{margin-bottom:4px;}
.wiki-nav-group-title{
  font:600 10px var(--font-ui);text-transform:uppercase;letter-spacing:.06em;
  color:var(--txt3);padding:8px 8px 4px;
}
.wiki-nav-item{
  display:flex;align-items:center;gap:7px;
  padding:5px 8px;border-radius:5px;cursor:pointer;outline:0px solid var(--bdr);
  font:12px var(--font-ui);color:var(--txt2);transition:all .1s;
}
.wiki-nav-item:hover{background:var(--bg3);color:var(--txt);outline:0px solid var(--bdr);}
.wiki-nav-item.active{background:var(--bg);color:var(--blue);outline:1px solid var(--bdr);}
.wiki-nav-item .wni-icon{font-size:13px;opacity:.6;}
#wiki-content{
  flex:1;overflow-y:auto;padding:32px 48px;min-width:0;
}
#wiki-breadcrumb{
  font:11px var(--font-ui);color:var(--txt3);margin-bottom:20px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.wiki-bc-seg{cursor:pointer;color:var(--txt3);transition:color .1s;}
.wiki-bc-seg:hover{color:var(--blue);}
.wiki-bc-sep{color:var(--txt3);}
#wiki-body{max-width:860px;}
.wiki-p{font:400 15px var(--font-ui);color:var(--txt);margin:18px 0 6px;line-height: 22px;}
.wiki-p code{font:400 12px monospace;vertical-align: 2px;color:var(--txt);margin:18px 0 6px;background-color: var(--bg2);border: 1px solid var(--bdr);border-radius: 6px;padding: 2px 4px 2px 4px;}
.wiki-h1{font:700 26px var(--font-ui);color:var(--txt);margin-bottom:6px;line-height:1.25;}
.wiki-h2{font:600 17px var(--font-ui);color:var(--txt);margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bdr);}
.wiki-h3{font:600 13px var(--font-ui);color:var(--cyan);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em;}
.wiki-tag{
  display:inline-block;padding:2px 8px;border-radius:3px;
  font:700 10px var(--font-ui);text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:10px;
}
.wiki-tag-function{background:#1a2a3a;color:var(--blue);border:1px solid #1e3a5a;}
.wiki-tag-class{background:#142a20;color:var(--cyan);border:1px solid #1d4530;}
.wiki-tag-guide{background:#231a30;color:var(--purp);border:1px solid #3a2a52;}
.wiki-tag-method{background:#232018;color:var(--oran);border:1px solid #52420f;}
.wiki-tag-example{background:#231818;color:var(--red);border:1px solid #4c1a1a;}
.wiki-desc{font:14px/1.7 var(--font-ui);color:var(--txt2);margin-bottom:14px;}
.wiki-sig{
  font:13px var(--font-code);background:var(--bg2);border:1px solid var(--bdr);
  border-radius:6px;padding:10px 14px;color:var(--txt);margin-bottom:12px;
  overflow-x:auto;white-space:pre;
}
.wiki-sig .ws-fn{color:var(--sy-fn);}
.wiki-sig .ws-kw{color:var(--sy-kw);}
.wiki-sig .ws-cls{color:var(--sy-cls);}
.wiki-sig .ws-param{color:var(--sy-self);}
.wiki-sig .ws-lit{color:var(--sy-num);}
.wiki-sig .ws-str{color:var(--sy-str);}
.wiki-sig .ws-pun{color:var(--sy-pun);}
.wiki-sig .ws-cmt{color:var(--sy-cmt);font-style:italic;}
.wiki-param-table{width:100%;border-collapse:collapse;margin-bottom:14px;font:12px var(--font-ui);}
.wiki-param-table th{text-align:left;padding:5px 10px;color:var(--txt3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bdr);}
.wiki-param-table td{padding:6px 10px;border-bottom:1px solid var(--bdr2);vertical-align:top;}
.wiki-param-table td:first-child{font-family:var(--font-code);color:var(--cyan);white-space:nowrap;}
.wiki-param-table td:nth-child(2){color:var(--purp);font-family:var(--font-code);white-space:nowrap;}
.wiki-param-table td:nth-child(3){color:var(--txt2);}
.wiki-example{background:var(--bg2);border:1px solid var(--bdr);border-left:3px solid var(--blue);border-radius:0 6px 6px 0;padding:12px 14px;margin-bottom:12px;}
.wiki-example-title{font:700 10px var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:8px;}
.wiki-example pre{font:12px var(--font-code);line-height:1.7;color:var(--txt);white-space:pre-wrap;}
.wiki-note{background:#1c1d24;border:1px solid var(--bdr);border-left:3px solid var(--oran);border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:12px;font:12px/1.6 var(--font-ui);color:var(--txt2);}
.wiki-note b{color:var(--oran);}
.wiki-ref-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.wiki-ref{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:4px;
  background:var(--bg3);border:1px solid var(--bdr);
  font:11px var(--font-code);color:var(--blue);cursor:pointer;
  transition:all .1s;
}
.wiki-ref:hover{background:var(--bg4);border-color:var(--blue);}
.wiki-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:16px;}
.wiki-member{
  padding:8px 12px;border-radius:6px;
  background:var(--bg2);border:1px solid var(--bdr);
  cursor:pointer;transition:all .1s;
}
.wiki-member:hover{background:var(--bg3);border-color:var(--txt3);}
.wiki-member-name{font:12px var(--font-code);color:var(--cyan);margin-bottom:2px;}
.wiki-member-desc{font:11px var(--font-ui);color:var(--txt3);line-height:1.4;}
.wiki-section-index{display:flex;flex-direction:column;gap:6px;}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="logo"><div class="logo-dot"></div>BowPy</div>
    <div class="sep"></div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-code"   onclick="switchTab('code')">Code</button>
      <button class="tab-btn"        id="tab-screen" onclick="switchTab('screen')">Screen</button>
      <button class="tab-btn"        id="tab-assets" onclick="switchTab('assets')">Assets</button>
      <button class="tab-btn"        id="tab-wiki"   onclick="switchTab('wiki')">Wiki</button>
    </div>
    <div class="sep"></div>
    <div class="ctrl">
      <button class="btn btn-run"  id="run-btn"  onclick="runCode()"  disabled>▶ Run</button>
      <button class="btn btn-stop" id="stop-btn" onclick="stopCode()" disabled>■ Stop</button>
    </div>
    <div class="sep"></div>
    <div class="ctrl">
      <button class="btn btn-io" id="new-btn" onclick="newFile()">✦ New</button>
      <button class="btn btn-io" onclick="importFile()">⬇ Import</button>
      <button class="btn btn-io" onclick="exportFile()">⬆ Export</button>
      <button class="btn btn-io" onclick="buildFile()">⚙ Build</button>
    </div>
    <input type="file" id="file-inp" accept=".bpy,.py" style="display:none"/>
    <div class="sep"></div>
    <input id="fname" type="text" placeholder="untitled" value="sketch" title="Filename (used by Export and Build)"/>
    <div id="status-wrap">
      <div id="status" class="s-load"><div id="sdot"></div><span id="stxt">Loading Python...</span></div>
      <div class="sep"></div>
      <span class="hint" id="hint" style="display:none"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run &nbsp;—&nbsp; <kbd>Ctrl</kbd> + <kbd>.</kbd> to stop</span>
    </div>
  </div>

  <div class="tab-view active" id="code-tab">
    <div id="editor-wrap">
      <div id="lnums">1</div>
      <div id="ed-inner">
        <div id="hl" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </div>
    <div id="con-resize"></div>
    <div id="console">

<script>

function _applyScreenTransform() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(screenX, screenY);
  ctx.translate(screenRotOx, screenRotOy);
  ctx.rotate(screenRot);

let pyodide = null, running = false, rafId = null;

const keysHeld = new Set(), keysPress = new Set(), keysRel = new Set();

function _resetRuntimeState() {
  keysHeld.clear(); keysPress.clear(); keysRel.clear();
  btnsHeld.clear(); btnsPress.clear(); btnsRel.clear();
  wheelUp = 0; wheelDown = 0;
  stdinWait = null;

  lastTs = performance.now();

  if (window._bpActiveNodes) {
    for (const n of window._bpActiveNodes) {

function _normalizeAssetRecord(name, raw) {
  if (raw == null) return null;

  const lowerName = String(name || '').toLowerCase();

  // Already a record object from the embedded asset block
  if (typeof raw === 'object' && !Array.isArray(raw)) {
    if (typeof raw.url !== 'string') return null;

    let type = typeof raw.type === 'string' ? raw.type : null;

    if (!type) {
      if (raw.url.startsWith('data:image/')) type = 'image';
      else if (raw.url.startsWith('data:audio/')) type = 'audio';
      else if (raw.url.startsWith('data:text/')) type = 'text';
      else if (lowerName.endsWith('.json')) type = 'json';
      else if (lowerName.endsWith('.txt')) type = 'text';
      else if (lowerName.endsWith('.bpy')) type = 'lib';
      else if (lowerName.endsWith('.py')) type = 'lib';
      else type = 'audio';
    }

    return {
      url: raw.url,
      type,
      ...(typeof raw.text === 'string' ? { text: raw.text } : {})
    };
  }

  // String input: try JSON first, then old raw-string format
  const rawStr = String(raw);

  try {
    const parsed = JSON.parse(rawStr);
    if (parsed && typeof parsed === 'object' && typeof parsed.url === 'string') {
      let type = typeof parsed.type === 'string' ? parsed.type : null;

      if (!type) {
        if (parsed.url.startsWith('data:image/')) type = 'image';
        else if (parsed.url.startsWith('data:audio/')) type = 'audio';
        else if (parsed.url.startsWith('data:text/')) type = 'text';
        else if (lowerName.endsWith('.json')) type = 'json';
        else if (lowerName.endsWith('.txt')) type = 'text';
        else if (lowerName.endsWith('.bpy')) type = 'lib';
        else if (lowerName.endsWith('.py')) type = 'lib';
        else type = 'audio';
      }

      return {
        url: parsed.url,
        type,
        ...(typeof parsed.text === 'string' ? { text: parsed.text } : {})
      };
    }
  } catch {}

  let type;
  if (rawStr.startsWith('data:image/')) type = 'image';
  else if (rawStr.startsWith('data:audio/')) type = 'audio';
  else if (rawStr.startsWith('data:text/')) type = 'text';
  else if (lowerName.endsWith('.json')) type = 'json';
  else if (lowerName.endsWith('.txt')) type = 'text';
  else if (lowerName.endsWith('.bpy')) type = 'lib';
  else if (lowerName.endsWith('.py')) type = 'lib';
  else type = 'audio';

  return (type === 'text' || type === 'json')
    ? { url: rawStr, type, text: rawStr }
    : { url: rawStr, type };
}

(function _loadStoredAssets() {
  try {
    _bpAssets.clear();

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith('bpa:')) continue;

      const name = key.slice(4);
      const raw = localStorage.getItem(key);

      // Keep empty strings too — localStorage can store them
      if (raw === null) continue;

      let rec = null;

      try {
        // Current format: { url, type, text? }
        const parsed = JSON.parse(raw);

        if (parsed && typeof parsed === 'object' && typeof parsed.url === 'string') {
          const type =
            typeof parsed.type === 'string'
              ? parsed.type
              : parsed.url.startsWith('data:image/')
                ? 'image'
                : parsed.url.startsWith('data:audio/')
                  ? 'audio'
                  : parsed.url.startsWith('data:text/')
                    ? 'text'
                    : 'audio';

          rec = {
            url: parsed.url,
            type,
            ...(typeof parsed.text === 'string' ? { text: parsed.text } : {})
          };
        }
      } catch {
        // Old format: only the raw value was stored
        const lowerName = name.toLowerCase();

        const type =
          raw.startsWith('data:image/') ? 'image' :
          raw.startsWith('data:audio/') ? 'audio' :
          raw.startsWith('data:text/') ? 'text' :
          lowerName.endsWith('.json') ? 'json' :
          lowerName.endsWith('.txt') ? 'text' :
          lowerName.endsWith('.bpy') ? 'lib' :
          lowerName.endsWith('.py') ? 'lib' :
          'audio';

        rec = (type === 'text' || type === 'json')
          ? { url: raw, type, text: raw }
          : { url: raw, type };
      }

      if (rec && typeof rec.url === 'string') {
        _bpAssets.set(name, rec);
      }
    }

    if (typeof _renderAssets === 'function') {
      _renderAssets();
    }
  } catch (e) {
    console.error('Failed to load stored assets:', e);
  }
})();

function _addAsset(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    const lowerName = String(file.name || '').toLowerCase();
    const isLib = lowerName.endsWith('.bpy') || lowerName.endsWith('.py');
    const isText = isLib || (file.type || '').startsWith('text/') || file.type === 'application/json' || lowerName.endsWith('.txt') || lowerName.endsWith('.json');
    reader.onload = ev => {
      const raw = ev.target.result;
      const type = isLib ? 'lib' : (lowerName.endsWith('.json') || file.type === 'application/json' ? 'json' : isText ? 'text' : (file.type || '').startsWith('image/') ? 'image' : 'audio');
      const rec = (type === 'text' || type === 'json' || type === 'lib') ? { url: String(raw), type, text: String(raw) } : { url: String(raw), type };
      _bpAssets.set(file.name, rec);
      try { localStorage.setItem('bpa:' + file.name, JSON.stringify(rec)); } catch(e) {}
      _renderAssets();
      resolve();
    };
    if (isText) reader.readAsText(file);
    else reader.readAsDataURL(file);
  });
}

function removeAsset(name) {
  _bpAssets.delete(name);
  try { localStorage.removeItem('bpa:' + name); } catch(e) {}
  _renderAssets();
}

function _renderAssets() {
  const grid = document.getElementById('asset-grid');
  if (!grid) return;
  if (_bpAssets.size === 0) {
    grid.innerHTML = '<div id="asset-empty">No assets yet.<br><br>Drag &amp; drop image, audio, text or JSON files<br>anywhere on the page to add them.<br><br>Then use <code>Image("name.png")</code>, <code>Sound("name.mp3")</code>, <code>read_txt("name.txt")</code>, or <code>read_json("name.json")</code> in your code.<br><br>You can also import .py or .bpy files, just drag &amp; drop them on the page and use <code>include("name.bpy")</code><br>to run whatever code is in the file. All variables and functions are kept.</div>';
    return;
  }
  grid.innerHTML = '';
  for (const [name, rec] of _bpAssets) {
    const { url, type } = rec;
    const card = document.createElement('div');
    card.className = 'asset-card';
    const pyUsage = type === 'image' ? 'Image("' + name + '")' : type === 'audio' ? 'Sound("' + name + '")' : type === 'json' ? 'read_json("' + name + '")' : type === 'text' ? 'read_txt("' + name + '")' : 'include("' + name + '")';
    card.title = 'Click to copy: ' + pyUsage;
    card.onclick = () => {
      navigator.clipboard.writeText(pyUsage).catch(() => {});
      window.appendConsole('Copied: ' + pyUsage, 'ok');
    };
    const preview = document.createElement('div');
    preview.className = 'asset-preview';
    if (type === 'image') {
      const img = document.createElement('img');
      img.src = url; img.alt = name;
      preview.appendChild(img);
    } else if (type === 'audio') {
      preview.innerHTML = '<span class="asset-audio-icon">♪</span>';
    } else if (type === 'json') {
      preview.innerHTML = '<span class="asset-json-icon">{}</span>';
    } else if (type === 'text') {
      preview.innerHTML = '<span class="asset-text-icon">🗎</span>';
    } else {
      preview.innerHTML = '<span class="asset-lib-icon">lib</span>';
    }
    const label = document.createElement('div');
    label.className = 'asset-name'; label.title = name; label.textContent = name;
    const del = document.createElement('button');
    del.className = 'asset-del'; del.textContent = '✕';
    del.onclick = e => { e.stopPropagation(); removeAsset(name); };
    card.appendChild(preview); card.appendChild(label); card.appendChild(del);
    grid.appendChild(card);
  }
}

// ══════════════════════════════════════════════════════════════
//  Syntax Highlighter
// ══════════════════════════════════════════════════════════════
const KEYWORDS_CTRL = new Set([
  'False','None','True','and','as','assert','async','await',
  'break','case','class','continue','def','del','elif','else','except',
  'finally','for','from','global','if','import','in','is',
  'lambda','match','nonlocal','not','or','pass','raise','return',
  'try','while','with','yield'
]);
const KEYWORDS_TYPE = new Set([
  'int','float','str','bool','list','dict','tuple','set','frozenset',
  'bytes','bytearray','complex','type','object','super','property',
  'classmethod','staticmethod','Exception','BaseException','ValueError',
  'TypeError','KeyError','IndexError','AttributeError','RuntimeError',
  'StopIteration','NameError','NotImplementedError','OverflowError',
  'ZeroDivisionError','FileNotFoundError','OSError','IOError'
]);
const BUILTINS = new Set([
  'abs','all','any','bin','callable','chr','compile','delattr',
  'dir','divmod','enumerate','eval','exec','filter','format',
  'getattr','globals','hasattr','hash','help','hex','id',
  'input','isinstance','issubclass','iter','len','locals',
  'map','max','min','next','oct','open','ord','pow','print',
  'range','repr','reversed','round','setattr','slice','sorted',
  'sum','vars','zip','__import__','__name__','__doc__'
]);

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function span(cls, s) { return `<span class="${cls}">${s}</span>`; }

function highlightLine(line) {
  // empty → preserve space
  if (!line) return '\n';

  let out = '';
  let i = 0;
  const n = line.length;

  // helper: consume while predicate
  function eat(pred) {
    const s = i;
    while (i < n && pred(line[i])) i++;
    return line.slice(s, i);
  }

  while (i < n) {
    const ch = line[i];

    // ── comment
    if (ch === '#') {
      out += span('sy-cmt', esc(line.slice(i)));
      break;
    }

    // ── triple-quoted string (single line span — full multi-line handled outside)
    if ((ch === '"' || ch === "'") && line[i+1] === ch && line[i+2] === ch) {
      const q = ch.repeat(3);
      let j = i + 3;
      while (j <= n - 3 && line.slice(j, j+3) !== q) j++;
      j = j <= n - 3 ? j + 3 : n;
      out += span('sy-str', esc(line.slice(i, j)));
      i = j;
      continue;
    }

    // ── string
    if (ch === '"' || ch === "'") {
      let j = i + 1;
      while (j < n && line[j] !== ch) {
        if (line[j] === '\\') j++;
        j++;
      }
      if (j < n) j++;
      out += span('sy-str', esc(line.slice(i, j)));
      i = j;
      continue;
    }

    // ── decorator
    if (ch === '@') {
      let j = i + 1;
      while (j < n && /[\w.]/.test(line[j])) j++;
      out += span('sy-dec', esc(line.slice(i, j)));
      i = j;
      continue;
    }

    // ── number (int, float, hex, bin, oct, complex)
    if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(line[i+1]||''))) {
      const s = i;
      if (ch === '0' && /[xXbBoO]/.test(line[i+1]||'')) {
        i += 2;
        while (i < n && /[\w]/.test(line[i])) i++;
      } else {
        while (i < n && /[\d._eEjJ]/.test(line[i])) i++;
      }
      out += span('sy-num', esc(line.slice(s, i)));
      continue;
    }

    // ── identifier or keyword
    if (/[a-zA-Z_]/.test(ch)) {
      const s = i;
      while (i < n && /[\w]/.test(line[i])) i++;
      const word = line.slice(s, i);

      // look-ahead for function call or definition
      let j = i;
      while (j < n && line[j] === ' ') j++;
      const isCall = line[j] === '(';
      const prevWord = out.match(/class="sy-kw">(\w+)<\/span>\s*$|>(class|def)\s*$/);

      if (word === 'self' || word === 'cls') {
        out += span('sy-self', esc(word));
      } else if (KEYWORDS_CTRL.has(word)) {
        out += span('sy-kw', esc(word));
      } else if (KEYWORDS_TYPE.has(word)) {
        out += span('sy-bi', esc(word));
      } else if (BUILTINS.has(word)) {
        out += span('sy-bi', esc(word));
      } else if (isCall) {
        out += span('sy-fn', esc(word));
      } else if (/^[A-Z]/.test(word)) {
        out += span('sy-cls', esc(word));
      } else {
        out += esc(word);
      }
      continue;
    }

    // ── operators
    if (/[+\-*/%=<>!&|^~]/.test(ch)) {
      const s = i;
      while (i < n && /[+\-*/%=<>!&|^~]/.test(line[i])) i++;
      out += span('sy-op', esc(line.slice(s, i)));
      continue;
    }

    // ── punctuation
    if (/[()[\]{},.:;]/.test(ch)) {
      out += span('sy-pun', esc(ch));
      i++;
      continue;
    }

    // ── anything else
    out += esc(ch);
    i++;
  }

  return out + '\n';
}

// multi-line highlight with triple-string state
function highlight(code) {
  const lines = code.split('\n');
  let html = '';
  let inTriple = false;
  let tripleChar = '';

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];

    if (inTriple) {
      const endIdx = line.indexOf(tripleChar.repeat(3));
      if (endIdx !== -1) {
        html += span('sy-str', esc(line.slice(0, endIdx + 3))) + esc(line.slice(endIdx + 3));
        inTriple = false;
      } else {
        html += span('sy-str', esc(line));
      }
      html += '\n';
      continue;
    }

    // check if this line starts a multi-line triple string
    // (simplified: just detect opening triple that has no matching close on same line)
    let openTriple = -1, tCh = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      // skip comments
      if (c === '#') break;
      // skip single-line strings
      if ((c === '"' || c === "'") && line[i+1] !== c) {
        const q = c;
        i++;
        while (i < line.length && line[i] !== q) { if (line[i]==='\\') i++; i++; }
        continue;
      }
      if ((c === '"' || c === "'") && line[i+1] === c && line[i+2] === c) {
        const q3 = c.repeat(3);
        const rest = line.indexOf(q3, i+3);
        if (rest === -1) { openTriple = i; tCh = c; break; }
        else { i = rest + 2; }
      }
    }

    if (openTriple !== -1) {
      html += highlightLine(line.slice(0, openTriple)).slice(0,-1);
      html += span('sy-str', esc(line.slice(openTriple)));
      html += '\n';
      inTriple = true;
      tripleChar = tCh;
    } else {
      html += highlightLine(line);
    }
  }

  return html;
}

// ══════════════════════════════════════════════════════════════
//  Editor: sync highlight + line numbers
// ══════════════════════════════════════════════════════════════
function syncEditor() {
  const code = $ed.value;

  // line numbers
  const n = code.split('\n').length;
  let ln = '';
  for (let i = 1; i <= n; i++) ln += i + '\n';
  $lnums.textContent = ln;

  // highlight — add trailing space so last empty line has height
  $hl.innerHTML = highlight(code + ' ').replace(/\n$/, '');

  // sync scroll
  syncHLScroll();
}

function syncHLScroll() {
  // Shift #hl as a block — no scroll state → no geometry mismatch
  $hl.style.top  = -$ed.scrollTop  + 'px';
  $hl.style.left = -$ed.scrollLeft + 'px';
  $lnums.scrollTop = $ed.scrollTop;
}

// ══════════════════════════════════════════════════════════════
//  Smart keyboard handling in editor
// ══════════════════════════════════════════════════════════════
$ed.addEventListener('keydown', e => {
  const val = $ed.value;
  const ss  = $ed.selectionStart;
  const se  = $ed.selectionEnd;
  const sel = ss !== se;

  // ── Ctrl+Enter → run
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault(); if (!$runBtn.disabled) runCode(); return;
  }
  // ── Ctrl+. → stop
  if ((e.ctrlKey || e.metaKey) && e.key === '.') {
    e.preventDefault(); stopCode(); return;
  }

  // ── Tab key: indent 4 spaces
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!sel) {
      insert('    ', ss, se);
    } else {
      // extend start back to beginning of the first selected line
      const lineStart = val.lastIndexOf('\n', ss - 1) + 1;
      const before    = val.slice(0, lineStart);
      const after     = val.slice(se);
      const mid       = val.slice(lineStart, se);
      const indented  = e.shiftKey
        ? mid.replace(/^ {1,4}/gm, '')
        : mid.replace(/^/gm, '    ');
      $ed.value = before + indented + after;
      $ed.selectionStart = lineStart;
      $ed.selectionEnd   = lineStart + indented.length;
      syncEditor();
    }
    return;
  }

  // ── Enter: smart auto-indent
  if (e.key === 'Enter' && !e.ctrlKey) {
    e.preventDefault();

    const lineStart = val.lastIndexOf('\n', ss - 1) + 1;
    const currentLine = val.slice(lineStart, ss);

    // base indent = leading whitespace of current line
    const baseIndent = currentLine.match(/^(\s*)/)[1];

    // increase indent if line ends with :
    const stripped = currentLine.trimEnd();
    const extraIndent = stripped.endsWith(':') ? '    ' : '';

    // if cursor is inside brackets/parens/braces, add extra indent
    // (simple heuristic: count unmatched opens)
    const prevText = val.slice(0, ss);
    let brackets = 0;
    for (const c of prevText) {
      if ('([{'.includes(c)) brackets++;

    const newIndent = baseIndent + extraIndent + bracketIndent;
    insert('\n' + newIndent, ss, se);
    return;
  }

  // ── Backspace: delete 4 spaces as one if only spaces before cursor on line
  if (e.key === 'Backspace' && !sel) {
    const lineStart = val.lastIndexOf('\n', ss - 1) + 1;
    const beforeCursor = val.slice(lineStart, ss);
    if (beforeCursor.length > 0 && beforeCursor.trimEnd() === '' && beforeCursor.length % 4 === 0) {

      insert('', ss - 4, ss);
      return;
    }

  // ── Auto-close pairs: () [] {} "" ''
  const pairs = { '(':')', '[':']', '{':'}', '"':'"', "'":"'" };
  if (pairs[e.key]) {
    if (sel) {

      e.preventDefault();
      const selected = val.slice(ss, se);
      const wrapped  = e.key + selected + pairs[e.key];
      $ed.value = val.slice(0, ss) + wrapped + val.slice(se);
      $ed.selectionStart = ss + 1;
      $ed.selectionEnd   = ss + 1 + selected.length;
      syncEditor();
      return;
    }
    // no selection: auto-close
    e.preventDefault();
    insert(e.key + pairs[e.key], ss, se);
    $ed.selectionStart = $ed.selectionEnd = ss + 1;
    syncEditor();
    return;
  }

  // ── Skip closing char if already there
  const closers = new Set([')', ']', '}']);
  if ((closers.has(e.key) || e.key === '"' || e.key === "'") && !sel) {
    if (val[ss] === e.key) {
      e.preventDefault();
      $ed.selectionStart = $ed.selectionEnd = ss + 1;
      return;
    }
  }
});

function insert(text, start, end) {
  const v = $ed.value;
  $ed.value = v.slice(0, start) + text + v.slice(end);
  $ed.selectionStart = $ed.selectionEnd = start + text.length;
  syncEditor();
}

(function() {
  const handle = document.getElementById('con-resize');
  const panel  = document.getElementById('console');
  let drag = false, startY = 0, startH = 0;
  handle.addEventListener('mousedown', e => {
    drag = true; startY = e.clientY; startH = panel.offsetHeight;
    handle.classList.add('drag'); document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!drag) return;
    panel.style.height = Math.max(72, Math.min(700, startH + (startY - e.clientY))) + 'px';
  });
  document.addEventListener('mouseup', () => {
    drag = false; handle.classList.remove('drag'); document.body.style.userSelect = '';
  });
})();

    const w = Math.max(0, maxX - minX);
    const h = Math.max(0, maxY - minY);

    try {
      const raw = (dp && typeof dp.toJs === 'function') ? dp.toJs() : dp;
      if (raw instanceof Uint8Array || raw instanceof Uint8ClampedArray) {
        u8 = (raw instanceof Uint8ClampedArray) ? raw : new Uint8ClampedArray(raw.buffer, raw.byteOffset, raw.byteLength);

    if (!sfc || !sfc._ctx) return;

  },
  surface_screen() {
    const c = document.createElement('canvas');
    c.width = $canvas.width; c.height = $canvas.height;
    c.getContext('2d').drawImage($canvas, 0, 0);
    const g = c.getContext('2d');
    return { _canvas: c, _ctx: g };
  },
  surface_w(sfc) { return sfc ? sfc._canvas.width  : 0; },
  surface_h(sfc) { return sfc ? sfc._canvas.height : 0; },
  // ── File I/O (IDE) ────────────────────────────────────────────
  file_write(name, content) {
    const n = String(name);
    const existing = _bpAssets.get(n);
    let currentText = '';
    if (existing && (existing.type === 'text' || existing.type === 'json')) {
      currentText = typeof existing.text === 'string' ? existing.text : '';
    }
    const newText = currentText + String(content);
    const type = n.endsWith('.json') ? 'json' : 'text';
    const rec = { url: newText, type, text: newText };
    _bpAssets.set(n, rec);
    try { localStorage.setItem('bpa:' + n, JSON.stringify(rec)); } catch(e) {}
    _renderAssets();
  },
  file_erase(name) {
    const n = String(name);
    const type = n.endsWith('.json') ? 'json' : 'text';
    const rec = { url: '', type, text: '' };
    _bpAssets.set(n, rec);
    try { localStorage.setItem('bpa:' + n, JSON.stringify(rec)); } catch(e) {}
    _renderAssets();
  },
  file_burn(name) {
    const n = String(name);
    _bpAssets.delete(n);
    try { localStorage.removeItem('bpa:' + n); } catch(e) {}
    _renderAssets();
  },
};

class Matrix:
    def __init__(s,w,h,d=None):
        s._w=int(w); s._h=int(h)
        s._g=[d() if callable(d) else copy.deepcopy(d) for _ in range(s._w*s._h)]
    width=property(lambda s:s._w); height=property(lambda s:s._h); size=property(lambda s:s._w*s._h)
    def __getitem__(s,p):
        x,y=(int(p.x),int(p.y)) if hasattr(p,'x') else (int(p[0]),int(p[1])); return s._g[y*s._w+x]
    def __setitem__(s,p,v):
        x,y=(int(p.x),int(p.y)) if hasattr(p,'x') else (int(p[0]),int(p[1])); s._g[y*s._w+x]=v
    def __contains__(s,v): return v in s._g
    def __iter__(s): return iter(s._g)
    def __len__(s): return s.size
    def fill(s,v): s._g[:]=[v]*s.size
    def copy(s): r=Matrix(s._w,s._h); r._g=[copy.deepcopy(v) for v in s._g]; return r
    def items(s): w=s._w; return ((i%w,i//w,s._g[i]) for i in range(s.size))
    def positions(s): w=s._w; return ((i%w,i//w) for i in range(s.size))
    def neighbors(s,x,y):
        w,h=s._w,s._h
        return ((x+dx,y+dy) for dy in (-1,0,1) for dx in (-1,0,1) if (dx or dy) and 0<=x+dx<w and 0<=y+dy<h)
    def cardinal(s,x,y):
        w,h=s._w,s._h
        return ((x+dx,y+dy) for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)) if 0<=x+dx<w and 0<=y+dy<h)
    def map(s,f): r=Matrix(s._w,s._h); r._g=[f(v) for v in s._g]; return r
    def apply(s,f): s._g=[f(v) for v in s._g]
    def in_bounds(s,x,y): return 0<=x<s._w and 0<=y<s._h
    def transposted(s):
        r=Matrix(s._h,s._w)
        for y in range(s._h):
            for x in range(s._w):
                r[x,y] = s[x,y]
        return r
    def transpose(s): return s.transposted()
    def flip(s):
        """Return a copy flipped along the y-axis (left ↔ right / horizontal mirror)."""
        r=Matrix(s._w,s._h)
        for y in range(s._h):
            for x in range(s._w):
                r[x,y]=s[s._w-1-x,y]
        return r
    def mirror_horizontal(s): return s.flip()
    def flip_horizontal(s):   return s.flip()
    def mirror(s):
        """Return a copy mirrored along the x-axis (top ↔ bottom / vertical flip)."""
        r=Matrix(s._w,s._h)
        for y in range(s._h):
            for x in range(s._w):
                r[x,y]=s[x,s._h-1-y]
        return r
    def flip_vertical(s):   return s.mirror()
    def mirror_vertical(s): return s.mirror()
    def __matmul__(s,o):
        if not isinstance(o, Matrix): return NotImplemented
        if s._w != o._h: raise ValueError('matrix dimensions do not align for multiplication')
        r=Matrix(o._w, s._h, 0)
        for y in range(s._h):
            for x in range(o._w):
                total = 0
                for k in range(s._w):
                    total += s[k,y] * o[x,k]
                r[x,y] = total
        return r
    def __repr__(s): return f'Matrix({s._w}, {s._h})'

def noise1(x, smooth=True):
    """1D value noise in [0, 1].

    smooth=True  – smooth S-curve interpolation (default, C1-continuous).
    smooth=False – simple linear interpolation between corner values.

    Example:
        y = noise1(get_time()) * H()
    """
    ix=int(floor(x)); fx=fract(x)
    u=smooth_step(fx) if smooth else fx
    return lerp(_nhash(ix), _nhash(ix+1), u)

def noise2(x, y=0, smooth=True):
    """2D value noise in [0, 1].

    smooth=True  – smooth S-curve interpolation (default, C1-continuous).
    smooth=False – simple bilinear interpolation between corner values.

    Example:
        v = noise2(x * 0.01, get_time() * 0.3)
    """
    ix,iy=int(floor(x)),int(floor(y)); fx,fy=fract(x),fract(y)
    u,v=(smooth_step(fx),smooth_step(fy)) if smooth else (fx,fy)
    a=_nhash(ix,iy);b=_nhash(ix+1,iy);c=_nhash(ix,iy+1);d=_nhash(ix+1,iy+1)
    return lerp(lerp(a,b,u),lerp(c,d,u),v)

def noise3(x, y=0, z=0, smooth=True):
    """3D value noise in [0, 1].

    smooth=True  – smooth S-curve interpolation (default, C1-continuous).
    smooth=False – simple trilinear interpolation between corner values.

    Example:
        v = noise3(x * 0.01, y * 0.01, get_time() * 0.2)
    """
    ix,iy,iz=int(floor(x)),int(floor(y)),int(floor(z)); fx,fy,fz=fract(x),fract(y),fract(z)
    u,v,w=(smooth_step(fx),smooth_step(fy),smooth_step(fz)) if smooth else (fx,fy,fz)
    a000=_nhash(ix,iy,iz);   a100=_nhash(ix+1,iy,iz)
    a010=_nhash(ix,iy+1,iz); a110=_nhash(ix+1,iy+1,iz)
    a001=_nhash(ix,iy,iz+1); a101=_nhash(ix+1,iy,iz+1)
    a011=_nhash(ix,iy+1,iz+1); a111=_nhash(ix+1,iy+1,iz+1)
    return lerp(lerp(lerp(a000,a100,u),lerp(a010,a110,u),v),
                lerp(lerp(a001,a101,u),lerp(a011,a111,u),v),w)

    """Alias for noise2(). 2D value noise in [0, 1]."""

class Image:
    """Load an image from a URL or capture one from the screen.
    img = Image("https://example.com/sprite.png")
    img = Image.from_screen((x1, y1), (x2, y2))
    draw_image(img, x, y)
    draw_image_quad(img, p1, p2, p3, p4)
    img.ready / img.width / img.height / img.size()
    """
    def __init__(s, url):
        s._h = _py.img_create(str(url))
        _asset_registry.append(s)
    @classmethod
    def from_screen(cls, p1, p2, keep=False):
        """Capture a rectangle of the canvas as an Image.

        p1, p2  – corner points (Vec2 or (x, y)).
        keep    – if True the underlying <img> element is NOT cleared at the end
                  of the frame, so the Image can be reused across multiple frames.
                  Defaults to False (single-frame cache, freed automatically).
        """
        x1,y1 = _pt2(p1)
        x2,y2 = _pt2(p2)
        h = _py.img_from_screen(float(x1), float(y1), float(x2), float(y2), bool(keep))
        obj = cls.__new__(cls)
        obj._h = h
        _asset_registry.append(obj)
        return obj
    @property
    def ready(s):  return bool(_py.img_ready(s._h))
    @property
    def width(s):  return int(_py.img_size(s._h).to_py()[0])
    @property
    def height(s): return int(_py.img_size(s._h).to_py()[1])

def draw_image(img, x, y, width=None, height=None, angle=0, origin=(0,0), tint=None):
    """Draw an Image. x,y is the anchor; origin=(ox,oy) defines which point
    within the image is the anchor: (0,0)=top-left, (0.5,0.5)=center, (1,1)=bottom-right.
    angle is in degrees, rotating around the anchor point.
    width/height default to the image's natural size.
    Pass a negative width or height to flip/mirror the image along that axis.
    tint multiplies every pixel of the image by the given color.
    """
    w = float(width)  if width  is not None else 0.0   # 0 = natural size
    h = float(height) if height is not None else 0.0
    ox, oy = _get_origin(origin)
    _py.img_draw(img._h, float(x), float(y), w, h, _deg(angle), ox, oy, _css_clear(tint) if tint is not None else None)


def _asset_info(name):
    info = _py.asset_get(str(name))
    if info is None:
        return None
    return info.to_py() if hasattr(info, 'to_py') else info

def read_txt(name):
    """Read a text or JSON asset and return its full content as a string.

    Accepts both .txt and .json files — the raw text is returned as-is
    regardless of extension.  Raises FileNotFoundError if the asset is
    missing or is not a text-like type.

    Example:
        content = read_txt("story.txt")
        raw_json = read_txt("config.json")  # returns the JSON as a plain string
    """
    info = _asset_info(name)
    if not info or info.get('type') not in ('text', 'json'):
        raise FileNotFoundError(f'Asset not found or not text-like: {name}')
    return str(info.get('text', info.get('url', '')))

def read_txt_lines(name):
    return tuple(read_txt(name).splitlines())

def read_json(name):
    """Parse a JSON or text asset and return a Python dict, list, or scalar.

    Accepts both .json and .txt files — the file content just needs to
    contain valid JSON.  Raises FileNotFoundError if the asset is missing,
    and json.JSONDecodeError if the content cannot be parsed.

    Example:
        data   = read_json("levels.json")
        config = read_json("config.txt")   # .txt file holding JSON content
    """
    return json.loads(read_txt(name))

def to_json(data, *, indent=None):
    """Convert a dict, list, or scalar to a JSON-formatted string.

    indent  – optional int; when given, the output is pretty-printed
              with that many spaces of indentation per nesting level.

    Returns a str containing the JSON representation of *data*.

    Example:
        s = to_json({"x": 10, "y": 20})
        write("pos.json", s)

        pretty = to_json([1, 2, 3], indent=2)
        # "[\\n  1,\\n  2,\\n  3\\n]"
    """
    return json.dumps(data, indent=indent)

def write(name, content):
    """Write (or append) content to a .txt or .json file.

    If the file already exists its current text is preserved and the new
    content is concatenated to the end.  The file is persisted in the browser
    so it survives program restarts and page reloads.

    name must end in .txt or .json.

    Example:
        write("log.txt", "round 1 complete\\n")
        write("log.txt", "round 2 complete\\n")
        print(read_txt("log.txt"))   # "round 1 complete\\nround 2 complete\\n"
    """
    _nm = str(name)
    if not (_nm.endswith('.txt') or _nm.endswith('.json')):
        raise ValueError(f"write(): filename must end in .txt or .json, got {_nm!r}")
    _py.file_write(_nm, str(content))

def erase(name):
    """Erase all contents of a .txt or .json file, leaving it empty.

    The file still exists after erase() and can be written to again with write().
    Use burn() to remove the file entirely.

    name must end in .txt or .json.

    Example:
        erase("log.txt")
        print(read_txt("log.txt"))   # ""
    """
    _nm = str(name)
    if not (_nm.endswith('.txt') or _nm.endswith('.json')):
        raise ValueError(f"erase(): filename must end in .txt or .json, got {_nm!r}")
    _py.file_erase(_nm)

def burn(name):
    """Permanently delete a .txt or .json file.

    In the IDE the asset is removed from the Assets panel and localStorage.
    In an exported HTML the file is removed from the browser cache.

    name must end in .txt or .json.

    Example:
        burn("log.txt")
        # log.txt no longer exists; read_txt("log.txt") would raise FileNotFoundError
    """
    _nm = str(name)
    if not (_nm.endswith('.txt') or _nm.endswith('.json')):
        raise ValueError(f"burn(): filename must end in .txt or .json, got {_nm!r}")
    _py.file_burn(_nm)

# ── Fragment shader ────────────────────────────────────────────

_INV255 = 1.0 / 255.0

def fragment(fn):
    """Apply a per-pixel shader function to the entire canvas.

    fn(r, g, b, pos) → Vec3(r, g, b)
      r, g, b  – current pixel color, 0.0 – 1.0
      pos      – Vec2(x, y) UV coordinates: (0,0) top-left, (1,1) bottom-right
      return     Vec3(r, g, b) in 0.0 – 1.0  (alpha is never modified)

    FAST PATH (automatic):  if fn can be called with numpy arrays it is called
    once for the entire image at C / GPU speed via numpy broadcasting.
    Write fn to work on scalars — numpy will vectorise it automatically when
    all maths uses +, -, *, /, clamp(), lerp(), sin(), cos(), etc.

    FALLBACK: per-pixel Python loop, used when fn relies on control-flow that
    numpy cannot vectorise (if/else on pixel values, recursion, etc.).  The
    fallback transparently skips fully-transparent pixels for extra speed.

    Examples:
        # Invert (numpy-vectorised automatically):
        def invert(r, g, b, pos):
            return Vec3(1-r, 1-g, 1-b)
        fragment(invert)

        # Radial vignette (also numpy-vectorised):
        def vignette(r, g, b, pos):
            d = ((pos.x - 0.5)**2 + (pos.y - 0.5)**2) ** 0.5 * 1.4
            f = 1.0 - (d if d < 1.0 else 1.0)  # or: clamp(d,0,1)
            return Vec3(r*f, g*f, b*f)
        fragment(vignette)
    """
    cw = W(); ch = H(); n = cw * ch
    if n == 0:
        return

    raw_js = _py.get_canvas_data()
    flat   = raw_js.to_py() if hasattr(raw_js, 'to_py') else raw_js

    # ── Fast path: numpy vectorised ───────────────────────────────
    try:
        import numpy as _np

        # Build (H, W) float32 planes from the raw pixel buffer
        arr  = _np.frombuffer(bytes(bytearray(flat)), dtype=_np.uint8).copy().reshape(ch, cw, 4)
        r_f  = arr[:, :, 0].astype(_np.float32) * _INV255
        g_f  = arr[:, :, 1].astype(_np.float32) * _INV255
        b_f  = arr[:, :, 2].astype(_np.float32) * _INV255
        # UV grids — shape (H, W)
        xs   = _np.linspace(0.0, 1.0, cw, endpoint=False, dtype=_np.float32)[_np.newaxis, :]
        ys   = _np.linspace(0.0, 1.0, ch, endpoint=False, dtype=_np.float32)[:, _np.newaxis]
        xs   = _np.broadcast_to(xs, (ch, cw)).copy()
        ys   = _np.broadcast_to(ys, (ch, cw)).copy()

        res = fn(r_f, g_f, b_f, Vec2(xs, ys))
        # Vec2(xs, ys) works because Vec2 stores x/y as-is (floats/arrays)

        def _to_u8(v):
            a = _np.asarray(v, dtype=_np.float32)
            _np.clip(a, 0.0, 1.0, out=a)
            return (a * 255 + 0.5).astype(_np.uint8)

        arr[:, :, 0] = _to_u8(res.x)
        arr[:, :, 1] = _to_u8(res.y)
        arr[:, :, 2] = _to_u8(res.z)
        _py.put_canvas_data(arr.tobytes())
        return
    except Exception:
        pass   # fn is not numpy-compatible → fall through to per-pixel loop

    # ── Per-pixel fallback (optimised) ────────────────────────────
    data   = bytearray(flat)
    inv_cw = 1.0 / cw if cw > 1 else 1.0
    inv_ch = 1.0 / ch if ch > 1 else 1.0
    _clamp = clamp
    _Vec2  = Vec2
    _Vec3x = float
    i255   = 255

    for i in range(n):
        b4 = i * 4
        if data[b4 + 3] == 0:
            continue   # skip fully transparent pixels
        res = fn(
            data[b4]     * _INV255,
            data[b4 + 1] * _INV255,
            data[b4 + 2] * _INV255,
            _Vec2((i % cw) * inv_cw, (i // cw) * inv_ch)
        )
        data[b4]     = min(i255, max(0, int(float(res.x) * i255 + 0.5)))
        data[b4 + 1] = min(i255, max(0, int(float(res.y) * i255 + 0.5)))
        data[b4 + 2] = min(i255, max(0, int(float(res.z) * i255 + 0.5)))

    _py.put_canvas_data(bytes(data))

class Sound:
    """Load a sound from a URL.
    snd = Sound("https://example.com/sound.mp3")
    node = play_sound(snd)
    node = play_sound(snd, volume=0.8, speed=1.5, loop=True)
    snd.ready  → True once fully decoded
    """
    def __init__(s, url):
        s._h = _py.snd_create(str(url))
        _asset_registry.append(s)
    @property
    def ready(s): return bool(_py.snd_ready(s._h))

class SoundNode:
    """Returned by play_sound(). Controls a currently playing sound."""
    def __init__(s, h): s._h = h
    def stop(s):             _py.snd_stop(s._h)
    def set_volume(s, v):    _py.snd_vol(s._h, float(v))
    def set_speed(s, r):     _py.snd_rate(s._h, float(r))

def play_sound(sound, volume=1.0, speed=1.0, loop=False):
    """Play a Sound and return a SoundNode, or None if not loaded yet.
    speed also controls pitch (2.0 = double speed + one octave up)."""
    h = _py.snd_play(sound._h, float(volume), float(speed), bool(loop))
    return SoundNode(h) if h is not None else None

def stop_sound(node):
    """Stop a playing SoundNode."""
    if node is not None: node.stop()

def set_sound_volume(node, volume):
    """Change volume of a playing sound (0.0 – 1.0+)."""
    if node is not None: node.set_volume(volume)

def set_sound_speed(node, speed):
    """Change playback speed/pitch of a playing sound (1.0 = normal)."""
    if node is not None: node.set_speed(speed)

def screen_pos(x=None, y=None):
    """Get or set the screen position. screen_pos() -> (x, y)."""
    if x is None and y is None:
        v = _py.screen_pos()
        r = v.toJs() if hasattr(v, 'toJs') else list(v)
        return (float(r[0]), float(r[1]))
    if y is None and hasattr(x, 'x'):
        x, y = x.x, x.y
    elif y is None and isinstance(x, (tuple, list)):
        x, y = x[0], x[1]
    return tuple(float(v) for v in _py.screen_pos(float(x), float(y)).toJs())

def screen_rot(angle=None, origin=(0,0)):
    """Get or set the screen rotation in degrees."""
    if angle is None:
        v = _py.screen_rot()
        r = v.toJs() if hasattr(v, 'toJs') else list(v)
        return (float(r[0]), float(r[1]), float(r[2]))
    ox, oy = _get_origin(origin)
    v = _py.screen_rot(_deg(angle), float(ox), float(oy))
    r = v.toJs() if hasattr(v, 'toJs') else list(v)
    return (float(r[0]), float(r[1]), float(r[2]))

def reset(keep=()):
    """Restart the current game while preserving named globals."""

    saved = {name: g[name] for name in keep if name in g}
    js._bp_reset()

def include(name):
    """Execute a .bpy or .py file from the asset registry in the current global namespace.

    - Any assets embedded inside that file (images, sounds, other libs ...) are
      registered automatically, so nested include() calls inside the file work too.
    - Top-level setup() and update() definitions inside the included file are
      silently ignored — only the host file's lifecycle hooks are used.
    - All other variables, classes, and functions become available globally.

    Usage:
        include("mylib.bpy")
        include("utils.py")

    The file must be in the Assets tab first (drag & drop or the Import button).
    """
    import ast as _ast
    info = _asset_info(str(name))
    if info is None:
        raise FileNotFoundError(
            f'Asset not found: {name!r} — make sure the file is in the Assets tab.')
    t = info.get('type', '')
    if t not in ('lib', 'text'):
        raise TypeError(
            f'Asset {name!r} is not a .bpy/.py file (type={t!r})')
    code = str(info.get('text', info.get('url', '')))

    # ── 1. Register any assets embedded in the file's header ─────
    # A file exported from BowPy may start with:
    #   # BOWPY_ASSETS: {"name.png": {...}, ...}
    # Loading those assets makes nested include() and Image()/Sound()
    # calls inside the file work correctly.
    if code.startswith('# BOWPY_ASSETS: '):
        nl = code.index('\\n')
        _py.asset_register_bulk(code[len('# BOWPY_ASSETS: '):nl])
        code = code[nl + 1:]

    # ── 2. Strip top-level setup() / update() definitions ────────
    # We parse with ast so that only genuine top-level function defs
    # named 'setup' or 'update' are removed; anything else is kept.
    try:
        tree = _ast.parse(code, filename=str(name))
        tree.body = [
            node for node in tree.body
            if not (isinstance(node, _ast.FunctionDef)
                    and node.name in ('setup', 'update'))
        ]
        _ast.fix_missing_locations(tree)
        code_obj = compile(tree, str(name), 'exec')
    except SyntaxError:
        # Fall back to raw compile — syntax errors will surface on exec
        code_obj = compile(code, str(name), 'exec')

    exec(code_obj, globals())

# ── Strict typing & constants ─────────────────────────────────

# Keys that the controlled-globals dict never validates (internal BowPy state).
_CG_SKIP = frozenset({'__STRICTS', '__CONSTS'})

class _ControlledGlobals(dict):
    """A globals() dict subclass that enforces strict types and constants.
    __STRICTS maps var_name → info dict; __CONSTS is a set of frozen names.
    """
    def __setitem__(self, key, value):
        if key in _CG_SKIP:
            super().__setitem__(key, value)
            return
        try:
            _stricts = dict.__getitem__(self, '__STRICTS') if '__STRICTS' in self.keys() else {}
            _consts  = dict.__getitem__(self, '__CONSTS')  if '__CONSTS'  in self.keys() else set()
        except Exception:
            _stricts = {}; _consts = set()

        # ── constant guard ─────────────────────────────────────
        if key in _consts and key in self:
            raise ValueError(
                f"Cannot reassign constant '{key}'. "
                f"Constants can never be unlocked.")

        # ── strict type guard ──────────────────────────────────
        if key in _stricts:
            info     = _stricts[key]
            btype    = info['type']
            current  = self.get(key)

            if btype is list:
                if not isinstance(value, list):
                    raise TypeError(
                        f"Strict variable '{key}' must remain a list, "
                        f"got {type(value).__name__}.")
                if current is not None and len(value) != len(current):
                    raise TypeError(
                        f"Strict list '{key}' is locked to size {len(current)}, "
                        f"got size {len(value)}.")

            elif btype is set:
                if not isinstance(value, set):
                    raise TypeError(
                        f"Strict variable '{key}' must remain a set, "
                        f"got {type(value).__name__}.")
                et = info.get('elem_type')
                if et is not None and value:
                    bad = [type(v).__name__ for v in value if not isinstance(v, et)]
                    if bad:
                        raise TypeError(
                            f"Strict set '{key}' only allows {et.__name__} elements; "
                            f"incompatible: {', '.join(bad[:3])}.")

            elif btype is dict:
                if not isinstance(value, dict):
                    raise TypeError(
                        f"Strict variable '{key}' must remain a dict, "
                        f"got {type(value).__name__}.")
                kt = info.get('key_types', {})
                for k, expected in kt.items():
                    if k not in value:
                        raise TypeError(
                            f"Strict dict '{key}' must keep all original keys; "
                            f"missing '{k}'.")
                    if not isinstance(value[k], expected):
                        raise TypeError(
                            f"Strict dict '{key}': value for '{k}' must be "
                            f"{expected.__name__}, got {type(value[k]).__name__}.")

            else:
                if not isinstance(value, btype):
                    raise TypeError(
                        f"Strict variable '{key}' must be {btype.__name__}, "
                        f"got {type(value).__name__}.")

        super().__setitem__(key, value)


def _install_controlled_globals():
    """Replace __main__.__dict__ with _ControlledGlobals (idempotent)."""
    import sys as _s
    m  = _s.modules['__main__']
    if isinstance(m.__dict__, _ControlledGlobals):
        return m.__dict__
    cg = _ControlledGlobals(m.__dict__)
    m.__dict__ = cg
    return cg


def _reset_controlled():
    """Clear __STRICTS, __CONSTS and the live Timer/KeyRecorder/Surface registries — called at every run start/stop."""
    import sys as _s
    cg = _s.modules['__main__'].__dict__
    if isinstance(cg, _ControlledGlobals):
        dict.__setitem__(cg, '__STRICTS', {})
        dict.__setitem__(cg, '__CONSTS',  set())
    else:
        cg['__STRICTS'] = {}
        cg['__CONSTS']  = set()
    # Drop all Timer, KeyRecorder, Surface, and asset instances from the previous run
    _BP_TIMERS.clear()
    _BP_KEY_RECORDERS.clear()
    _BP_SURFACES.clear()
    _asset_registry.clear()
    # Reset the draw target to the main screen canvas
    _py.surface_reset_target()


__STRICTS = {}   # {var_name: {type, ...}}  – readable, but managed by strict()
__CONSTS  = set()  # set of constant var names – readable, but managed by const()


_STRICT_SENTINEL = object()   # unique sentinel — never equals any user value

def strict(var_name, value=_STRICT_SENTINEL):
    """Lock a variable to its current type until dynamic() is called.

    If *value* is supplied the variable is set to that value first, so you
    can write strict('x', 5) instead of x = 5; strict('x').

    Rules by type:
      list  – size is locked (length must stay the same on reassignment;
               in-place mutations such as .append() are NOT checked).
      set   – all elements must share the one datatype present when
               strict() was called (in-place .add() is NOT checked).
      dict  – each key's value type is locked; all original keys must be
               present on reassignment (in-place d[k]=v is NOT checked).
      other – the type itself is locked.

    Example:
        strict('x', 42)   # assign 42 and lock as int
        x = 10            # OK — still int
        x = 3.14          # TypeError!

    See also: dynamic(), const()
    """
    import sys as _s
    g = _s.modules['__main__'].__dict__

    # Assign the value first if one was supplied
    if value is not _STRICT_SENTINEL:
        # Bypass the ControlledGlobals guard (we're setting the initial value)
        if isinstance(g, _ControlledGlobals):
            dict.__setitem__(g, var_name, value)
        else:
            g[var_name] = value

    if var_name not in g:
        raise NameError(
            f"'{var_name}' is not defined. Assign a value first, then call strict().")
    _install_controlled_globals()
    cg = _s.modules['__main__'].__dict__
    if '__STRICTS' not in cg:
        dict.__setitem__(cg, '__STRICTS', {})
    stricts = dict.__getitem__(cg, '__STRICTS')

    val   = cg[var_name]
    btype = type(val)
    info  = {'type': btype}

    if btype is list:
        info['len'] = len(val)
    elif btype is set:
        if val:
            types_found = set(type(e) for e in val)
            if len(types_found) > 1:
                raise TypeError(
                    f"Cannot make '{var_name}' strict: set contains mixed types "
                    f"({', '.join(t.__name__ for t in types_found)}). "
                    f"A strict set must have a single element type.")
            info['elem_type'] = next(iter(types_found))
        else:
            info['elem_type'] = None
    elif btype is dict:
        info['key_types'] = {k: type(v) for k, v in val.items()}

    stricts[var_name] = info
    dict.__setitem__(cg, '__STRICTS', stricts)


def dynamic(var_name):
    """Unlock a variable previously locked with strict(), allowing its type to change.

    Example:
        x = 42; strict('x')
        dynamic('x')
        x = 'now a string'   # OK again
    """
    import sys as _s
    cg = _s.modules['__main__'].__dict__
    if '__STRICTS' in cg:
        dict.__getitem__(cg, '__STRICTS').pop(var_name, None)


def const(var_name, value=_STRICT_SENTINEL):
    """Permanently lock a variable — reassigning it raises ValueError forever.

    If *value* is supplied the variable is set to that value first, so you
    can write const('GRAVITY', 9.8) instead of GRAVITY = 9.8; const('GRAVITY').

    Unlike strict(), const() cannot be undone; there is no dynamic() for constants.

    Example:
        const('GRAVITY', 9.8)
        GRAVITY = 5.0   # ValueError!
    """
    import sys as _s
    g = _s.modules['__main__'].__dict__

    # Assign the value first if one was supplied, bypassing any existing guard
    if value is not _STRICT_SENTINEL:
        if isinstance(g, _ControlledGlobals):
            # Temporarily remove from __CONSTS (in case of re-definition) then set
            consts = dict.get(g, '__CONSTS') or set()
            consts.discard(var_name)
            dict.__setitem__(g, '__CONSTS', consts)
            dict.__setitem__(g, var_name, value)
        else:
            g[var_name] = value

    if var_name not in g:
        raise NameError(
            f"'{var_name}' is not defined. Assign a value first, then call const().")
    _install_controlled_globals()
    cg = _s.modules['__main__'].__dict__
    if '__CONSTS' not in cg:
        dict.__setitem__(cg, '__CONSTS', set())
    dict.__getitem__(cg, '__CONSTS').add(var_name)
