def in_bounds(value, minimum, maximum):
    """Return True if minimum <= value <= maximum."""
    return minimum <= value <= maximum

# ── Timer ─────────────────────────────────────────────────────

_BP_TIMERS = []   # all live Timer instances — ticked automatically each frame

class Timer:
    """A frame-accurate timer that counts in milliseconds.

    Timers register themselves automatically and are ticked every frame
    alongside update(), so no manual update calls are needed in your code.

    Quick-start:
        t = Timer()           # create, stopped at 0 ms
        t.start()             # count up from 0
        t.start(5000)         # count up from 5 000 ms
        t.countdown(10000)    # count down from 10 s; stops at 0
        t.stop()              # freeze at current value
        t.reset()             # stop and return to 0
        print(t)              # '0:00:10.0000'
        print(t.seconds)      # 10.0

    Format  H:MM:SS.ssss
        The sub-second field is 4 decimal digits where each unit = 0.1 ms,
        so .5000 means 500 ms (= 5000 / 10).

    Parsing:
        t = Timer.from_string('0:00:75.5000')   # 75 500 ms
        t = Timer.from_string('1:02:10.0500')   # 3 730 050 ms

    Arithmetic (returns a new stopped Timer):
        t + 1000              # add 1 000 ms  (int/float/str/Timer)
        t - Timer(500)        # subtract
        t * Timer(2)          # multiply ms values  (Timer × Timer only)
        t / Timer(2)          # divide   ms values  (Timer ÷ Timer only)

    Comparisons (Timer, int/float ms, or formatted string):
        t == 5000
        t > Timer(3000)
        t <= '0:00:05.0000'
    """

    # ── construction ─────────────────────────────────────────────

    def __init__(s, ms: float = 0.0):
        s._ms        = float(ms)
        s._running   = False
        s._countdown = False
        _BP_TIMERS.append(s)

    # ── internal tick ─────────────────────────────────────────────
    # Called every frame by _frame() with delta-time in milliseconds.
    # The increment is  fps * 0.001  ≡  (1/dt_s) * 0.001  ≡  dt_s * 1000  ms.

    def _tick(s, dt_ms: float):
        if not s._running:
            return
        if s._countdown:
            s._ms = max(0.0, s._ms - dt_ms)
            if s._ms <= 0.0:
                s._running = False
        else:
            s._ms += dt_ms

    # ── control ───────────────────────────────────────────────────

    def start(s, ms: float = None):
        """Start (or restart) counting up. Optionally set a starting value in ms."""
        if ms is not None:
            s._ms = float(ms)
        s._countdown = False
        s._running   = True
        return s

    def countdown(s, ms: float = None):
        """Start counting down to 0. Optionally set the starting value in ms."""
        if ms is not None:
            s._ms = float(ms)
        s._countdown = True
        s._running   = True
        return s

    def stop(s):
        """Freeze the timer at its current value."""
        s._running = False
        return s

    def reset(s, ms: float = 0.0):
        """Stop and set the value to *ms* (default 0)."""
        s._running = False
        s._ms      = float(ms)
        return s

    # ── properties ────────────────────────────────────────────────

    @property
    def milliseconds(s) -> float:
        """Stored value in milliseconds (float)."""
        return s._ms

    @property
    def seconds(s) -> float:
        """Stored value in seconds (float)."""
        return s._ms / 1_000.0

    @property
    def minutes(s) -> float:
        """Stored value in minutes (float)."""
        return s._ms / 60_000.0

    @property
    def hours(s) -> float:
        """Stored value in hours (float)."""
        return s._ms / 3_600_000.0

    @property
    def running(s) -> bool:
        """True while the timer is actively counting."""
        return s._running

    @property
    def finished(s) -> bool:
        """True when a countdown has reached 0 and stopped."""
        return s._countdown and not s._running and s._ms <= 0.0

    # ── formatting ────────────────────────────────────────────────

    def __str__(s) -> str:
        """Format as  H:MM:SS.ssss  (4-digit sub-second, each unit = 0.1 ms).

        Examples:
            Timer(75500)     →  '0:01:15.5000'
            Timer(3730050)   →  '1:02:10.0500'
        """
        sign     = '-' if s._ms < 0 else ''
        total_ms = abs(s._ms)
        # Split into whole-second part and fractional ms
        whole_s  = int(total_ms // 1000)
        frac_ms  = total_ms - whole_s * 1000.0         # 0 – 999.999...
        h, rem   = divmod(whole_s, 3600)
        m,  sec  = divmod(rem, 60)
        # The ssss field: each unit = 0.1 ms → multiply frac_ms by 10, round
        ssss     = int(round(frac_ms * 10.0))
        # Guard against rounding to 10000 (e.g. 999.95 ms → carry)
        if ssss >= 10000:
            ssss  = 0
            sec  += 1
            if sec >= 60:
                sec = 0; m += 1
            if m >= 60:
                m = 0; h += 1
        return f'{sign}{h}:{m:02d}:{sec:02d}.{ssss:04d}'

    def __repr__(s) -> str:
        state = 'counting-down' if (s._running and s._countdown) else \
                'running' if s._running else 'stopped'
        return f'Timer({s._ms}ms, {state})'

    # ── parsing ───────────────────────────────────────────────────

    @staticmethod
    def _parse_ms(other) -> float:
        """Coerce Timer / int / float / str to a float millisecond value."""
        if isinstance(other, Timer):
            return other._ms
        if isinstance(other, str):
            return Timer.from_string(other)._ms
        return float(other)

    @staticmethod
    def from_string(s_str: str) -> 'Timer':
        """Parse a time string into a new stopped Timer.

        Format:  H:MM:SS.ssss   (minutes and seconds may exceed 59)
        The ssss field is 1-4 digits where each unit = 0.1 ms:
            '0:00:75.5000'  →  75 * 1000 + 5000/10  =  75 500 ms
            '1:02:10.0500'  →  3 600 000+120 000+10 000+50/10 = 3 730 005 ms

        The ssss digits are always left-justified (0-padded on right):
            '.5'  means .5000  →  5000 / 10  =  500 ms
            '.05' means .0500  →   500 / 10  =   50 ms
        """
        import re as _re
        s = str(s_str).strip()
        neg = s.startswith('-')
        if neg:
            s = s[1:]
        m = _re.fullmatch(
            r'(\d+):(\d+):(\d+)(?:\.(\d{1,4}))?', s
        )
        if m is None:
            raise ValueError(
                f"Cannot parse Timer string {s_str!r}. "
                f"Expected  H:MM:SS  or  H:MM:SS.ssss")
        h_s, mn_s, sec_s, frac_s = m.groups()
        # Right-pad the fractional field to 4 digits (left-justified)
        frac4 = (frac_s or '0000').ljust(4, '0')
        total_ms = (
            int(h_s)   * 3_600_000
          + int(mn_s)  *    60_000
          + int(sec_s) *     1_000
          + int(frac4) / 10.0         # 4 digits, each = 0.1 ms
        )
        if neg:
            total_ms = -total_ms
        return Timer(total_ms)

    # ── arithmetic ────────────────────────────────────────────────
    # +/-: Timer ± (Timer | int | float | str)
    # */÷: Timer × Timer only  (dimensionally consistent)

    def __add__(s, other):
        return Timer(s._ms + Timer._parse_ms(other))
    def __radd__(s, other):
        return Timer(Timer._parse_ms(other) + s._ms)
    def __sub__(s, other):
        return Timer(s._ms - Timer._parse_ms(other))
    def __rsub__(s, other):
        return Timer(Timer._parse_ms(other) - s._ms)
    def __mul__(s, other):
        if not isinstance(other, Timer):
            raise TypeError(
                f"Timer * requires another Timer; got {type(other).__name__}. "
                f"To scale by a number, use timer + (timer.milliseconds * factor).")
        return Timer(s._ms * other._ms)
    def __rmul__(s, other):
        return s.__mul__(other)
    def __truediv__(s, other):
        if not isinstance(other, Timer):
            raise TypeError(
                f"Timer / requires another Timer; got {type(other).__name__}.")
        if other._ms == 0.0:
            raise ZeroDivisionError("Timer division by zero (0 ms).")
        return Timer(s._ms / other._ms)

    # ── comparisons ───────────────────────────────────────────────

    def __eq__(s, other):
        try:    return s._ms == Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __lt__(s, other):
        try:    return s._ms <  Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __le__(s, other):
        try:    return s._ms <= Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __gt__(s, other):
        try:    return s._ms >  Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __ge__(s, other):
        try:    return s._ms >= Timer._parse_ms(other)
        except (TypeError, ValueError): return NotImplemented
    def __hash__(s):
        return hash(s._ms)


# ── Key Recorder ──────────────────────────────────────────────

_BP_KEY_RECORDERS = []   # all live KeyRecorder instances — ticked automatically each frame

class KeyRecorder:
    """Records typed characters into an internal string cache every frame.

    Recorders register themselves automatically and are ticked every frame
    alongside update(), so no manual update calls are needed in your code.

    Quick-start:
        rec = KeyRecorder()          # create (not yet recording)
        rec.record()                 # start capturing typed keys
        rec.stop()                   # stop capturing
        print(rec.text)              # the captured text
        rec.clear()                  # wipe the cache

    Parameters:
        focus          (bool, default False)
            When True, key_down(), key_pressed() and key_released() always
            return False while this recorder is active, so held keys do not
            trigger other game actions at the same time.

        event          (str, default "pressed")
            Controls when a key is detected:
            "pressed"  – recorded on the first frame the key is pressed.
            "released" – recorded on the frame the key is released.
            "frame"    – recorded every frame the key is held (repeating);
                         if "a" is held for 3 frames it is appended 3 times.

        case_sensitive (bool, default True)
            If True, letters respect the current shift / CapsLock state.
            If False, every letter is stored in uppercase regardless.

        allow          (str or None, default None)
            When set, only characters that appear in this string are recorded.
            None means all printable characters are accepted.
            Example: allow="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ "

        max_length     (int, default -1)
            Once the cache reaches this length no further characters are
            appended.  Any negative value means unlimited.

        multiline      (bool, default False)
            When True, pressing Enter appends a newline ("\\n") to the cache.
    """

    def __init__(s, focus=False, event="pressed", case_sensitive=True,
                 allow=None, max_length=-1, multiline=False):
        s._cache      = ""
        s._recording  = False
        s.focus         = bool(focus)
        s.event         = str(event)
        s.case_sensitive = bool(case_sensitive)
        s.allow         = str(allow) if allow is not None else None
        s.max_length    = int(max_length)
        s.multiline     = bool(multiline)
        _BP_KEY_RECORDERS.append(s)

    # ── internal tick ─────────────────────────────────────────────
    # Called every frame by _frame().

    def _tick(s):
        if not s._recording:
            return

        if s.event == "frame":
            raw = _py.keys_held()
        elif s.event == "pressed":
            raw = _py.keys_pressed()
        elif s.event == "released":
            raw = _py.keys_released()
        else:
            return

        keys = list(raw.to_py() if hasattr(raw, "to_py") else raw)

        # Determine case: shift XOR capslock → uppercase letters
        held_raw = _py.keys_held()
        held     = set(held_raw.to_py() if hasattr(held_raw, "to_py") else held_raw)
        shift    = "shift" in held
        caps     = bool(_py.capslock())
        upper    = shift != caps   # XOR: exactly one active → uppercase

        for k in sorted(keys):
            # ── Newline (multiline mode) ───────────────────────────
            if k == "enter":
                if s.multiline:
                    s._append("\\n")
                continue

            # ── Only single printable characters ──────────────────
            if len(k) != 1 or not k.isprintable():
                continue

            # ── Resolve case ──────────────────────────────────────
            if k.isalpha():
                ch = k.upper() if upper else k
            else:
                ch = k

            if not s.case_sensitive:
                ch = ch.upper()

            # ── Apply allow-list filter ────────────────────────────
            if s.allow is not None and ch not in s.allow:
                continue

            s._append(ch)

    def _append(s, ch):
        """Append ch to the cache if max_length allows it."""
        if s.max_length < 0 or len(s._cache) < s.max_length:
            s._cache += ch

    # ── control ───────────────────────────────────────────────────

    def record(s):
        """Start recording key input into the cache."""
        s._recording = True
        return s

    def stop(s):
        """Stop recording; the cache is preserved until clear() is called."""
        s._recording = False
        return s

    def clear(s):
        """Erase all text from the internal cache string."""
        s._cache = ""
        return s

    # ── properties ────────────────────────────────────────────────

    @property
    def text(s) -> str:
        """The current cached text string."""
        return s._cache

    @property
    def recording(s) -> bool:
        """True while the recorder is actively capturing input."""
        return s._recording

    # ── Python protocol ───────────────────────────────────────────

    def __str__(s)  -> str: return s._cache
    def __repr__(s) -> str:
        return f'KeyRecorder(recording={s._recording}, text={s._cache!r})'
    def __len__(s)  -> int: return len(s._cache)


def _any_focused_recorder():
    """True if any focused KeyRecorder is currently recording."""
    return any(r.focus and r._recording for r in _BP_KEY_RECORDERS)


# ── Surface ────────────────────────────────────────────────────

_BP_SURFACES = []   # all live Surface instances — cleared at each run start/stop

class Surface:
    """An off-screen canvas you can draw onto and later composite.

    Usage:
        s = Surface(320, 240)          # blank black surface
        set_target(s)                  # redirect draw calls to s
        draw_circle(160, 120, 50, RED)
        reset_target()                 # back to the screen
        draw_surface(s, 0, 0)          # blit s at screen origin

    Constructor:
        Surface(width=<screen_w>, height=<screen_h>, fill=(0,0,0,255))

    Methods:
        s.clear(color)  – fill every pixel with color
        s.to_image()    – snapshot as an Image
        Surface.screen()– copy of the current screen as a Surface

    Properties:
        s.width, s.height, s.size()
    """
    def __init__(s, width=None, height=None, fill=(0, 0, 0, 255)):
        w = int(width)  if width  is not None else int(_py.sw())
        h = int(height) if height is not None else int(_py.sh())
        s._h = _py.surface_create(w, h)
        # Apply initial fill only if it differs from the default black
        fc = _css_clear(fill)
        _py.surface_fill(s._h, fc)
        _BP_SURFACES.append(s)

    def clear(s, color=(0, 0, 0, 255)):
        """Fill all pixels of this surface with *color*."""
        _py.surface_fill(s._h, _css_clear(color))

    @staticmethod
    def screen():
        """Return a new Surface that is a pixel-perfect copy of the current screen."""
        obj = Surface.__new__(Surface)
        obj._h = _py.surface_screen()
        _BP_SURFACES.append(obj)
        return obj

    def to_image(s):
        """Return a snapshot of this surface as an Image object."""
        img_h = _py.surface_to_image(s._h)
        obj = Image.__new__(Image)
        obj._h = img_h
        _asset_registry.append(obj)
        return obj

    @property
    def width(s):  return int(_py.surface_w(s._h))
    @property
    def height(s): return int(_py.surface_h(s._h))
    def size(s):   return (int(_py.surface_w(s._h)), int(_py.surface_h(s._h)))
    def __repr__(s): return f'Surface({s.width}x{s.height})'


def set_target(surface):
    """Redirect all draw functions to *surface* instead of the screen."""
    _py.surface_set_target(surface._h)

def reset_target():
    """Reset the draw target back to the main screen canvas."""
    _py.surface_reset_target()

def draw_surface(surface, x, y):
    """Draw *surface* at (x, y) on the current draw target."""
    _py.surface_draw(surface._h, float(x), float(y))


# ── Timer-aware frame runner ───────────────────────────────────

_BP_RESERVED = set(globals().keys())
_HAS_UPDATE=False; _HAS_SETUP=False
def _check():
    global _HAS_UPDATE,_HAS_SETUP
    g=globals(); _HAS_UPDATE=callable(g.get('update')); _HAS_SETUP=callable(g.get('setup'))
def _setup():
    if _HAS_SETUP: globals()['setup']()
def _frame():
    # Tick all live Timer instances (dt in ms = fps * 0.001 equivalent)
    _dt_ms = float(_py.dt()) * 1000.0
    _i = 0
    while _i < len(_BP_TIMERS):
        _t = _BP_TIMERS[_i]
        try:
            _t._tick(_dt_ms)
            _i += 1
        except Exception:
            _BP_TIMERS.pop(_i)   # silently drop dead/corrupt entries
    # Tick all live KeyRecorder instances
    _i = 0
    while _i < len(_BP_KEY_RECORDERS):
        _r = _BP_KEY_RECORDERS[_i]
        try:
            _r._tick()
            _i += 1
        except Exception:
            _BP_KEY_RECORDERS.pop(_i)
    if _HAS_UPDATE: globals()['update']()
`;

async function initPyodide() {

    document.getElementById('hint').style.display = '';

    $ed.value = (_saved !== null) ? _saved : DEFAULT_CODE;

// ══════════════════════════════════════════════════════════════
//  Game loop
// ══════════════════════════════════════════════════════════════
function frame(ts) {
  if (!running) return;
  const raw = Math.min((ts - lastTs) / 1000, 0.1);
  // Skip both rendering AND Python execution until the target interval has elapsed.
  // This throttles runtime FPS (update() calls), not just drawing.
  if (fpsLimit > 0 && raw < (1.0 / fpsLimit)) {
    rafId = requestAnimationFrame(frame);
    return;
  }
  lastTs = ts; deltaTime = raw;
  fpsSmooth += (1 / (raw || 0.001) - fpsSmooth) * 0.08;
  _applyScreenTransform();
  try {
    pyodide.runPython('_frame()');
  } catch(err) {
    window.appendConsole(err.message, 'err');
    stopCode(); return;
  }
  // Clear img_from_screen cache accumulated this frame
  for (const img of _bpScreenCapImages) { img.src = ''; _bpImgDataCache.delete(img); }
  _bpScreenCapImages.length = 0;
  keysPress.clear(); keysRel.clear();
  btnsPress.clear(); btnsRel.clear();
  wheelUp = 0; wheelDown = 0;
  rafId = requestAnimationFrame(frame);
}

async function runCode() {
  if (running) stopCode();
  clearCon();
  try { localStorage.setItem(_LS, $ed.value); } catch(e) {}
  $runBtn.disabled = true; $stpBtn.disabled = false;
  switchTab('screen'); fitCanvas();
  ctx.clearRect(0, 0, $canvas.width, $canvas.height);
  running = true; setStatus('Running', 's-run');
  try {
    window._bpLastUserCode = $ed.value;
    pyodide.runPython('_reset_controlled()');
    await pyodide.runPythonAsync($ed.value);
    pyodide.runPython('_check()');
    if (pyodide.runPython('_HAS_UPDATE')) {
      pyodide.runPython('_setup()');
      // wait for all registered Image/Sound assets to finish loading
      if (!pyodide.runPython('_all_assets_ready()')) {
        window.appendConsole('Waiting for assets...', 'sys');
        await new Promise(resolve => {
          const poll = () => {
            if (pyodide.runPython('_all_assets_ready()')) resolve();
            else setTimeout(poll, 80);
          };
          poll();
        });
        window.appendConsole('Assets ready.', 'ok');
      }
      lastTs = performance.now();
      rafId = requestAnimationFrame(frame);
    } else {
      stopCode(false);
    }
  } catch(err) {
    window.appendConsole(err.message, 'err');
    stopCode(); switchTab('code');
  }
}

function stopCode(msg = true) {
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  // Reset draw target to main canvas (safety – in case a Surface target was active)
  ctx = _mainCtx;
  _bpTargetCanvas = $canvas;
  // Clear strict/const locks so the next run starts clean
  try { if (window.pyodide) pyodide.runPython('_reset_controlled()'); } catch(e) {}
  // Stop all playing sounds
  if (window._bpActiveNodes) {
    for (const n of window._bpActiveNodes) {
      try { n.src.stop(0); } catch(e) {}
    }
    window._bpActiveNodes = [];
  }
  if (_bpVibeTimer) { clearInterval(_bpVibeTimer); _bpVibeTimer = null; }
  if (navigator.vibrate) navigator.vibrate(0);
  $runBtn.disabled = false; $stpBtn.disabled = true;
  setStatus('Ready', 's-ready');
  if (msg) window.appendConsole('— stopped —', 'sys');
}

window._bp_reset = function() {
  _resetRuntimeState();
  ctx.clearRect(0, 0, $canvas.width, $canvas.height);
  const code = window._bpCurrentCode || $ed.value;
  try {
    pyodide.runPython(code);
    pyodide.runPython('_check()');
    if (pyodide.runPython('_HAS_SETUP')) pyodide.runPython('_setup()');
  } catch (e) {
    window.appendConsole(e.message, 'err');
  }
};

async function _bp_restart_after_reset(keepNames) {
  const keep = Array.isArray(keepNames) ? keepNames : Array.from(keepNames || []);
  const snapshot = pyodide.runPython(`{k: globals().get(k) for k in ${JSON.stringify(keep)} if k in globals()}`);
  window._bpResetSnapshot = snapshot;
  pyodide.runPython(`
for _k in list(globals().keys()):
    if _k not in _BP_RESERVED and not _k.startswith('__'):
        del globals()[_k]
`);
  if (window._bpLastUserCode !== undefined) {
    pyodide.runPython('_reset_controlled()');
    await pyodide.runPythonAsync(window._bpLastUserCode);
    pyodide.runPython('__bp_restore_keep(js._bpResetSnapshot)');
    pyodide.runPython('_check()');
    if (pyodide.runPython('_HAS_UPDATE')) {
      pyodide.runPython('_setup()');
      if (!pyodide.runPython('_all_assets_ready()')) {
        window.appendConsole('Waiting for assets...', 'sys');
        await new Promise(resolve => {

            if (pyodide.runPython('_all_assets_ready()')) resolve();
            else setTimeout(poll, 80);
          };
          poll();
        });
        window.appendConsole('Assets ready.', 'ok');
      }
      lastTs = performance.now();
      rafId = requestAnimationFrame(frame);
      running = true;
      setStatus('Running', 's-run');
    }
  }
}

window._bp_reset_game = function(keepNames) {
  const wasRunning = running;
  stopCode(false);
  running = false;
  (async () => {
    try {
      if (wasRunning) await _bp_restart_after_reset(keepNames);
      else await _bp_restart_after_reset(keepNames);
    } catch (err) {
      window.appendConsole(err.message, 'err');
      setStatus('Ready', 's-ready');
      $runBtn.disabled = false; $stpBtn.disabled = true;
    }
  })();
};

async function exportFile() {
  const code = $ed.value;
  const raw  = (document.getElementById('fname').value || 'sketch').trim();
  const slug = raw.replace(/\.bpy$/i, '').replace(/[<>:"/\\|?*]/g, '_') || 'sketch';
  // Embed asset store as a JSON comment block at the top of the file
  let assetBlock = '';
  if (_bpAssets.size > 0) {
    const assetObj = {};
    for (const [name, rec] of _bpAssets) assetObj[name] = rec;
    assetBlock = '# BOWPY_ASSETS: ' + JSON.stringify(assetObj) + '\n';
  }
  const blob = new Blob([assetBlock + code], { type: 'text/plain' });
  if (window.showSaveFilePicker) {
    try {
      const fh = await window.showSaveFilePicker({
        suggestedName: slug + '.bpy',
        types: [{ description: 'BowPy source', accept: { 'text/plain': ['.bpy', '.py'] } }]
      });
      const ws = await fh.createWritable();
      await ws.write(blob);
      await ws.close();
      window.appendConsole('Saved: ' + fh.name, 'ok');
      return;
    } catch(err) {
      if (err.name === 'AbortError') return;
      // fall through to download fallback
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.bpy';
  a.click();

let _newClickTimer = null, _newClicks = 0;
function newFile() {
  const btn = document.getElementById('new-btn');
  _newClicks++;
  clearTimeout(_newClickTimer);
  if (_newClicks === 1) {
    btn.textContent = '✦ Sure?'; btn.className = 'btn btn-io confirm-1';
    _newClickTimer = setTimeout(() => { _newClicks=0; btn.textContent='✦ New'; btn.className='btn btn-io'; }, 2500);
  } else if (_newClicks === 2) {
    btn.textContent = '✦ Really?'; btn.className = 'btn btn-io confirm-2';
    _newClickTimer = setTimeout(() => { _newClicks=0; btn.textContent='✦ New'; btn.className='btn btn-io'; }, 2500);
  } else {
    _newClicks = 0; btn.textContent = '✦ New'; btn.className = 'btn btn-io';
    $ed.value = DEFAULT_CODE;
    document.getElementById('fname').value = 'sketch';
    try { localStorage.removeItem(_LS); } catch(e) {}
    syncEditor();
    switchTab('code');
    window.appendConsole('New file created.', 'sys');
  }
}

function importFile() {
  const inp = document.getElementById('file-inp');
  inp.value = '';
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext !== 'bpy' && ext !== 'py') {
      window.appendConsole('Import error: only .bpy and .py files are supported.', 'err');
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      let text = ev.target.result;
      // Parse embedded asset block if present
      if (text.startsWith('# BOWPY_ASSETS: ')) {
        const nl = text.indexOf('\n');
        const assetJson = text.slice('# BOWPY_ASSETS: '.length, nl);
        text = text.slice(nl + 1);
        try {
          const assetObj = JSON.parse(assetJson);
          for (const [name, raw] of Object.entries(assetObj)) {
            const rec = _normalizeAssetRecord(name, raw);
            if (rec) { _bpAssets.set(name, rec); try { localStorage.setItem('bpa:' + name, JSON.stringify(rec)); } catch(e) {} }
          }
          window.appendConsole('Loaded ' + Object.keys(assetObj).length + ' embedded asset(s).', 'ok');
        } catch(e) { window.appendConsole('Asset parse error: ' + e.message, 'err'); }
      }
      $ed.value = text;
      syncEditor();
      switchTab('code');
      const baseName = file.name.replace(/\.(bpy|py)$/i, '');
      document.getElementById('fname').value = baseName;
      try { localStorage.setItem(_LS_NAME, baseName); } catch(e) {}
      window.appendConsole('Loaded: ' + file.name, 'ok');
    };
    reader.readAsText(file);
  };
  inp.click();
}

        <tr><td>int / float / str / ...</td><td>The type itself — any other type raises TypeError.</td></tr>

  "fragment_fn": {
    title: "fragment()",
    category: "Graphics",
    type: "function",
    desc: "Applies a per-pixel shader function to the entire canvas. The function receives (r, g, b, pos) and returns a Vec3(r, g, b).",
    signature: `<span class="ws-fn">fragment</span><span class="ws-pun">(</span><span class="ws-param">fn</span><span class="ws-pun">)</span>`,
    body: `
      <p class="wiki-p">The shader function is called once for every pixel. <code>r</code>, <code>g</code>, <code>b</code> are the current pixel's color channels in 0.0–1.0. <code>pos</code> is a Vec2 with UV coordinates: (0,0) at the top-left, (1,1) at the bottom-right.</p>

      <p class="wiki-p">BowPy automatically tries to vectorise the function with NumPy for near-GPU performance. If the function uses Python-only control flow it falls back to a per-pixel loop.</p>

      <div class="wiki-example">
        <div class="wiki-example-title">Invert colors on the canvas</div>
<pre>
def update():
    clear(rgb(30, 60, 120))
    draw_circle(W()/2, H()/2, 60, "orange")

    def invert(r, g, b, pos):
        return Vec3(1-r, 1-g, 1-b)

    fragment(invert)
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Radial vignette</div>
<pre>
def update():
    clear("white")
    draw_rect(60, 60, 200, 120, "cyan")

    def vignette(r, g, b, pos):
        d = ((pos.x - 0.5)**2 + (pos.y - 0.5)**2) ** 0.5 * 1.4
        f = clamp(1.0 - d, 0, 1)
        return Vec3(r*f, g*f, b*f)

    fragment(vignette)

    for x, y, alive in grid.items():

  // ─────────────────────── KEY RECORDER ───────────────────────
  "key_recorder_overview": {
    title: "Key Recorder Overview",
    category: "Key Recorder",
    type: "class",
    desc: "KeyRecorder captures typed characters into an internal string cache, with full control over event timing, case sensitivity, allowed characters and focus blocking.",
    body: `
      <p class="wiki-p">
        A <code>KeyRecorder</code> is a managed object that accumulates typed text every frame. Create one, call <code>record()</code> to start capturing, and read <code>.text</code> at any time. Multiple recorders can coexist.
      </p>

      <div class="wiki-members">
        <div class="wiki-member" onclick="openWikiPage('key_recorder_class')"><div class="wiki-member-name">KeyRecorder()</div><div class="wiki-member-desc">Create a new recorder with configurable parameters.</div></div>
        <div class="wiki-member" onclick="openWikiPage('key_recorder_record')"><div class="wiki-member-name">.record()</div><div class="wiki-member-desc">Start capturing typed keys.</div></div>
        <div class="wiki-member" onclick="openWikiPage('key_recorder_stop')"><div class="wiki-member-name">.stop()</div><div class="wiki-member-desc">Stop capturing; cache is preserved.</div></div>
        <div class="wiki-member" onclick="openWikiPage('key_recorder_clear')"><div class="wiki-member-name">.clear()</div><div class="wiki-member-desc">Erase the cache string.</div></div>
      </div>

      <h2 class="wiki-h2">How It Works</h2>
      <p class="wiki-p">
        Recorders register themselves on construction and are ticked automatically by the game loop on every frame — exactly like <code>Timer</code>. You never need to call a tick or update method manually.
      </p>
      <p class="wiki-p">
        Each frame the recorder inspects the appropriate key set (<code>keys_held</code>, <code>keys_pressed</code>, or <code>keys_released</code>, depending on the <code>event</code> parameter) and appends any qualifying single printable characters to its cache. The <code>allow</code>, <code>max_length</code>, <code>case_sensitive</code>, and <code>multiline</code> parameters control what gets appended.
      </p>

      <div class="wiki-example">
        <div class="wiki-example-title">Simple text-entry field</div>
<pre>
rec = KeyRecorder(multiline=False)
rec.record()

def update():
    clear("black")
    draw_text(20, H()/2, "Type: " + rec.text + "|", "white", 20)
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Name entry with max length and focus blocking</div>
<pre>
name_box = KeyRecorder(focus=True, max_length=12)
name_box.record()

def update():
    clear("black")
    draw_text(W()/2, H()/2 - 20, "Enter your name:", "cyan", 18, align="center")
    draw_text(W()/2, H()/2 + 14, name_box.text + "_", "white", 24, align="center")
    if key_pressed("enter"):       # still works even with focus=True
        name_box.stop()
        print("Hello,", name_box.text)
</pre>
      </div>

      <div class="wiki-note"><b>Note:</b> Only printable single-character keys are captured. Control keys like <code>Escape</code>, <code>Tab</code>, <code>Backspace</code>, arrow keys and function keys are ignored (except <code>Enter</code> when <code>multiline=True</code>). Handle backspace manually if needed.</div>
    `
  },

  "key_recorder_class": {
    title: "KeyRecorder()",
    category: "Key Recorder",
    type: "class",
    desc: "Creates a new KeyRecorder that automatically captures typed characters each frame once record() is called.",
    signature: `<span class="ws-cls">KeyRecorder</span><span class="ws-pun">(</span><br>  <span class="ws-param">focus</span><span class="ws-pun">=</span><span class="ws-kw">False</span><span class="ws-pun">,</span><br>  <span class="ws-param">event</span><span class="ws-pun">=</span><span class="ws-str">"pressed"</span><span class="ws-pun">,</span><br>  <span class="ws-param">case_sensitive</span><span class="ws-pun">=</span><span class="ws-kw">True</span><span class="ws-pun">,</span><br>  <span class="ws-param">allow</span><span class="ws-pun">=</span><span class="ws-kw">None</span><span class="ws-pun">,</span><br>  <span class="ws-param">max_length</span><span class="ws-pun">=</span><span class="ws-lit">-1</span><span class="ws-pun">,</span><br>  <span class="ws-param">multiline</span><span class="ws-pun">=</span><span class="ws-kw">False</span><br><span class="ws-pun">)</span>`,
    body: `
      <table class="wiki-param-table">
        <tr><th>Parameter</th><th>Type</th><th>Description</th></tr>
        <tr>
          <td>focus</td><td>bool</td>
          <td>When <code>True</code> and the recorder is active, <code>key_down()</code>, <code>key_pressed()</code> and <code>key_released()</code> all return <code>False</code> — blocking other input actions from triggering while the recorder is capturing. Defaults to <code>False</code>.</td>
        </tr>
        <tr>
          <td>event</td><td>str</td>
          <td>
            Determines when keys are detected:<br>
            <code>"pressed"</code>  – once, on the frame the key is first pressed (default).<br>
            <code>"released"</code> – once, on the frame the key is released.<br>
            <code>"frame"</code>    – every frame the key is held down; holding "a" for 3 frames appends "a" three times.
          </td>
        </tr>
        <tr>
          <td>case_sensitive</td><td>bool</td>
          <td>When <code>True</code> (default), letter case follows the current Shift / CapsLock state. When <code>False</code>, all letters are stored as uppercase.</td>
        </tr>
        <tr>
          <td>allow</td><td>str | None</td>
          <td>A string listing every character the recorder is permitted to store. Characters not present in this string are silently ignored. <code>None</code> (default) accepts all printable characters.</td>
        </tr>
        <tr>
          <td>max_length</td><td>int</td>
          <td>The recorder stops appending once <code>len(rec.text) == max_length</code>. Any negative value (default <code>-1</code>) means no limit.</td>
        </tr>
        <tr>
          <td>multiline</td><td>bool</td>
          <td>When <code>True</code>, pressing Enter appends a newline character (<code>"\\n"</code>) to the cache. Defaults to <code>False</code>.</td>
        </tr>
      </table>

      <h2 class="wiki-h2">Properties</h2>
      <table class="wiki-param-table">
        <tr><th>Property</th><th>Type</th><th>Description</th></tr>
        <tr><td>.text</td><td>str</td><td>The current accumulated text string.</td></tr>
        <tr><td>.recording</td><td>bool</td><td>True while the recorder is actively capturing.</td></tr>
      </table>

      <div class="wiki-example">
        <div class="wiki-example-title">Digits-only recorder with a 6-character PIN limit</div>
<pre>
pin = KeyRecorder(allow="0123456789", max_length=6)
pin.record()

def update():
    clear("black")
    draw_text(W()/2, H()/2, "PIN: " + pin.text, "lime", 28, align="center")
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Auto-repeat "frame" event for held keys</div>
<pre>
buf = KeyRecorder(event="frame")
buf.record()

def update():
    clear("black")
    # Shows each letter accumulating at held-key speed
    draw_text(20, 40, buf.text[-80:], "cyan", 16)
</pre>
      </div>

      <div class="wiki-ref-list">
        <div class="wiki-ref" onclick="openWikiPage('key_recorder_record')">.record()</div>
        <div class="wiki-ref" onclick="openWikiPage('key_recorder_stop')">.stop()</div>
        <div class="wiki-ref" onclick="openWikiPage('key_recorder_clear')">.clear()</div>
      </div>
    `
  },

  "key_recorder_stop": {
    title: "KeyRecorder — stop()",
    category: "Key Recorder",
    type: "method",
    desc: "Stops the recorder from capturing new characters. The accumulated text in .text is preserved.",
    signature: `<span class="ws-self">rec</span><span class="ws-pun">.</span><span class="ws-fn">stop</span><span class="ws-pun">() →</span> <span class="ws-cls">KeyRecorder</span>`,
    body: `
      <p class="wiki-p">After <code>stop()</code>, the recorder is paused — no new characters are appended and, if <code>focus=True</code> was set, keyboard input is unblocked again. The cache string is untouched. Call <code>record()</code> again to resume capturing.</p>

      <div class="wiki-example">

chat = KeyRecorder(focus=True, max_length=60)

    clear("black")
    if key_pressed("enter") and chat.text.strip():
        messages.append(chat.text)
        chat.clear()   # wipe cache, keep recording
    for i, msg in enumerate(messages[-8:]):
        draw_text(20, 20 + i * 22, msg, "cyan", 14)
    draw_text(20, H() - 36, "> " + chat.text + "_", "white", 16)
</pre>
      </div>

rec = KeyRecorder(focus=True)
rec.record()

def update():
    clear("black")
    if key_pressed("backspace"):
        rec._cache = rec.text[:-1]   # remove last character
    if key_pressed("escape"):
        rec.clear()                  # erase everything
    draw_text(W()/2, H()/2, rec.text + "|", "white", 22, align="center")

        <div class="wiki-example-title">Reuse the same recorder for multiple prompts</div>

rec = KeyRecorder(max_length=16)

    clear("black")
    if state == "name":
        rec.record()
        draw_text(W()/2, H()/2, "Name: " + rec.text + "_", "white", 20, align="center")

            name = rec.text
            rec.clear()
            state = "age"

      <h2 class="wiki-h2">Quick-start</h2>

      <h2 class="wiki-h2">How It Works</h2>
      <p class="wiki-p">

      <div class="wiki-note"><b>Tip:</b> Libraries are a great way to share reusable utilities — physics engines, UI kits, procedural generators — across multiple BowPy projects.</div>

function buildWikiNav() {
  const nav = document.getElementById('wiki-nav');
  if (!nav) return;

  const groups = {};
  for (const [id, page] of Object.entries(WIKI_DOCS)) {
    if (!groups[page.category]) groups[page.category] = [];
    groups[page.category].push([id, page]);
  }

  nav.innerHTML = '';

  for (const [category, pages] of Object.entries(groups)) {
    const grp = document.createElement('div');
    grp.className = 'wiki-nav-group';

    const title = document.createElement('div');
    title.className = 'wiki-nav-group-title';
    title.textContent = category;

    grp.appendChild(title);

    for (const [id, page] of pages) {
      const item = document.createElement('div');
      item.className = 'wiki-nav-item';
      item.innerHTML = '<span class="wni-icon"></span><span>' + page.title + '</span>';
      item.onclick = () => openWikiPage(id);
      item.dataset.page = id;
      grp.appendChild(item);
    }

    nav.appendChild(grp);
  }
}

function openWikiPage(id) {
  const page = WIKI_DOCS[id];
  if (!page) return;

  document.querySelectorAll('.wiki-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === id);
  });

  const bc = document.getElementById('wiki-breadcrumb');
  bc.innerHTML = '<span class="wiki-bc-seg" onclick="openWikiPage(\'home\')">Wiki</span><span class="wiki-bc-sep">›</span><span>' + page.category + '</span>';

  const body = document.getElementById('wiki-body');

  let tagClass = 'wiki-tag-function';
  if (page.type === 'class') tagClass = 'wiki-tag-class';
  if (page.type === 'guide') tagClass = 'wiki-tag-guide';
  if (page.type === 'method') tagClass = 'wiki-tag-method';
  if (page.type === 'example') tagClass = 'wiki-tag-example';

  body.innerHTML =
    '<div class="wiki-tag ' + tagClass + '">' + page.type + '</div>' +
    '<div class="wiki-h1">' + page.title + '</div>' +
    '<div class="wiki-desc">' + page.desc + '</div>' +
    (page.signature ? '<div class="wiki-sig">' + page.signature + '</div>' : '') +
    page.body;
}

function wikiSearch(query) {
  query = String(query || '').toLowerCase().trim();
  const box = document.getElementById('wiki-search-results');

  if (!query) {
    box.style.display = 'none';
    return;
  }

  const matches = Object.entries(WIKI_DOCS).filter(([id, page]) =>
    page.title.toLowerCase().includes(query) ||
    page.desc.toLowerCase().includes(query)
  );

  box.innerHTML = '';

  for (const [id, page] of matches.slice(0, 8)) {
    const item = document.createElement('div');
    item.className = 'wiki-sr-item';
    item.innerHTML = '<strong>' + page.title + '</strong><span class="wiki-sr-cat">' + page.category + '</span>';
    item.onclick = () => {
      openWikiPage(id);
      box.style.display = 'none';
    };
    box.appendChild(item);
  }

  box.style.display = matches.length ? 'block' : 'none';
}

buildWikiNav();
openWikiPage('home');
