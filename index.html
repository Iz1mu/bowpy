//  Run / Stop
// ══════════════════════════════════════════════════════════════
async function runCode() {
  if (running) stopCode();
  if (_bpSet.clearConsole) clearCon();
  _saveNow();
  $runBtn.disabled = true; $stpBtn.disabled = false;
  switchTab('screen'); fitCanvas();
  ctx.clearRect(0, 0, $canvas.width, $canvas.height);
  running = true; setStatus('Running', 's-run');
  _bpRunT0 = performance.now();
  try {
    const prog = _bpGetProgram();
    window._bpLastProgram = prog;
    window._bpLastUserCode = prog.main;
    pyodide.runPython('_reset_runtime()');
    _bpInstallTabs(prog);   // every extra tab becomes a module (utils.bpy -> utils)
    _bpSetMainSrc(prog.main);
    await pyodide.runPythonAsync(prog.main);
    pyodide.runPython('_check()');
    if (pyodide.runPython('_HAS_LOOP')) {
      pyodide.runPython('_setup()');
      // wait for all registered Image/Sound assets to finish loading
      if (!pyodide.runPython('_all_assets_ready()')) {
        window.appendConsole('Waiting for assets...', 'sys');
        await new Promise(resolve => {
          const poll = () => {
            if (pyodide.runPython('_all_assets_ready()')) resolve();
            else setTimeout(poll, 80);
          };
          poll();
        });
        window.appendConsole('Assets ready.', 'ok');
      }
      lastTs = performance.now();
      rafId = requestAnimationFrame(frame);
    } else {
      stopCode(false);
    }
  } catch(err) {
    window.appendConsole(err.message, 'err');
    stopCode(); switchTab('code');
  }
}

function stopCode(msg = true) {
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  // Reset draw target to main canvas (safety – in case a Surface target was active)
  ctx = _mainCtx;
  _bpTargetCanvas = $canvas;
  // Clear timers, surfaces and the other state of the run so the next run starts clean
  try { if (window.pyodide) pyodide.runPython('_reset_runtime()'); } catch(e) {}
  // Stop all playing sounds
  if (window._bpActiveNodes) {
    for (const n of window._bpActiveNodes) {
      try { n.src.stop(0); } catch(e) {}
    }
    window._bpActiveNodes = [];
  }
  $runBtn.disabled = false; $stpBtn.disabled = true;
  setStatus('Ready', 's-ready');
  if (msg) window.appendConsole('— stopped —', 'sys');
}

window._bp_reset = function() {
  _resetRuntimeState();
  try { pyodide.runPython('_bp_frag_reset()'); } catch (e) {}
  ctx.clearRect(0, 0, $canvas.width, $canvas.height);
  const prog = _bpGetProgram();
  const code = window._bpCurrentCode || prog.main;
  try {
    _bpInstallTabs(prog);
    _bpSetMainSrc(code);
    pyodide.runPython(code);
    pyodide.runPython('_check()');
    if (pyodide.runPython('_HAS_SETUP')) pyodide.runPython('_setup()');
  } catch (e) {
    window.appendConsole(e.message, 'err');
  }
};

async function _bp_restart_after_reset(keepNames) {
  const keep = Array.isArray(keepNames) ? keepNames : Array.from(keepNames || []);
  const snapshot = pyodide.runPython(`{k: globals().get(k) for k in ${JSON.stringify(keep)} if k in globals()}`);
  window._bpResetSnapshot = snapshot;
  pyodide.runPython(`
for _k in list(globals().keys()):
    if _k not in _BP_RESERVED and not _k.startswith('__'):
        del globals()[_k]
`);
  if (window._bpLastUserCode !== undefined) {
    pyodide.runPython('_reset_runtime()');
    if (window._bpLastProgram) _bpInstallTabs(window._bpLastProgram);
    _bpRunT0 = performance.now();
    _bpSetMainSrc(window._bpLastUserCode);
    await pyodide.runPythonAsync(window._bpLastUserCode);
    pyodide.runPython('__bp_restore_keep(js._bpResetSnapshot)');
    pyodide.runPython('_check()');
    if (pyodide.runPython('_HAS_LOOP')) {
      pyodide.runPython('_setup()');
      if (!pyodide.runPython('_all_assets_ready()')) {
        window.appendConsole('Waiting for assets...', 'sys');
        await new Promise(resolve => {
          const poll = () => {
            if (pyodide.runPython('_all_assets_ready()')) resolve();
            else setTimeout(poll, 80);
          };
          poll();
        });
        window.appendConsole('Assets ready.', 'ok');
      }
      lastTs = performance.now();
      rafId = requestAnimationFrame(frame);
      running = true;
      setStatus('Running', 's-run');
    }
  }
}

window._bp_reset_game = function(keepNames) {
  const wasRunning = running;
  stopCode(false);
  running = false;
  (async () => {
    try {
      if (wasRunning) await _bp_restart_after_reset(keepNames);
      else await _bp_restart_after_reset(keepNames);
    } catch (err) {
      window.appendConsole(err.message, 'err');
      setStatus('Ready', 's-ready');
      $runBtn.disabled = false; $stpBtn.disabled = true;
    }
  })();
};

// ══════════════════════════════════════════════════════════════
async function exportFile() {
  const prog = _bpGetProgram();
  const raw  = (document.getElementById('fname').value || 'sketch').trim();
  const slug = raw.replace(/\.bpy$/i, '').replace(/[<>:"/\\|?*]/g, '_') || 'sketch';
  // Embed asset store as a JSON comment block at the top of the file
  let assetBlock = '';
  if (_bpAssets.size > 0) {
    const assetObj = {};
    for (const [name, rec] of _bpAssets) assetObj[name] = rec;
    assetBlock = '# BOWPY_ASSETS: ' + JSON.stringify(assetObj) + '\n';
  }
  // Extra code tabs travel in a second header line (restored by Import, and by include())
  const tabBlock = prog.tabs.length ? '# BOWPY_TABS: ' + JSON.stringify(prog.tabs) + '\n' : '';
  const blob = new Blob([assetBlock + tabBlock + prog.main], { type: 'text/plain' });
  if (window.showSaveFilePicker) {
    try {
      const fh = await window.showSaveFilePicker({
        suggestedName: slug + '.bpy',
        types: [{ description: 'BowPy source', accept: { 'text/plain': ['.bpy', '.py'] } }]
      });
      const ws = await fh.createWritable();
      await ws.write(blob);
      await ws.close();
      window.appendConsole('Saved: ' + fh.name, 'ok');
      return;
    } catch(err) {
      if (err.name === 'AbortError') return;
      // fall through to download fallback
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.bpy';
  a.click();
  URL.revokeObjectURL(a.href);
  window.appendConsole('Saved: ' + slug + '.bpy', 'ok');
}

function importFile() {
  const inp = document.getElementById('file-inp');
  inp.value = '';
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext !== 'bpy' && ext !== 'py') {
      window.appendConsole('Import error: only .bpy and .py files are supported.', 'err');
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      const parsed = _bpSplitHeaders(ev.target.result);   // optional # BOWPY_ASSETS / # BOWPY_TABS header lines
      parsed.errors.forEach(m => window.appendConsole(m, 'err'));
      if (parsed.assets && typeof parsed.assets === 'object') {
        try {
          const recs = [];
          for (const [name, raw] of Object.entries(parsed.assets)) {
            const rec = _normalizeAssetRecord(name, raw);
            if (rec) recs.push([name, rec]);
          }
          if (recs.length) {
            _bpClearAssets();   // the file brings its own assets: the ones in the Assets tab are replaced
            for (const [name, rec] of recs) { _bpAssets.set(name, rec); try { localStorage.setItem('bpa:' + name, JSON.stringify(rec)); } catch(e) {} }
            _renderAssets();
            window.appendConsole('Replaced the assets with the ' + recs.length + ' embedded asset(s) of this file.', 'ok');
          }
        } catch(e) { window.appendConsole('Asset parse error: ' + e.message, 'err'); }
      }
      _setProject(parsed.code, parsed.tabs, MAIN_TAB);
      if (_tabs.length > 1) window.appendConsole('Loaded ' + (_tabs.length - 1) + ' extra tab(s).', 'ok');
      _saveNow();
      switchTab('code');
      const baseName = file.name.replace(/\.(bpy|py)$/i, '');
      document.getElementById('fname').value = baseName;
      try { localStorage.setItem(_LS_NAME, baseName); } catch(e) {}
      window.appendConsole('Loaded: ' + file.name, 'ok');
    };
    reader.readAsText(file);
  };
  inp.click();
}

  "introduction": {
    title: "Introduction",
    category: "Home",
    type: "guide",
    desc: "How BowPy works: the game loop, setup(), update() and the Screen tab.",
    body: `
      <p class="wiki-p">
        Every BowPy program runs in a <b>game loop</b>. After you press Run, BowPy calls your <code>update()</code> function as fast as the browser allows (up to 60 fps by default). If you also define <code>setup()</code>, it is called once before the loop starts.
      </p>

      <h2 class="wiki-h2">Minimal Program</h2>
      <div class="wiki-example">
        <div class="wiki-example-title">Hello BowPy</div>
<pre>
def update():
    clear("black")
    draw_text(40, 40, "Hello, BowPy!", "cyan", 28)
</pre>
      </div>

      <h2 class="wiki-h2">Using setup()</h2>
      <div class="wiki-example">
        <div class="wiki-example-title">One-time initialisation</div>
<pre>
x = 0

def setup():
    global x
    x = W() / 2   # center of screen

def update():
    clear("black")
    draw_circle(x, H() / 2, 40, "lime")
</pre>
      </div>

      <h2 class="wiki-h2">The Screen Tab</h2>
      <p class="wiki-p">
        Drawing calls render to the <b>Screen</b> tab canvas. The canvas matches the browser window size automatically. Use <code>W()</code> and <code>H()</code> to get the current width and height in pixels.
      </p>

      <div class="wiki-note"><b>Note:</b> BowPy switches to the Screen tab automatically when you hit Run. Switch back to Code at any time without stopping the program.</div>

      <div class="wiki-ref-list">
        <div class="wiki-ref" onclick="openWikiPage('W')">W()</div>
        <div class="wiki-ref" onclick="openWikiPage('H')">H()</div>
        <div class="wiki-ref" onclick="openWikiPage('clear')">clear()</div>
        <div class="wiki-ref" onclick="openWikiPage('draw_text')">draw_text()</div>
      </div>
    `
  },

    body: `
      <p class="wiki-p">Use <code>is_mobile()</code> to adapt a program to the device it runs on, for example bigger buttons and text on a phone, or different controls. It works in the editor and in exported (built) HTML games.</p>

      <h2 class="wiki-h2">How It Decides</h2>
      <p class="wiki-p">It returns <code>True</code> for phones and tablets (Android, iPhone, iPad, including iPads that ask for the desktop site) and for touch-first devices whose main input is a finger. Desktops and laptops return <code>False</code>, even when they have a touch screen.</p>

      <div class="wiki-example">
        <div class="wiki-example-title">Pick a UI size for the device</div>
<pre>
def update():
    clear("black")
    size = 28 if is_mobile() else 14
    label = "Mobile device" if is_mobile() else "Desktop"
    draw_text(8, 8, label, "lime", size)
</pre>
      </div>

      <div class="wiki-note"><b>Tip:</b> Phones usually have no physical keyboard, so offer controls that can be tapped. A finger counts as the left mouse button, so <code>mouse_down()</code> and <code>mouse_pos()</code> work for touch.</div>

        <div class="wiki-ref" onclick="openWikiPage('W')">W()</div>

  "write_clipboard_fn": {
    title: "write_clipboard()",
    category: "Utils",
    type: "function",
    desc: "Puts text on the player's clipboard.",
    signature: `<span class="ws-fn">write_clipboard</span><span class="ws-pun">(</span><span class="ws-param">val</span><span class="ws-pun">) →</span> <span class="ws-cls">None</span>`,
    body: `
      <p class="wiki-p">Sets the clipboard of the player to <code>val</code>. Anything that is not text is turned into text with <code>str()</code>, so <code>write_clipboard(42)</code> copies <code>42</code>.</p>
      <table class="wiki-param-table">
        <tr><th>Parameter</th><th>Type</th><th>Description</th></tr>
        <tr><td>val</td><td>any</td><td>The value to copy. It is converted with <code>str()</code>.</td></tr>
      </table>
      <div class="wiki-note"><b>Note:</b> Browsers only allow a page to change the clipboard while the player is interacting with it. If the browser refuses a call that was made from <code>update()</code>, BowPy keeps the text and copies it on the player's next click, tap or key press. <code>read_clipboard()</code> already returns the new text right away.</div>
      <div class="wiki-example">
        <div class="wiki-example-title">Copy the score when the player presses C</div>
<pre>
score = 120

def update():

    signature: `<span class="ws-fn">read_clipboard</span><span class="ws-pun">(</span><span class="ws-pun">) →</span> <span class="ws-cls">str</span>`,
    body: `
      <p class="wiki-p">Returns the clipboard of the player as a string. The result is an empty string when the clipboard is empty, holds something that is not text, or the browser has not allowed the game to read it yet.</p>
      <div class="wiki-note"><b>Note:</b> A browser may ask the player for permission the first time a game reads the clipboard, and it never lets a page wait for the answer. That is why <code>read_clipboard()</code> returns at once with the latest text it knows, and refreshes that text in the background (when the game window gets focus, after a click or key press, and whenever the player pastes with Ctrl+V). Text that was pasted into the game, or put there with <code>write_clipboard()</code>, is always available immediately.</div>

<pre>

    clear("black")
    if key_down("control") and key_pressed("v"):
        text = read_clipboard()
    draw_text(20, 20, "Press Ctrl+V to paste", "gray", 16)
    draw_text(20, 60, text, "yellow", 24)
</pre>
      </div>

        <div class="wiki-ref" onclick="openWikiPage('write_clipboard_fn')">write_clipboard()</div>

  "mix_fn": {
    title: "mix()",
    category: "Math",
    type: "function",
    desc: "Blends two numbers, vectors or colors by a factor t, like GLSL mix().",
    signature: `<span class="ws-fn">mix</span><span class="ws-pun">(</span><span class="ws-param">a</span><span class="ws-pun">, </span><span class="ws-param">b</span><span class="ws-pun">, </span><span class="ws-param">t</span><span class="ws-pun">) →</span> <span class="ws-cls">number | Vec | tuple</span>`,
    body: `
      <p class="wiki-p"><code>mix(a, b, t)</code> returns <code>a</code> when <code>t</code> is 0, <code>b</code> when <code>t</code> is 1, and a blend in between. It is the same function GLSL uses, so it also works the same inside a <code>fragment()</code> shader.</p>
      <table class="wiki-param-table">
        <tr><th>Parameter</th><th>Type</th><th>Description</th></tr>
        <tr><td>a, b</td><td>number, Vec2, Vec3, Vec4, color</td><td>The two values. Both must be of the same kind.</td></tr>
        <tr><td>t</td><td>number</td><td>How far to go from <code>a</code> to <code>b</code>.</td></tr>
      </table>
      <p class="wiki-p"><b>Numbers and vectors</b> are blended component by component. <code>t</code> is not clamped, so values outside 0 to 1 go beyond the range (use <code>clamp(t, 0, 1)</code> first if you do not want that).</p>
      <p class="wiki-p"><b>Colors</b> can be color names (<code>"red"</code>, <code>"#3366ff"</code>), <code>(r, g, b)</code> tuples or <code>(r, g, b, a)</code> tuples. <code>t</code> is clamped to 0 to 1 and the result is a tuple of whole numbers from 0 to 255. If either color has an alpha, the result has one too (a missing alpha counts as 255).</p>
      <div class="wiki-example">
        <div class="wiki-example-title">Heat-map bar</div>
<pre>
def update():
    clear("black")
    for x in range(W()):
        c = mix("blue", "red", x / W())
        draw_line(x, H() / 2 - 20, x, H() / 2 + 20, c)
</pre>

      <div class="wiki-example">
        <div class="wiki-example-title">Numbers and vectors</div>
<pre>
a = Vec2(0, 0)
b = Vec2(100, 40)
print(mix(0, 10, 0.25))     # 2.5
print(mix(a, b, 0.5))       # Vec2(50.0, 20.0)
</pre>
      </div>

      </div>
    `

    title: "draw_text()",
    category: "Graphics",

    desc: "Renders a text string on the canvas at (x, y) with the given color, size and font. Supports multi-line text, italic style, and tilted rendering.",
    signature: `<span class="ws-fn">draw_text</span><span class="ws-pun">(</span><span class="ws-param">x</span><span class="ws-pun">, </span><span class="ws-param">y</span><span class="ws-pun">, </span><span class="ws-param">text</span><span class="ws-pun">, </span><span class="ws-param">color</span><span class="ws-pun">=WHITE, </span><span class="ws-param">size</span><span class="ws-pun">=</span><span class="ws-lit">16</span><span class="ws-pun">, </span><span class="ws-param">font</span><span class="ws-pun">=</span><span class="ws-str">'monospace'</span><span class="ws-pun">, *, </span><span class="ws-param">align</span><span class="ws-pun">=</span><span class="ws-str">'left'</span><span class="ws-pun">, </span><span class="ws-param">baseline</span><span class="ws-pun">=</span><span class="ws-str">'top'</span><span class="ws-pun">, </span><span class="ws-param">stroke</span><span class="ws-pun">=</span><span class="ws-kw">None</span><span class="ws-pun">, </span><span class="ws-param">stroke_width</span><span class="ws-pun">=</span><span class="ws-lit">2</span><span class="ws-pun">, </span><span class="ws-param">angle</span><span class="ws-pun">=</span><span class="ws-lit">0</span><span class="ws-pun">, </span><span class="ws-param">italic</span><span class="ws-pun">=</span><span class="ws-kw">False</span><span class="ws-pun">, </span><span class="ws-param">line_spacing</span><span class="ws-pun">=</span><span class="ws-lit">1.2</span><span class="ws-pun">)</span>`,
    body: `
      <table class="wiki-param-table">
        <tr><th>Parameter</th><th>Type</th><th>Description</th></tr>
        <tr><td>align</td><td>str</td><td>'left', 'center', or 'right' — horizontal anchor.</td></tr>
        <tr><td>baseline</td><td>str</td><td>'top', 'middle', or 'bottom' — vertical anchor. For multi-line text this anchors the whole block.</td></tr>
        <tr><td>stroke</td><td>color</td><td>Outline color. None = no outline.</td></tr>
        <tr><td>stroke_width</td><td>int</td><td>Outline thickness when stroke is set.</td></tr>
        <tr><td>angle</td><td>float</td><td>Rotation in degrees around the anchor point (x, y). Positive = clockwise.</td></tr>
        <tr><td>italic</td><td>bool</td><td>Render text in italic style.</td></tr>
        <tr><td>line_spacing</td><td>float</td><td>Line height multiplier for multi-line text. Default 1.2.</td></tr>
      </table>

      <h2 class="wiki-h2">Multi-line text</h2>
      <p class="wiki-p">Embed <code>\\n</code> in the string to create line breaks. The <code>baseline</code> parameter anchors the whole block — <code>'top'</code> anchors the first line, <code>'middle'</code> centers the block, <code>'bottom'</code> anchors the last line. Use <code>line_spacing</code> to tighten or loosen the lines.</p>

      <div class="wiki-example">
        <div class="wiki-example-title">Multi-line label</div>
<pre>
def update():
    clear("black")
    draw_text(W()/2, H()/2, "Hello\\nWorld!", "cyan", 32,
              align="center", baseline="middle")
</pre>
      </div>

      <h2 class="wiki-h2">Tilted text</h2>
      <p class="wiki-p">The <code>angle</code> parameter rotates the text around the anchor point <code>(x, y)</code>, measured in degrees clockwise.</p>

      <div class="wiki-example">
        <div class="wiki-example-title">Diagonal label</div>
<pre>
def update():
    clear("black")
    draw_text(W()/2, H()/2, "ROTATED", "lime", 28,
              align="center", baseline="middle", angle=45)
</pre>
      </div>

      <h2 class="wiki-h2">Italic text</h2>
      <p class="wiki-p">Set <code>italic=True</code> to render the text in the italic variant of the chosen font.</p>

      <div class="wiki-example">
        <div class="wiki-example-title">Italic quote with outline</div>
<pre>
def update():
    clear("black")
    draw_text(W()/2, 60, "BowPy!", "cyan", 48,
              align="center", baseline="middle",
              stroke="black", stroke_width=3,
              italic=True, angle=-10)
</pre>
      </div>

      <div class="wiki-ref-list">
        <div class="wiki-ref" onclick="openWikiPage('measure_text')">measure_text()</div>
      </div>
    `

    signature: `<span class="ws-fn">get_pixel</span><span class="ws-pun">(</span><span class="ws-param">x</span><span class="ws-pun">, </span><span class="ws-param">y</span><span class="ws-pun">) →</span> <span class="ws-cls">tuple[int, int, int, int]</span><br><span class="ws-fn">get_pixel</span><span class="ws-pun">(</span><span class="ws-param">pos</span><span class="ws-pun">) →</span> <span class="ws-cls">Vec4</span>`,
    body: `
      <p class="wiki-p"><code>get_pixel(x, y)</code> reads the pixel at the pixel position <code>x, y</code> (0 is the top-left). <code>get_pixel(pos)</code> reads at a position from 0 to 1 - <code>(0, 0)</code> is the top-left corner and <code>(1, 1)</code> the bottom-right - and blends the pixels around it, exactly like a GPU texture read. It is the form to use inside <code>fragment(pos)</code>, where it is a single fast texture read.</p>

      <div class="wiki-note"><b>Performance:</b> The first read after something was drawn asks the GPU for that one pixel. Further reads of the same picture are answered from a copy, so a loop over many pixels is fast as long as nothing is drawn in between. For work on every pixel use <code>fragment()</code>, which does it on the GPU.</div>
      <div class="wiki-note">Reading outside <code>update()</code>'s picture is never affected by <code>fragment()</code>: you always read what the program drew, not what the shader shows.</div>

      <div class="wiki-example">
        <div class="wiki-example-title">Sample a pixel under the mouse</div>
<pre>
def update():
    clear(rgb(30, 60, 120))
    draw_circle(W()/2, H()/2, 60, "orange")
    r, g, b, a = get_pixel(mouse_x(), mouse_y())
    draw_text(8, 8, f"R:{r} G:{g} B:{b}", "white", 14)
</pre>

<pre>
def update():

    c = get_pixel(Vec2(0.5, 0.5))      # the middle of the screen
    draw_text(8, 8, f"{c.r:.2f} {c.g:.2f} {c.b:.2f} {c.a:.2f}", "white", 14)
</pre>

  "fragment_fn": {
    title: "fragment()",
    category: "Graphics",
    type: "function",
    desc: "Define fragment(pos) to shade every pixel of the screen on the GPU. pos is a Vec2 from 0 to 1 and the function returns the colour of that pixel.",
    signature: `<span class="ws-kw">def</span> <span class="ws-fn">fragment</span><span class="ws-pun">(</span><span class="ws-param">pos</span><span class="ws-pun">) →</span> <span class="ws-cls">Vec3 | Vec4 | tuple | float</span>`,
    body: `
      <p class="wiki-p"><code>fragment(pos)</code> is a function <b>you define</b>. After <code>update()</code> has drawn the frame, BowPy calls it for every pixel of the screen and shows the colours it returns. <code>pos</code> is a <code>Vec2</code> from 0 to 1: <code>(0, 0)</code> is the top-left corner and <code>(1, 1)</code> the bottom-right. <code>get_pixel(pos)</code> gives the colour that was drawn at a position, as a <code>Vec4</code>.</p>

      <p class="wiki-p">The default shader leaves the picture as it is:</p>
<pre>
def fragment(pos):
    return get_pixel(pos)
</pre>

      <p class="wiki-p">BowPy turns your function into a GPU program, so it runs for all pixels at the same time. A shader that does a few hundred operations per pixel still runs at full speed. The picture that your program drew is not changed: <code>get_pixel()</code> inside <code>update()</code> still reads the picture without the shader.</p>

      <h2 class="wiki-h2">What to return</h2>
      <div class="wiki-members">
        <div class="wiki-member"><div class="wiki-member-name">Vec3(r, g, b)  or  (r, g, b)</div><div class="wiki-member-desc">An opaque colour.</div></div>
        <div class="wiki-member"><div class="wiki-member-name">Vec4(r, g, b, a)  or  (r, g, b, a)</div><div class="wiki-member-desc">A colour with transparency. Use <code>get_pixel(pos)</code> as it is to keep the picture's own alpha.</div></div>
        <div class="wiki-member"><div class="wiki-member-name">a number</div><div class="wiki-member-desc">A grey level (0 is black, 1 is white).</div></div>
      </div>
      <p class="wiki-p">Every value goes from 0 to 1 and is clamped to that range. Different returns in different branches are fine (a Vec3 in one place and a Vec4 in another).</p>

      <h2 class="wiki-h2">Examples</h2>
      <div class="wiki-example">
        <div class="wiki-example-title">Vignette</div>
<pre>
def update():
    clear(rgb(30, 60, 120))
    draw_circle(W()/2, H()/2, 80, "orange")

def fragment(pos):
    c = get_pixel(pos)
    d = Vec2.distance(pos, Vec2(0.5, 0.5)) * 1.4
    f = clamp(1.0 - d, 0, 1)
    return Vec3(c.r * f, c.g * f, c.b * f)
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Invert the part of the screen left of the mouse</div>
<pre>
def update():
    clear(rgb(30, 60, 120))
    draw_circle(W()/2, H()/2, 80, "orange")

def fragment(pos):
    c = get_pixel(pos)
    if pos.x * W() < mouse_x():
        return Vec3(1 - c.r, 1 - c.g, 1 - c.b)
    return c
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Waves (global variables are read again every frame)</div>
<pre>
amount = 0.01

def update():
    global amount
    amount = 0.005 + 0.01 * abs(sin(get_time()))
    clear(rgb(30, 60, 120))
    draw_text(40, H()/2, "BowPy", "white", 64)

def fragment(pos):
    wave = sin(pos.y * 40 + get_time() * 3) * amount
    return get_pixel(pos + Vec2(wave, 0))
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Pixelate, with a helper function</div>
<pre>
blocks = 48

def update():
    clear(rgb(30, 60, 120))
    draw_circle(W()/2, H()/2, 80, "orange")

def snap(p):
    return Vec2(floor(p.x * blocks) / blocks, floor(p.y * blocks) / blocks)

def fragment(pos):
    return get_pixel(snap(pos) + Vec2(0.5 / blocks, 0.5 / blocks))
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">A program with only a shader (no update needed)</div>
<pre>
def fragment(pos):
    t = get_time()
    v = sin(pos.x * 10 + t) + sin(pos.y * 10 + t * 1.3) + sin((pos.x + pos.y) * 10 + t * 0.7)
    return Vec3(0.5 + 0.5 * sin(v), 0.5 + 0.5 * sin(v + 2), 0.5 + 0.5 * sin(v + 4))
</pre>
      </div>

      <h2 class="wiki-h2">What a shader can use</h2>
      <ul class="wiki-list">
        <li>Numbers, <code>True</code>/<code>False</code>, <code>Vec2</code>, <code>Vec3</code>, <code>Vec4</code> and tuples of 2 to 4 numbers. Swizzles can be read: <code>c.rgb</code>, <code>p.xy</code>, <code>v.zyx</code>.</li>
        <li><code>+ - * / // % **</code>, comparisons of numbers, <code>and</code> / <code>or</code> / <code>not</code>, <code>a if c else b</code>.</li>
        <li><code>if</code> / <code>elif</code> / <code>else</code>, <code>for i in range(...)</code>, <code>for x in a_global_list</code>, <code>while</code> (stopped after 1024 turns), <code>break</code>, <code>continue</code>.</li>
        <li>Your own functions, also from other tabs (<code>utils.warp(pos)</code>). They can be called with different kinds of values; recursion is not possible.</li>
        <li>Math: <code>sin cos tan asin acos atan atan2 sqrt exp log pow abs min max floor ceil round fract sign hypot radians degrees</code>, <code>lerp clamp map_range smoothstep step smooth_step</code>, <code>dot cross length distance normalize</code> and <code>noise()</code>, <code>noise1/2/3()</code>, the Vec methods (<code>.length()</code>, <code>.normalized()</code>, <code>.rotated()</code>, <code>Vec2.distance()</code> ...).</li>
        <li><code>get_pixel(pos)</code>, <code>get_time()</code> (seconds since the program started), <code>dt()</code>, <code>fps()</code>, <code>W()</code>, <code>H()</code>, <code>mouse_x()</code>, <code>mouse_y()</code>, <code>mouse_pos()</code>, <code>mouse_down()</code> (the button has to be written as 0, 1 or 2) and <code>is_mobile()</code>.</li>
        <li>Global variables: numbers, booleans, Vec2/Vec3/Vec4, tuples and lists of those (up to 192 values together). They are sent to the GPU every frame as they are at the end of <code>update()</code>. On the GPU numbers have about 7 digits of precision: pass big values such as <code>time.time()</code> as a difference or use <code>get_time()</code> inside the shader.</li>
      </ul>
      <div class="wiki-note"><b>Not possible in a shader:</b> <code>random</code>, text, dictionaries, classes, <code>lambda</code>, <code>print</code>, imports, comparing whole vectors or lists, and assigning several components at once (<code>v.xy = ...</code>; write <code>v.x = ...</code> and <code>v.y = ...</code>).</div>

      <h2 class="wiki-h2">When the shader cannot run on the GPU</h2>
      <p class="wiki-p">If the shader uses something from the list above, or the browser has no WebGL2, BowPy prints a warning that says what and where, and runs your function on the CPU instead. That gives the same picture but it is very slow (the whole screen is calculated in Python every frame), so fix the shader if you see the warning. Mistakes in the shader (a wrong name, a wrong kind of value) are reported the same way, with the file and line.</p>

      <div class="wiki-note"><b>Changed:</b> the older <code>fragment(fn)</code> that was called with a function and received <code>r, g, b, pos</code> has been replaced by this one. To port it, write <code>def fragment(pos): c = get_pixel(pos)</code> and use <code>c.r</code>, <code>c.g</code>, <code>c.b</code> where it used <code>r</code>, <code>g</code>, <code>b</code>.</div>

        <div class="wiki-ref" onclick="openWikiPage('vec4_overview')">Vec4</div>
      </div>
    `
  },

    for x, y, alive in grid.items():

  "key_recorder_overview": {
    title: "Key Recorder Overview",
    category: "Key Recorder",
    type: "class",
    desc: "KeyRecorder captures typed characters into an internal string cache, with full control over event timing, case sensitivity, allowed characters and focus blocking.",
    body: `
      <p class="wiki-p">
        A <code>KeyRecorder</code> is a managed object that accumulates typed text every frame. Create one, call <code>record()</code> to start capturing, and read <code>.text</code> at any time. Multiple recorders can coexist.
      </p>

      <div class="wiki-members">
        <div class="wiki-member" onclick="openWikiPage('key_recorder_class')"><div class="wiki-member-name">KeyRecorder()</div><div class="wiki-member-desc">Create a new recorder with configurable parameters.</div></div>
        <div class="wiki-member" onclick="openWikiPage('key_recorder_record')"><div class="wiki-member-name">.record()</div><div class="wiki-member-desc">Start capturing typed keys.</div></div>
        <div class="wiki-member" onclick="openWikiPage('key_recorder_stop')"><div class="wiki-member-name">.stop()</div><div class="wiki-member-desc">Stop capturing; cache is preserved.</div></div>
        <div class="wiki-member" onclick="openWikiPage('key_recorder_clear')"><div class="wiki-member-name">.clear()</div><div class="wiki-member-desc">Erase the cache string.</div></div>
      </div>

      <h2 class="wiki-h2">How It Works</h2>
      <p class="wiki-p">
        Recorders register themselves on construction and are ticked automatically by the game loop on every frame — exactly like <code>Timer</code>. You never need to call a tick or update method manually.
      </p>
      <p class="wiki-p">
        Each frame the recorder inspects the appropriate key set (<code>keys_held</code>, <code>keys_pressed</code>, or <code>keys_released</code>, depending on the <code>event</code> parameter) and appends any qualifying single printable characters to its cache. The <code>allow</code>, <code>max_length</code>, <code>case_sensitive</code>, and <code>multiline</code> parameters control what gets appended.
      </p>

      <div class="wiki-example">
        <div class="wiki-example-title">Simple text-entry field</div>
<pre>
rec = KeyRecorder(multiline=False)
rec.record()

def update():
    clear("black")
    draw_text(20, H()/2, "Type: " + rec.text + "|", "white", 20)
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Name entry with max length and focus blocking</div>
<pre>
name_box = KeyRecorder(focus=True, max_length=12)
name_box.record()

def update():
    clear("black")
    draw_text(W()/2, H()/2 - 20, "Enter your name:", "cyan", 18, align="center")
    draw_text(W()/2, H()/2 + 14, name_box.text + "_", "white", 24, align="center")
    if key_pressed("enter"):       # still works even with focus=True
        name_box.stop()
        print("Hello,", name_box.text)
</pre>
      </div>

      <div class="wiki-note"><b>Note:</b> Only printable single-character keys are captured. Control keys like <code>Escape</code>, <code>Tab</code>, <code>Backspace</code>, arrow keys and function keys are ignored (except <code>Enter</code> when <code>multiline=True</code>). Handle backspace manually if needed.</div>
    `
  },

  "key_recorder_class": {
    title: "KeyRecorder()",
    category: "Key Recorder",
    type: "class",
    desc: "Creates a new KeyRecorder that automatically captures typed characters each frame once record() is called.",

    body: `
      <table class="wiki-param-table">
        <tr><th>Parameter</th><th>Type</th><th>Description</th></tr>
        <tr>
          <td>focus</td><td>bool</td>
          <td>When <code>True</code> and the recorder is active, <code>key_down()</code>, <code>key_pressed()</code> and <code>key_released()</code> all return <code>False</code> — blocking other input actions from triggering while the recorder is capturing. Defaults to <code>False</code>.</td>
        </tr>
        <tr>
          <td>event</td><td>str</td>
          <td>
            Determines when keys are detected:<br>
            <code>"pressed"</code>  – once, on the frame the key is first pressed (default).<br>
            <code>"released"</code> – once, on the frame the key is released.<br>
            <code>"frame"</code>    – every frame the key is held down; holding "a" for 3 frames appends "a" three times.
          </td>
        </tr>
        <tr>
          <td>case_sensitive</td><td>bool</td>
          <td>When <code>True</code> (default), letter case follows the current Shift / CapsLock state. When <code>False</code>, all letters are stored as uppercase.</td>
        </tr>
        <tr>
          <td>allow</td><td>str | None</td>
          <td>A string listing every character the recorder is permitted to store. Characters not present in this string are silently ignored. <code>None</code> (default) accepts all printable characters.</td>
        </tr>
        <tr>
          <td>max_length</td><td>int</td>
          <td>The recorder stops appending once <code>len(rec.text) == max_length</code>. Any negative value (default <code>-1</code>) means no limit.</td>
        </tr>
        <tr>
          <td>multiline</td><td>bool</td>
          <td>When <code>True</code>, pressing Enter appends a newline character (<code>"\\n"</code>) to the cache. Defaults to <code>False</code>.</td>
        </tr>
      </table>

        <tr><th>Property</th><th>Type</th><th>Description</th></tr>
        <tr><td>.text</td><td>str</td><td>The current accumulated text string.</td></tr>
        <tr><td>.recording</td><td>bool</td><td>True while the recorder is actively capturing.</td></tr>

    draw_text(W()/2, H()/2, "PIN: " + pin.text, "lime", 28, align="center")
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Auto-repeat "frame" event for held keys</div>
<pre>

buf.record()

def update():
    clear("black")
    # Shows each letter accumulating at held-key speed
    draw_text(20, 40, buf.text[-80:], "cyan", 16)
</pre>
      </div>

        <div class="wiki-ref" onclick="openWikiPage('key_recorder_clear')">.clear()</div>
      </div>
    `
  },

    clear("black")
    if key_pressed("enter") and chat.text.strip():
        messages.append(chat.text)
        chat.clear()   # wipe cache, keep recording

    clear("black")
    if key_pressed("backspace"):
        rec._cache = rec.text[:-1]   # remove last character

    signature: `<span class="ws-fn">to_json</span><span class="ws-pun">(</span><span class="ws-param">data</span><span class="ws-pun">, *, </span><span class="ws-param">indent</span><span class="ws-pun">=</span><span class="ws-lit">None</span><span class="ws-pun">) →</span> <span class="ws-cls">str</span>`,
    body: `
      <p class="wiki-p">The inverse of <code>read_json()</code>. Pass any JSON-serialisable Python value — dict, list, int, float, str, bool, or <code>None</code> — and get back a JSON string ready to be stored with <code>write()</code>.</p>

      <h2 class="wiki-h2">Parameters</h2>
      <table class="wiki-param-table">
        <tr><th>Name</th><th>Type</th><th>Description</th></tr>
        <tr><td>data</td><td>dict | list | ...</td><td>Any JSON-serialisable Python value.</td></tr>
        <tr><td>indent</td><td>int | None</td><td>When set to an integer, the output is pretty-printed with that many spaces per indentation level. Defaults to <code>None</code> (compact single-line output).</td></tr>
      </table>

      <div class="wiki-example">
        <div class="wiki-example-title">Save player state to a JSON file</div>
<pre>
score = 0
pos = {"x": 100, "y": 200}

def save_game():
    data = {"score": score, "pos": pos}
    erase("save.json")
    write("save.json", to_json(data))

def load_game():

  "libraries_overview": {
    title: "Libraries Overview",
    category: "Libraries",
    type: "guide",
    desc: "Use include() to run imported .bpy or .py files, sharing their functions and variables with your program.",
    body: `
      <p class="wiki-p">BowPy lets you split your code across multiple files. Upload a <code>.bpy</code> or <code>.py</code> library file in the Assets tab, then call <code>include()</code> from your main program to load it.</p>

      <div class="wiki-members">
        <div class="wiki-member" onclick="openWikiPage('include_fn')"><div class="wiki-member-name">include()</div><div class="wiki-member-desc">Execute a .bpy/.py file and import its globals.</div></div>
        <div class="wiki-member" onclick="openWikiPage('tabs_guide')"><div class="wiki-member-name">Code Tabs</div><div class="wiki-member-desc">Split your program across tabs and use them as name.function.</div></div>
      </div>

      <h2 class="wiki-h2">How It Works</h2>
      <p class="wiki-p">
        <code>include()</code> parses the file, strips its <code>setup()</code> and <code>update()</code> definitions (only the host file's lifecycle hooks are used), and executes the rest in your global namespace. Assets embedded inside the library (images, sounds, other libraries) are registered automatically so nested <code>include()</code> calls and <code>Image()</code>/<code>Sound()</code> calls inside the file all work correctly.
      </p>

      <div class="wiki-note"><b>Tip:</b> Libraries are a great way to share reusable utilities — physics engines, UI kits, procedural generators — across multiple BowPy projects.</div>
    `
  },

  "include_fn": {
    title: "include()",
    category: "Libraries",
    type: "function",
    desc: "Executes a .bpy or .py file from the Assets tab in the current global namespace, importing all its definitions.",
    signature: `<span class="ws-fn">include</span><span class="ws-pun">(</span><span class="ws-param">name</span><span class="ws-pun">: str)</span>`,
    body: `
      <p class="wiki-p">The file must exist in the Assets tab before you run your program. Only <code>.bpy</code> and <code>.py</code> type assets are accepted (not images or sounds).</p>

      <h2 class="wiki-h2">What Gets Imported</h2>
      <p class="wiki-p">All top-level variables, classes and functions defined in the library become available globally. The library's <code>setup()</code> and <code>update()</code> functions are silently stripped — only your main file's lifecycle hooks run.</p>

      <h2 class="wiki-h2">Nested Includes</h2>
      <p class="wiki-p">A library can call <code>include()</code> itself. Any assets it embeds (images, sounds) are registered in the same pass, so they are available immediately.</p>

      <div class="wiki-example">
        <div class="wiki-example-title">Using a math utility library</div>
<pre>
# utils.bpy (in Assets tab):
# def ease_bounce(t):
#     if t < 0.5:
#         return 8 * t**4
#     return 1 - 8*(t-1)**4

include("utils.bpy")

t = 0.0

def update():
    global t
    clear("black")
    t = fract(get_time() * 0.5)
    y = lerp(50, H() - 50, ease_bounce(t))
    draw_circle(W() / 2, y, 20, "lime")
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">Loading a spritesheet helper</div>
<pre>
include("spritesheet.bpy")   # defines SpriteSheet class

sheet = SpriteSheet("tiles.png", 16, 16)

def update():
    clear("black")
    sheet.draw(2, 3, 100, 100)   # draw tile at column 2, row 3
</pre>
      </div>

      <div class="wiki-note"><b>Note:</b> <code>include()</code> raises <code>FileNotFoundError</code> if the asset is missing and <code>TypeError</code> if the asset is not a <code>.bpy</code> or <code>.py</code> file.</div>
    `
  },

  "tabs_guide": {
    title: "Code Tabs",
    category: "Libraries",
    type: "guide",
    desc: "Split your program across several tabs. Every tab except main.bpy works like a module: use it as tab_name.function_or_variable.",
    body: `
      <p class="wiki-p">The Code view starts with a single tab, <code>main.bpy</code>. This is your program: its <code>setup()</code> and <code>update()</code> are the ones BowPy runs. Press the <b>+</b> at the end of the tab bar to add another tab, then type its name and press Enter.</p>

      <h2 class="wiki-h2">Using Another Tab</h2>
      <p class="wiki-p">A tab named <code>utils.bpy</code> is available in every other tab as <code>utils</code>. Reach anything inside it with <code>utils.</code> followed by the function or variable name.</p>

      <div class="wiki-example">
        <div class="wiki-example-title">In the utils tab</div>
<pre>
GRAVITY = 0.5

def draw_label(x, y, text):
    draw_text(x, y, text, "white", 16)
</pre>
      </div>

      <div class="wiki-example">
        <div class="wiki-example-title">In the main tab</div>
<pre>
def update():
    clear("black")
    utils.draw_label(20, 20, "Gravity: " + str(utils.GRAVITY))
</pre>
      </div>

      <p class="wiki-p">Normal Python imports work too: <code>import utils</code> and <code>from utils import draw_label</code>.</p>

      <h2 class="wiki-h2">Naming Rules</h2>
      <p class="wiki-p">The <code>.bpy</code> ending is added for you. A tab name is rejected when:</p>
      <table class="wiki-param-table">
        <tr><th>Example</th><th>Problem</th><th>Why</th></tr>
        <tr><td>main</td><td>reserved</td><td>The <code>main.bpy</code> tab already exists and is your program.</td></tr>
        <tr><td>Utils</td><td>duplicate</td><td>Names must be unique, and upper and lower case count as the same (so <code>Utils</code> clashes with <code>utils</code>).</td></tr>
        <tr><td>my tab, 1st, a-b</td><td>invalid</td><td>The name is used as <code>name.function</code>, so it must be a valid Python name: letters, digits and <code>_</code>, not starting with a digit.</td></tr>
        <tr><td>class, math, draw_rect</td><td>taken</td><td>Python keywords, and names that Python or BowPy already use, cannot be reused because the tab would replace them.</td></tr>
      </table>
      <p class="wiki-p">Double-click a tab to rename it, and use its <b>×</b> to delete it. Renaming does not update the <code>name.</code> references in your code.</p>

      <h2 class="wiki-h2">How Tabs Run</h2>
      <p class="wiki-p">Each tab runs once, from top to bottom, when you press Run and before <code>main.bpy</code> starts. The order of the tabs does not matter: if one tab uses another at the top level, the other one is run first.</p>
      <p class="wiki-p">A tab can use the whole BowPy API (<code>draw_rect()</code>, <code>Image()</code>, <code>Vec2</code> and so on) and can use the other tabs, but it cannot see the variables of <code>main.bpy</code>. Pass values in as arguments, or keep shared values in a tab (<code>utils.score = 10</code>). A <code>setup()</code> or <code>update()</code> inside another tab is just a normal function: call it yourself, for example <code>enemy.update()</code>.</p>

      <h2 class="wiki-h2">Export and Build</h2>
      <p class="wiki-p">Export saves every tab inside the <code>.bpy</code> file, and Import brings them all back. Build embeds every tab in the finished HTML game. If you <code>include()</code> a file that was exported with tabs, its tabs become available as modules too (a tab is skipped if one with the same name already exists).</p>

      <div class="wiki-ref-list">
        <div class="wiki-ref" onclick="openWikiPage('include_fn')">include()</div>
        <div class="wiki-ref" onclick="openWikiPage('libraries_overview')">Libraries Overview</div>
      </div>
    `
  }

};

function buildWikiNav() {
  const nav = document.getElementById('wiki-nav');
  if (!nav) return;

  const groups = {};
  for (const [id, page] of Object.entries(WIKI_DOCS)) {
    if (!groups[page.category]) groups[page.category] = [];
    groups[page.category].push([id, page]);
  }

  nav.innerHTML = '';

  for (const [category, pages] of Object.entries(groups)) {
    const grp = document.createElement('div');
    grp.className = 'wiki-nav-group';

    const title = document.createElement('div');
    title.className = 'wiki-nav-group-title';
    title.textContent = category;

    grp.appendChild(title);

    for (const [id, page] of pages) {
      const item = document.createElement('div');
      item.className = 'wiki-nav-item';
      item.innerHTML = '<span class="wni-icon"></span><span>' + page.title + '</span>';
      item.onclick = () => openWikiPage(id);
      item.dataset.page = id;
      grp.appendChild(item);
    }

    nav.appendChild(grp);
  }
}

function openWikiPage(id) {
  const page = WIKI_DOCS[id];
  if (!page) return;

  document.querySelectorAll('.wiki-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === id);
  });

  const bc = document.getElementById('wiki-breadcrumb');
  bc.innerHTML = '<span class="wiki-bc-seg" onclick="openWikiPage(\'home\')">Wiki</span><span class="wiki-bc-sep">›</span><span>' + page.category + '</span>';

  const body = document.getElementById('wiki-body');

  let tagClass = 'wiki-tag-function';
  if (page.type === 'class') tagClass = 'wiki-tag-class';
  if (page.type === 'guide') tagClass = 'wiki-tag-guide';
  if (page.type === 'method') tagClass = 'wiki-tag-method';
  if (page.type === 'example') tagClass = 'wiki-tag-example';

  body.innerHTML =
    '<div class="wiki-tag ' + tagClass + '">' + page.type + '</div>' +
    '<div class="wiki-h1">' + page.title + '</div>' +
    '<div class="wiki-desc">' + page.desc + '</div>' +
    (page.signature ? '<div class="wiki-sig">' + page.signature + '</div>' : '') +
    page.body;
}

function wikiSearch(query) {
  query = String(query || '').toLowerCase().trim();
  const box = document.getElementById('wiki-search-results');

  if (!query) {
    box.style.display = 'none';
    return;
  }

  const matches = Object.entries(WIKI_DOCS).filter(([id, page]) =>
    page.title.toLowerCase().includes(query) ||
    page.desc.toLowerCase().includes(query)
  );

  box.innerHTML = '';

  for (const [id, page] of matches.slice(0, 8)) {
    const item = document.createElement('div');
    item.className = 'wiki-sr-item';
    item.innerHTML = '<strong>' + page.title + '</strong><span class="wiki-sr-cat">' + page.category + '</span>';
    item.onclick = () => {
      openWikiPage(id);
      box.style.display = 'none';
    };
    box.appendChild(item);
  }

  box.style.display = matches.length ? 'block' : 'none';
}

buildWikiNav();
openWikiPage('home');

// the CSS variables that depend on the choices (theme and the user's own colours, fonts, sizes)
function _bpSettingsVars() {
  const vars = _bpResolveTheme(_bpSet);
  const fc = _bpSet.fontCode === 'custom'
    ? (_bpSet.fontCodeCustom.trim() ? _bpSet.fontCodeCustom.trim().replace(/[;{}<>]/g, '') + ', monospace' : _SET_FONTS_CODE.plex.css)
    : _SET_FONTS_CODE[_bpSet.fontCode].css;
  vars['--font-code'] = fc;
  vars['--font-ui'] = _SET_FONTS_UI[_bpSet.fontUi].css;
  vars['--ed-fs'] = _bpSet.fontSize + 'px';
  vars['--ed-lh'] = Math.round(_bpSet.fontSize * _bpSet.lineHeight) + 'px';
  vars['--tab-size'] = String(_bpSet.tabSize);
  vars['--con-fs'] = _bpSet.conFontSize + 'px';
  return vars;
}
function _bpApplyVars() {
  const root = document.documentElement.style, vars = _bpSettingsVars();
  for (const k in vars) root.setProperty(k, vars[k]);
  try { localStorage.setItem(_SET_THEME_KEY, JSON.stringify(vars)); } catch (e) {}
}
function _bpApplySettings() {
  _bpApplyVars();
  document.body.classList.toggle('no-lnums', !_bpSet.lineNumbers);
  syncEditor();                                   // syntax colouring, tab width and line height of the code
  _HV.setEnabled(_bpSet.tooltips);
  _HV.setDelay(_bpSet.tooltipDelay);
  _HV.resetMetrics();
  _setRenderPreview();
}

function _setRenderPreview() {
  const ln = document.getElementById('set-prev-ln'), code = document.getElementById('set-prev-code');
  if (!ln || !code) return;
  const n = _SET_PREVIEW.split('\n').length;
  let t = '';
  for (let i = 1; i <= n; i++) t += i + '\n';
  ln.textContent = t;
  code.innerHTML = _bpSet.syntax ? highlight(_SET_PREVIEW + ' ').replace(/\n$/, '') : esc(_SET_PREVIEW);
}

const _setUI = { rows: {}, themeBtns: {}, pickers: {}, ctl: {} };
function _setEl(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// every change of a choice goes through here: remember it, show it, keep the controls in step
function _setChange(key, value) {

}
function _setResetAll() {
  for (const k of Object.keys(_bpSet)) delete _bpSet[k];

function _setRow(card, key, name, hint, ctl) {
  const row = _setEl('div', 'set-row');
  const lab = _setEl('div', 'set-lab');
  lab.appendChild(_setEl('div', 'set-name', name));
  if (hint) lab.appendChild(_setEl('div', 'set-hint', hint));
  const c = _setEl('div', 'set-ctl');
  (Array.isArray(ctl) ? ctl : [ctl]).forEach(x => c.appendChild(x));
  row.appendChild(lab); row.appendChild(c);
  row.dataset.key = key;
  card.appendChild(row);
  _setUI.rows[key] = row;

}
function _setToggle(key) {
  const w = _setEl('label', 'set-switch'), i = _setEl('input'), s = _setEl('span');
  i.type = 'checkbox'; i.id = 'set-' + key;
  i.onchange = () => _setChange(key, i.checked);

}
function _setRange(key, min, max, step, fmt) {
  const i = _setEl('input'), v = _setEl('span', 'set-val');
  i.type = 'range'; i.min = min; i.max = max; i.step = step; i.id = 'set-' + key;
  i.oninput = () => { v.textContent = fmt(Number(i.value)); _setChange(key, Number(i.value)); };
  _setUI.ctl[key] = i; i._val = v; i._fmt = fmt;
  return [i, v];
}
function _setNumber(key, min, max) {
  const i = _setEl('input', 'set-input');
  i.type = 'number'; i.min = min; i.max = max; i.step = 1; i.id = 'set-' + key;
  i.onchange = () => { const n = Math.round(_setClampNum(i.value, min, max, _SET_DEFAULTS[key])); i.value = n; _setChange(key, n); };
  _setUI.ctl[key] = i;

}
function _setSelect(key, opts) {

  s.onchange = () => _setChange(key, s.value);

}

function _setBuildUI() {

  const ht = _setEl('div', 'set-head-txt');
  ht.appendChild(_setEl('div', 'set-title', 'Settings'));
  ht.appendChild(_setEl('div', 'set-sub', 'Changes apply at once and are saved in this browser.'));
  const reset = _setEl('button', 'set-btn', 'Reset all settings');
  reset.id = 'set-reset-all';
  let armTimer = 0;
  reset.onclick = () => {
    if (!reset.classList.contains('armed')) {
      reset.classList.add('armed'); reset.textContent = 'Click again to reset everything';
      armTimer = setTimeout(() => { reset.classList.remove('armed'); reset.textContent = 'Reset all settings'; }, 3500);
      return;
    }
    clearTimeout(armTimer); reset.classList.remove('armed'); reset.textContent = 'Reset all settings';
    _setResetAll();
  };
  head.appendChild(ht); head.appendChild(reset);
  page.appendChild(head);

  const cols = _setEl('div', 'set-cols'), main = _setEl('div', 'set-main'), side = _setEl('div', 'set-side');
  cols.appendChild(main); cols.appendChild(side); page.appendChild(cols);

  const card = (title, extra) => {
    const c = _setEl('div', 'set-card'), h = _setEl('div', 'set-card-h');
    h.appendChild(_setEl('span', 'set-grow', title));
    if (extra) h.appendChild(extra);
    c.appendChild(h); main.appendChild(c);
    return c;
  };

  // ── editor ──
  let c = card('Editor');
  _setRow(c, 'tabSize', 'Tab size', 'Spaces the Tab key inserts, and the width of tab characters.', _setNumber('tabSize', 1, 8));
  _setRow(c, 'fontCode', 'Code font', 'Used by the editor, the console and the wiki examples. Some fonts load when you are online; the others must be installed on your device.',
    _setSelect('fontCode', Object.entries(_SET_FONTS_CODE).map(([k, f]) => [k, f.label])));
  const cf = _setEl('input', 'set-input wide');
  cf.type = 'text'; cf.id = 'set-fontCodeCustom'; cf.placeholder = 'e.g. Iosevka, Hack'; cf.spellcheck = false;
  cf.oninput = () => _setChange('fontCodeCustom', cf.value);
  _setUI.ctl.fontCodeCustom = cf;
  _setRow(c, 'fontCodeCustom', 'Font name', 'One or more font family names, separated by commas.', cf);
  _setRow(c, 'fontSize', 'Font size', 'Size of the code in the editor.', _setRange('fontSize', 9, 32, 1, v => v + ' px'));
  _setRow(c, 'lineHeight', 'Line spacing', 'Height of a line, as a multiple of the font size.', _setRange('lineHeight', 1.1, 2.4, 0.05, v => v.toFixed(2) + '×'));
  _setRow(c, 'lineNumbers', 'Line numbers', 'Show the line numbers next to the code.', _setToggle('lineNumbers'));
  _setRow(c, 'syntax', 'Syntax coloring', 'Color keywords, strings, numbers, comments and so on. Off shows plain text.', _setToggle('syntax'));

  // ── typing help ──
  c = card('Typing help');
  _setRow(c, 'autoBrackets', 'Auto-close brackets', 'Typing ( [ or { adds the closing one too, typing the closing one skips over it, and selected text is wrapped.', _setToggle('autoBrackets'));
  _setRow(c, 'autoQuotes', 'Auto-close quotes', 'Typing " or \' adds the closing quote too, and selected text is wrapped.', _setToggle('autoQuotes'));
  _setRow(c, 'autoIndent', 'Smart indentation', 'Enter keeps the indentation and adds a level after a colon or an open bracket. Backspace removes a whole indent.', _setToggle('autoIndent'));
  _setRow(c, 'tooltips', 'Hover tooltips', 'Hover a function, method or class in the editor to see its signature and documentation.', _setToggle('tooltips'));
  _setRow(c, 'tooltipDelay', 'Tooltip delay', 'How long the pointer has to rest on a word before the tooltip appears.', _setRange('tooltipDelay', 0, 1500, 50, v => v + ' ms'));

  // ── appearance ──
  c = card('Appearance');
  const grid = _setEl('div', 'set-themes');
  for (const th of _SET_THEMES) {
    const b = _setEl('button', 'set-theme'); b.type = 'button'; b.dataset.theme = th.id; b.title = th.name;
    const sw = _setEl('div', 'set-theme-sw');
    [['bg', 'big'], ['bg2', ''], ['bg4', ''], ['blue', ''], ['sy-kw', ''], ['sy-fn', ''], ['sy-str', '']].forEach(([k, cls]) => { const i = _setEl('i', cls); i.style.background = th.v[k]; sw.appendChild(i); });
    const nm = _setEl('div', 'set-theme-nm'); nm.appendChild(_setEl('span', null, th.name)); nm.appendChild(_setEl('small', null, th.light ? 'light' : 'dark'));
    b.appendChild(sw); b.appendChild(nm);
    b.onclick = () => { _bpSet.theme = th.id; _bpSet.colors = {}; _bpSaveSettings(); _bpApplySettings(); _setRefresh(); };
    grid.appendChild(b); _setUI.themeBtns[th.id] = b;
  }
  c.appendChild(grid);
  _setRow(c, 'fontUi', 'Interface font', 'The font of the menus, tabs and wiki text.', _setSelect('fontUi', Object.entries(_SET_FONTS_UI).map(([k, f]) => [k, f.label])));

  // ── your own colours ──
  const resetColors = _setEl('button', 'set-btn', 'Reset colors'); resetColors.id = 'set-reset-colors';
  resetColors.onclick = () => { _bpSet.colors = {}; _bpSaveSettings(); _bpApplySettings(); _setRefresh(); };
  c = card('Colors', resetColors);
  const colors = _setEl('div', 'set-colors');
  for (const [gname, items] of _SET_COLOR_GROUPS) {
    colors.appendChild(_setEl('div', 'set-cgroup', gname));
    const g = _setEl('div', 'set-cgrid');
    for (const [k, label] of items) {
      const l = _setEl('label', 'set-color'), i = _setEl('input'), nm = _setEl('span', 'nm', label), hx = _setEl('span', 'hx');
      i.type = 'color'; i.id = 'set-color-' + k; i.dataset.key = k;
      i.oninput = () => { _setColorInput(k, i.value, false); hx.textContent = i.value; };
      i.onchange = () => { _setColorInput(k, i.value, true); };
      l.appendChild(i); l.appendChild(nm); l.appendChild(hx);
      g.appendChild(l); _setUI.pickers[k] = { label: l, input: i, hx };
    }
    colors.appendChild(g);
  }
  c.appendChild(colors);

  // ── console and running ──
  c = card('Console and running');
  _setRow(c, 'conFontSize', 'Console font size', null, _setRange('conFontSize', 9, 24, 1, v => v + ' px'));
  _setRow(c, 'clearConsole', 'Clear the console on Run', 'Start every run with an empty console.', _setToggle('clearConsole'));

  // ── preview ──
  const pv = _setEl('div', 'set-card'), ph = _setEl('div', 'set-card-h');
  ph.appendChild(_setEl('span', 'set-grow', 'Preview'));
  pv.appendChild(ph);
  const body = _setEl('div', 'set-prev-body');
  const ln = _setEl('div', 'set-prev-ln'); ln.id = 'set-prev-ln';
  const code = _setEl('pre', 'set-prev-code'); code.id = 'set-prev-code';
  body.appendChild(ln); body.appendChild(code); pv.appendChild(body);
  pv.appendChild(_setEl('div', 'set-prev-foot', 'This is how your code looks in the editor.'));
  side.appendChild(pv);

  _setRefresh();
}

function _setColorInput(k, value, commit) {
  const th = _setThemeById(_bpSet.theme);
  if (value.toLowerCase() === th.v[k].toLowerCase()) delete _bpSet.colors[k]; else _bpSet.colors[k] = value.toLowerCase();
  if (commit) { _bpSaveSettings(); _bpApplySettings(); _setRefresh(); }
  else { _bpApplyVars(); _setRenderPreview(); const p = _setUI.pickers[k]; if (p) p.label.classList.toggle('mod', k in _bpSet.colors); }
}

// controls show what _bpSet says
function _setRefresh() {
  for (const k of ['lineNumbers', 'syntax', 'autoBrackets', 'autoQuotes', 'autoIndent', 'tooltips', 'clearConsole']) { const i = _setUI.ctl[k]; if (i) i.checked = !!_bpSet[k]; }
  for (const k of ['fontSize', 'lineHeight', 'tooltipDelay', 'conFontSize']) {
    const i = _setUI.ctl[k]; if (i) { i.value = _bpSet[k]; i._val.textContent = i._fmt(_bpSet[k]); }
  }
  const tn = _setUI.ctl.tabSize; if (tn) tn.value = _bpSet.tabSize;
  const f1 = _setUI.ctl.fontCode; if (f1) f1.value = _bpSet.fontCode;
  const f2 = _setUI.ctl.fontUi; if (f2) f2.value = _bpSet.fontUi;
  const f3 = _setUI.ctl.fontCodeCustom; if (f3 && f3 !== document.activeElement) f3.value = _bpSet.fontCodeCustom;
  if (_setUI.rows.fontCodeCustom) _setUI.rows.fontCodeCustom.style.display = _bpSet.fontCode === 'custom' ? '' : 'none';
  if (_setUI.rows.tooltipDelay) _setUI.rows.tooltipDelay.classList.toggle('off', !_bpSet.tooltips);
  if (_setUI.ctl.tooltipDelay) _setUI.ctl.tooltipDelay.disabled = !_bpSet.tooltips;
  for (const id in _setUI.themeBtns) _setUI.themeBtns[id].classList.toggle('active', id === _bpSet.theme && true);
  const res = _bpResolveTheme(_bpSet);
  for (const k in _setUI.pickers) {
    const p = _setUI.pickers[k], v = res['--' + k];
    if (document.activeElement !== p.input) p.input.value = v;
    p.hx.textContent = v;
    p.label.classList.toggle('mod', k in _bpSet.colors);
  }
  const rc = document.getElementById('set-reset-colors'); if (rc) rc.disabled = !Object.keys(_bpSet.colors).length;
}

function _bpInitSettings() {
  _setBuildUI();
  _bpApplySettings();
}
window._bpSettings = { state: _bpSet, change: _setChange, resetAll: _setResetAll, apply: _bpApplySettings, vars: _bpSettingsVars };
_bpInitSettings();

// ══════════════════════════════════════════════════════════════
//  Boot
// ══════════════════════════════════════════════════════════════
fitCanvas();
_loadSavedProject();   // restore main.bpy + extra tabs (needs DEFAULT_CODE, so it runs here)
initPyodide();
</script>
</body>
</html>
